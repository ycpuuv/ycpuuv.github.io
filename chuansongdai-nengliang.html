<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>传送带上的能量去哪了 · 功与能的关系</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b1118;color:#e8eef6;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px 12px 90px}
h1{font-size:20px;margin:0 0 4px;font-weight:800;letter-spacing:.5px}
.sub{font-size:13px;color:#7f92a8;margin-bottom:14px;line-height:1.6}
.card{background:#131c26;border:1px solid #22303f;border-radius:12px;padding:12px;margin-bottom:12px}
canvas{display:block;width:100%;border-radius:10px;background:#0e151d}
.ttl{font-size:14px;color:#7fd0ff;font-weight:700;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.row .nm{width:96px;color:#9fb3c8;flex:0 0 auto;font-size:13px}
.bar{flex:1;height:16px;background:#1b2836;border-radius:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;border-radius:8px;transition:width .12s linear}
.val{width:62px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.check{margin-top:10px;padding-top:10px;border-top:1px dashed #2a3a4d;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.check b{font-size:19px;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.steps button{flex:1 1 auto;min-width:44px;padding:8px 4px;font-size:13px;border-radius:8px;border:1px solid #2a3a4d;background:#172230;color:#8fa4ba;font-weight:700}
.steps button.on{background:#1c4d6e;border-color:#2f89b8;color:#bfe9ff}
.steps button.done{background:#1a3a2a;border-color:#2d6b48;color:#8fe0b0}
#stepBox{font-size:15px;line-height:1.85}
#stepBox h3{font-size:16px;margin:0 0 8px;color:#ffd166}
#stepBox p{margin:0 0 8px}
#stepBox .k{color:#7fe0a0;font-weight:700}
#stepBox .w{color:#ff9b7b;font-weight:700}
#stepBox .cf{background:#3a1f21;border-left:3px solid #ff6b6b;padding:9px 11px;border-radius:0 8px 8px 0;margin:9px 0;font-size:14.5px;color:#ffc9c9;line-height:1.75}
#stepBox .cf b{color:#ff8f8f}
#stepBox .ask{background:#3a331c;border-left:3px solid #ffd166;padding:9px 11px;border-radius:0 8px 8px 0;margin:9px 0;font-size:14.5px;color:#ffe6a8;line-height:1.75}
#stepBox .sol{background:#183226;border-left:3px solid #5fd68a;padding:9px 11px;border-radius:0 8px 8px 0;margin:9px 0;font-size:14.5px;color:#c4f2d8;line-height:1.75}
#stepBox .sol b{color:#8fe0b0}
#stepBox .q{background:#1a2431;border-left:3px solid #ffd166;padding:8px 10px;border-radius:0 8px 8px 0;margin:8px 0;font-size:14px;color:#ffd9a0}
.ctrl{display:flex;gap:8px;margin-bottom:10px}
.ctrl button{flex:1;padding:11px;font-size:15px;font-weight:700;border-radius:10px;border:none;background:#1f6f9c;color:#fff}
.ctrl button.ghost{background:#22303f;color:#9fb3c8}
.foot{position:fixed;left:0;right:0;bottom:0;background:#0b1118ee;border-top:1px solid #22303f;padding:10px 12px;display:flex;gap:8px;backdrop-filter:blur(6px)}
.foot button{flex:1;padding:12px;font-size:15px;font-weight:800;border-radius:10px;border:none}

</style>
</head>
<body>
<h1>传送带上的能量去哪了</h1>
<div class="sub">一道传送带题，能挖出五个让高三学生当场卡住的矛盾。<br>每一个,都先别急着给答案。</div>

<div class="card">
  <canvas id="cv" width="760" height="560"></canvas>
  <div class="ctrl" style="margin-top:10px">
    <button id="play">▶ 播放全程</button>
    <button id="reset" class="ghost">↺ 重来</button>
  </div>
  <div class="tips">红点是木块刚放上去时在皮带上做的记号——看它跑到哪去了，那就是「相对位移」。</div>
</div>

<div class="card">
  <div class="ttl">能量账本（实时）</div>
  <div class="row"><span class="nm">重力势能减少</span><div class="bar"><i id="b1" style="background:#4fa3d1"></i></div><span class="val" id="v1">0.0</span></div>
  <div class="row"><span class="nm">动能增加</span><div class="bar"><i id="b2" style="background:#5fd68a"></i></div><span class="val" id="v2">0.0</span></div>
  <div class="row"><span class="nm">摩擦生热</span><div class="bar"><i id="b3" style="background:#f0a04b"></i></div><span class="val" id="v3">0.0</span></div>
  <div class="row"><span class="nm">传给皮带</span><div class="bar"><i id="b4" style="background:#e8d44d"></i></div><span class="val" id="v4">0.0</span></div>
  <div class="check"><span>差额（消失的能量）</span><b id="gap" style="color:#ff7b7b">0.00 J</b></div>
</div>

<div class="card">
  <div class="ttl">五个矛盾，逐个破解</div>
  <div class="steps" id="steps"></div>
  <div id="stepBox"></div>
</div>

<div class="foot">
  <button id="prev">上一步</button>
  <button id="next">下一步 →</button>
</div>

<script>
/* ============ 物理参数 ============ */
const TH=37*Math.PI/180, L=7, m=0.4, MU=0.25, V0=4, G=10;
const SIN=0.6, COS=0.8;   /* 教材取值 sin37°=0.6, cos37°=0.8 */
const f=MU*m*G*COS;                 // 0.8 N
const a1=G*(SIN+MU*COS);            // 8
const a2=G*(SIN-MU*COS);            // 4
const T1=V0/a1;                     // 0.5 s
const S1=0.5*a1*T1*T1;              // 1 m
const T2=(Math.sqrt(V0*V0+2*a2*(L-S1))-V0)/a2;  // 1 s
const TEND=T1+T2;                   // 1.5 s
const VEND=V0+a2*T2;                // 8
const EP=m*G*L*SIN;                 // 16.8
const EK=0.5*m*VEND*VEND;           // 12.8
const Q=f*(V0*T1-S1)*1 ;            // stage1 part
const QEND=f*((V0*T1-S1)+( (S1+V0*T2+0.5*a2*T2*T2) - S1 - V0*T2 ) + 0); // placeholder
/* 相对路程：stage1 = v0*t - s ; stage2 = s - v0*t 的增量 */
const R1=V0*T1-S1;                                  // 1 m
const S2=L-S1;                                       // 6 m
const R2=S2-V0*T2;                                   // 2 m
const REND=R1+R2;                                    // 3 m
const QALL=f*REND;                                   // 2.4 J
const Wb1=-f*V0*T1;                                  // -1.6 J
const Wb2= f*V0*T2;                                  // +3.2 J
const WbEND=Wb1+Wb2;                                 // +1.6 J

function s(t){ if(t<=T1) return 0.5*a1*t*t; const d=t-T1; return S1+V0*d+0.5*a2*d*d; }
function v(t){ if(t<=T1) return a1*t; return V0+a2*(t-T1); }
function rel(t){ if(t<=T1) return V0*t-0.5*a1*t*t; const d=t-T1; return R1+0.5*a2*d*d; }
function wb(t){ if(t<=T1) return -f*V0*t; const d=t-T1; return Wb1+f*V0*d; }

/* ============ 画布 ============ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=760,H=560;
const P0={x:110,y:110}, P1={x:660,y:110+550*Math.tan(TH)};
const MAT=Math.tan(TH);
/* 斜面两点：从左上到右下 */
const PX=62;                       // 1 m = 62 px
const A={x:56,y:96};               // 斜面顶端
const U={x:0.8,y:0.6};             // 沿斜面向下单位矢量
const N={x:-0.6,y:0.8};            // 法向（正=外/上侧）
function ptOn(d,off){ return {x:A.x+U.x*d*PX+N.x*off*PX, y:A.y+U.y*d*PX+N.y*off*PX}; }
function drawBelt(t){
  const beltS=V0*t;
  // 皮带主体
  ctx.save();
  ctx.lineCap='round';
  const c1=ptOn(0,-0.16), c2=ptOn(L+1.35,-0.16);
  const c3=ptOn(0,0.16), c4=ptOn(L+1.35,0.16);
  ctx.strokeStyle='#243447'; ctx.lineWidth=26;
  ctx.beginPath(); ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y); ctx.stroke();
  ctx.strokeStyle='#3c5872'; ctx.lineWidth=22;
  ctx.beginPath(); ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y); ctx.stroke();
  // 纹理：随带速向"下坡"移动（v0 向下）
  ctx.strokeStyle='#5c7c99'; ctx.lineWidth=3;
  for(let i=0;i<40;i++){
    const d=((i*0.30 + beltS) % (L+2)) - 0.5;
    if(d<-0.4||d>L+1.4) continue;
    const q1=ptOn(d,-0.16), q2=ptOn(d,0.16);
    ctx.beginPath(); ctx.moveTo(q1.x,q1.y); ctx.lineTo(q2.x,q2.y); ctx.stroke();
  }
  ctx.restore();
  // 端点滚轮
  
  [0,L+1.35].forEach(d=>{
    const c=ptOn(d,0);
    ctx.beginPath(); ctx.arc(c.x,c.y,13,0,7); ctx.fillStyle='#1a2531'; ctx.fill();
    ctx.strokeStyle='#48627d'; ctx.lineWidth=3; ctx.stroke();
  });
}
function drawBlock(t){
  const d=s(t);
  const c=ptOn(d,-0.52);
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(TH);
  ctx.fillStyle='#e8c26a'; ctx.strokeStyle='#fff3c4'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(-19,-19,38,38,5); ctx.fill(); ctx.stroke();
  ctx.restore();
  // 速度箭头
  const vv=v(t);
  const p1=ptOn(d,-1.05), p2=ptOn(d+vv*0.085,-1.05);
  ctx.strokeStyle='#7fe0a0'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x);
  ctx.beginPath(); ctx.moveTo(p2.x,p2.y);
  ctx.lineTo(p2.x-11*Math.cos(ang-0.4),p2.y-11*Math.sin(ang-0.4));
  ctx.lineTo(p2.x-11*Math.cos(ang+0.4),p2.y-11*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fillStyle='#7fe0a0'; ctx.fill();
  ctx.fillStyle='#7fe0a0'; ctx.font='bold 17px sans-serif'; ctx.textAlign='left';
  ctx.fillText('v='+vv.toFixed(1)+' m/s', p2.x+8, p2.y+5);
  // 皮带速度
  ctx.fillStyle='#8fa4ba'; ctx.font='bold 15px sans-serif';
  const q=ptOn(L+1.5,0); ctx.textAlign='right'; ctx.fillText('皮带 4 m/s ↓', q.x-24, q.y+44);
}
function drawMark(t){
  // 木块放上去那一刻，皮带上做的记号
  const beltS=V0*t;
  const dMark=beltS;               // 记号沿带走过的距离
  if(dMark>L+1.35) return;
  const c=ptOn(dMark,0);
  ctx.beginPath(); ctx.arc(c.x,c.y,7,0,7); ctx.fillStyle='#ff5f5f'; ctx.fill();
  ctx.strokeStyle='#ff9d9d'; ctx.lineWidth=2; ctx.stroke();
}
function drawRel(t){
  const sB=s(t), sM=Math.min(V0*t, L+1.35);
  const a1=ptOn(sB,0.46), b1=ptOn(sM,0.46);
  ctx.strokeStyle='#ff9d9d'; ctx.lineWidth=2.5; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(a1.x,a1.y); ctx.lineTo(b1.x,b1.y); ctx.stroke();
  ctx.setLineDash([]);
  [[a1,U],[b1,U]].forEach(([p0,u])=>{
    ctx.beginPath(); ctx.moveTo(p0.x-N.x*6,p0.y-N.y*6); ctx.lineTo(p0.x+N.x*6,p0.y+N.y*6);
    ctx.strokeStyle='#ff9d9d'; ctx.lineWidth=2.5; ctx.stroke();
  });
  const d=Math.abs(sB-sM);
  if(d>0.22){
    ctx.fillStyle='#ffb3b3'; ctx.font='bold 17px sans-serif'; ctx.textAlign='left';
    ctx.fillText('● 记号与木块相距 '+d.toFixed(1)+' m', 24, H-28);
  }
}
function drawRuler(t){
  // 标出 7 m 与当前位移
  const p1=ptOn(0,1.0), p2=ptOn(L,1.0);
  ctx.strokeStyle='#2f4459'; ctx.lineWidth=2; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#5c7288'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
  const mid=ptOn(L/2,1.3); ctx.fillText('L = 7 m', mid.x, mid.y);
  const pc=ptOn(s(t),1.0);
  ctx.fillStyle='#4fa3d1'; ctx.beginPath(); ctx.arc(pc.x,pc.y,5,0,7); ctx.fill();
}
function drawAll(t){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0e151d'; ctx.fillRect(0,0,W,H);
  // 地面/背景
  ctx.fillStyle='#131c26'; ctx.fillRect(0,H-70,W,70);
  ctx.fillStyle='#5c7288'; ctx.font='bold 15px sans-serif'; ctx.textAlign='left';
  ctx.fillText('θ = 37°', 26, 128);
  // 角度弧
  ctx.strokeStyle='#3c5872'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(A.x,A.y,58,0,Math.atan2(U.y,U.x)); ctx.stroke();
  drawBelt(t); drawRuler(t); drawMark(t); drawRel(t); drawBlock(t);
  // 阶段提示
  const st = t<=T1 ? '阶段①：木块比皮带慢 → 摩擦力对木块向下（做正功）'
                   : '阶段②：木块比皮带快 → 摩擦力对木块向上（做负功）';
  ctx.fillStyle = t<=T1 ? '#8fe0b0' : '#ffd166';
  ctx.font='bold 17px sans-serif'; ctx.textAlign='left';
  ctx.fillText(st, 24, 40);
  // 时间
  ctx.fillStyle='#7f92a8'; ctx.font='bold 16px sans-serif'; ctx.textAlign='right';
  ctx.fillText('t = '+t.toFixed(2)+' s', W-24, 40);
}

/* ============ 能量面板 ============ */
const MAXE=EP;
function setBar(id,val,frac){ document.getElementById(id).style.width=Math.min(100,frac*100)+'%'; }
function updatePanel(t){
  const ep=m*G*s(t)*SIN, ek=0.5*m*v(t)*v(t), q=f*rel(t), w=wb(t);
  document.getElementById('v1').textContent=ep.toFixed(1);
  document.getElementById('v2').textContent=ek.toFixed(1);
  document.getElementById('v3').textContent=q.toFixed(1);
  document.getElementById('v4').textContent=(w>=0?'+':'')+w.toFixed(1);
  setBar('b1',ep,ep/MAXE); setBar('b2',ek,ek/MAXE); setBar('b3',q,q/MAXE); setBar('b4',Math.abs(w),Math.abs(w)/MAXE);
  const gap=ep-ek-q-w;      // 应为 0
  const g=document.getElementById('gap');
  g.textContent=(Math.abs(gap)<0.05?'0.00':gap.toFixed(2))+' J';
  g.style.color=Math.abs(gap)<0.05?'#7fe0a0':'#ff7b7b';
}

/* ============ 播放 ============ */
let T=0, playing=false, last=0, SPEED=0.55;
function loop(ts){
  if(!playing) return;
  if(!last) last=ts;
  const dt=(ts-last)/1000; last=ts;
  T+=dt*SPEED;
  if(T>=TEND){ T=TEND; playing=false; document.getElementById('play').textContent='▶ 播放全程'; }
  drawAll(T); updatePanel(T);
  if(playing) requestAnimationFrame(loop);
}
document.getElementById('play').onclick=()=>{
  if(playing){ playing=false; last=0; document.getElementById('play').textContent='▶ 继续'; return; }
  if(T>=TEND) T=0;
  playing=true; last=0; document.getElementById('play').textContent='⏸ 暂停';
  requestAnimationFrame(loop);
};
document.getElementById('reset').onclick=()=>{ T=0; playing=false; last=0; document.getElementById('play').textContent='▶ 播放全程'; drawAll(0); updatePanel(0); };

/* ============ 六步 ============ */
const STEPS=[
 {k:'矛盾①', h:'负功，怎么还加速了？',
  body:`<div class="cf">把全过程算一遍：摩擦力对木块做功 <b>−4.0 J</b>。<br>可木块的速度，从 0 变成了 8 m/s。</div>
  <div class="ask">做负功，动能反而增加？这一步很多学生当场卡住。</div>
  <div class="sol">负功不是"倒扣"，是<b>少给</b>。<br>
  重力给了 16.8 J，摩擦拿走 4.0 J，净到手 12.8 J——正好等于动能增加量。<br>
  就像工资 16.8、扣税 4.0、到手 12.8。不能说"扣了税你怎么还涨工资"。<br>
  <b>功要一项一项算，动能只看净功。</b></div>
  <p class="tips">看动画：绿箭头是速度，橙条是生热，蓝条是势能减少。</p>`},

 {k:'矛盾②', h:'做正功，怎么还生热？',
  body:`<div class="cf">阶段①，摩擦力对木块做 <b>正功 +0.8 J</b>。<br>可这同一段时间里，木块和皮带之间<b>生了 0.8 J 的热</b>。</div>
  <div class="ask">课本上说"克服摩擦力做功才生热"。这里摩擦明明在帮忙，怎么还发热？</div>
  <div class="sol">因为这是<b>两把不同的尺子</b>：<br>
  · <b>做功</b>看物体<b>对地的位移</b><br>
  · <b>生热</b>看两物体之间的<b>相对路程</b><br>
  摩擦做正功、做负功、不做功，都可能生热。生热只看有没有<b>相对滑动</b>。</div>
  <div class="cf">⚠ 陷阱：阶段①两个数都是 0.8，<b>纯属巧合</b>。<br>别把它记成"做功 = 生热"，阶段②立刻就不相等了。</div>`},

 {k:'矛盾③', h:'4.0 还是 2.4？',
  body:`<div class="cf">"摩擦生热 = 克服摩擦力做的功"——按这句话算，Q = <b>4.0 J</b>。<br>可是正确答案是 <b>2.4 J</b>。差 1.6 J。</div>
  <div class="ask">同一件事，两个算法，两个结果。哪个错了？</div>
  <div class="sol">都错在那个前提上。正确式子只有一条：<br>
  <b>Q = f × 相对路程 = 0.8 × 3 = 2.4 J</b><br>
  相对路程：阶段① 皮带多走 1 m，阶段② 木块多走 2 m，合计 3 m。</div>
  <div class="sol">还有一条更漂亮的等价关系：<br>
  <b>摩擦力对木块做功 + 对皮带做功 = −Q</b><br>
  (−4.0) + (+1.6) = <b>−2.4</b> ✓</div>
  <div class="cf">"克服摩擦力做功"只在<b>皮带静止</b>时才对。<br>皮带一动，就必须换成相对路程。<b>这是本题的命门。</b></div>`},

 {k:'矛盾④', h:'匀速，怎么还获得能量？',
  body:`<div class="cf">皮带是<b>匀速</b>运动的。<br>匀速 → 合力为零 → 合力做功为零。<br>那它凭什么"获得 1.6 J"？</div>
  <div class="ask">合力为零的物体，能量怎么会变？</div>
  <div class="sol"><b>净功为零，不等于每个力都不做功。</b><br>
  皮带身上有两个力：电动机的牵引、木块给的摩擦。大小相等、方向相反，<b>合力为零</b>，但两个力<b>都在做功</b>。<br>
  · 阶段① 摩擦 −1.6 J<br>
  · 阶段② 摩擦 +3.2 J<br>
  · 摩擦净给皮带 <b>+1.6 J</b><br>
  · 电动机净做 <b>−1.6 J</b>（阶段②它在被倒拖，相当于回收）<br>
  两者相加正好为零——皮带能量没变，<b>但电机少出了 1.6 J</b>。</div>
  <div class="sol">所以"皮带获得 1.6 J"这句话要说得更准：<br><b>皮带替电动机省了 1.6 J。</b></div>`},

 {k:'矛盾⑤', h:'少了 1.6 J，守恒破了吗？',
  body:`<div class="cf">势能减少 <b>16.8 J</b><br>动能增加 <b>12.8 J</b>，生热 <b>2.4 J</b><br>12.8 + 2.4 = <b>15.2 J</b></div>
  <div class="ask">还有 1.6 J 呢？能量守恒是错的吗？</div>
  <div class="sol">账本没算全。漏了第四个账户：<b>电动机少输出的 1.6 J</b>。<br><br>
  <b>16.8 = 12.8 + 2.4 + 1.6</b><br><br>
  左边右边都是 16.8。能量一分没少，只是从"机械能账户"转到了"电能账户"。</div>
  <div class="cf">记住这一句：<b>所谓能量消失，都是账户没找全。</b><br>找不到的时候，就问一句——<b>还有谁在受力？还有谁在动？</b></div>`},

 {k:'收束', h:'三条能带走的结论',
  body:`<p class="sol"><b>① 摩擦生热 = f × 相对路程</b><br>永远不是位移。</p>
  <p class="sol"><b>② 多消耗的电能 = f × 皮带位移</b></p>
  <p class="sol"><b>③ 功是能量转化的量度</b><br>换一个对象，就换一个账户；账不平，就说明还有对象没算。</p>
  <div class="cf">四个常见情境对照：<br>
  水平同向 × 倾斜同向 → 摩擦总功为正，电动机多出力<br>
  水平反向 × 倾斜反向 → 摩擦总功为负，机械能转成内能<br>
  <b>不管哪种，Q 都是 f × 相对路程，能量永远守恒。</b></div>
  <p class="tips">课堂用法：每个矛盾先让学生自己算、自己发现不对，再点下一步。别一次讲完。</p>`}
];
let cur=0;
const box=document.getElementById('stepBox'), stepsEl=document.getElementById('steps');
STEPS.forEach((st,i)=>{
  const b=document.createElement('button'); b.textContent=st.k; b.onclick=()=>go(i); stepsEl.appendChild(b);
});
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  [...stepsEl.children].forEach((b,j)=>{ b.className = j===cur?'on':(j<cur?'done':''); });
  const st=STEPS[cur];
  box.innerHTML='<h3>'+st.h+'</h3>'+st.body;
  // 切到对应的物理时刻
  const marks=[TEND, T1, TEND, TEND, TEND, TEND];
  T=marks[cur]; playing=false; last=0;
  document.getElementById('play').textContent='▶ 播放全程';
  drawAll(T); updatePanel(T);
}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);

/* 初始化 */
drawAll(0); updatePanel(0); go(0);
</script>
</body>
</html>
