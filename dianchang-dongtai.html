<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>圆周上各点电势 · φ-x 图像的由来</title>
<style>
  :root{--bg:#080c15;--ink:#e9eefb;--dim:#8ea3c4;--gold:#ffc96b;--cyan:#4fd8ff;
        --pink:#ff7ac0;--line:#1d2942;--panel:#0d1422;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block}
  #bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,16,28,.94);
    border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;gap:18px;
    align-items:center;flex-wrap:wrap;z-index:5}
  #bar label{font-size:13px;color:var(--dim);white-space:nowrap}
  #bar b{color:var(--gold);font-variant-numeric:tabular-nums}
  input[type=range]{width:190px;accent-color:#5b86c7;vertical-align:middle}
  button{background:#16223a;color:var(--ink);border:1px solid #24344f;border-radius:7px;
    padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer}
  button:hover{background:#1d2c49}
  button.on{background:#2a3f63;border-color:#5b86c7}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#c9d6ec;cursor:pointer}
  #note{position:fixed;left:16px;top:12px;font-size:12px;color:#6b7f9e;z-index:4;pointer-events:none}
  @media (max-width:820px){
    #bar{gap:10px;padding:8px 12px 10px}
    input[type=range]{width:130px}
    #note{font-size:11px}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="note">左：圆上一点绕行，读出该点电势　　右：把 (x, φ) 逐点画出来</div>
<div id="bar">
  <label>场强方向 β <b id="vb">120°</b></label>
  <input type="range" id="beta" min="0" max="360" step="1" value="120">
  <button id="play" class="on">暂停</button>
  <button id="reset">重置</button>
  <label>速度 <b id="vs">0.6×</b></label>
  <input type="range" id="spd" min="0.1" max="1" step="0.1" value="0.6">
  <label class="chk"><input type="checkbox" id="auto"> 自动转动场方向</label>
</div>
<script>
(function(){
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,L={},Rp={};

const R=1.0;              // 圆半径
let E=1.0;                // 场强大小（取 φ₀ = E·R = 1）
let beta=120*Math.PI/180; // 场方向
let alpha=0;              // 圆周上取点的角参数
let playing=true, speed=0.6, autoSpin=false;

/* ---------- 画布与布局 ---------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const barH = W<820 ? 108 : 58;
  const avail=H-barH-10;
  if(W>=820){
    L={x:10,y:40,w:W*0.5-20,h:avail-50};
    Rp={x:W*0.5+10,y:40,w:W*0.5-20,h:avail-50};
  }else{
    L={x:8,y:44,w:W-16,h:avail*0.58-30};
    Rp={x:8,y:44+avail*0.58,w:W-16,h:avail*0.42-30};
  }
}
function view(rect,x0,x1,y0,y1){
  const s=Math.min(rect.w/(x1-x0), rect.h/(y1-y0));
  const ox=rect.x+(rect.w-(x1-x0)*s)/2 - x0*s;
  const oy=rect.y+(rect.h-(y1-y0)*s)/2 + y1*s;
  return {s, X:x=>ox+x*s, Y:y=>oy-y*s};
}

/* ---------- 物理 ---------- */
const f0=E*R;                                  // 电势幅值
function phiAt(a,b){ return -E*R*Math.cos(a-b); } // 以圆心为零势点
function px(a){ return R*(1+Math.cos(a)); }
function py(a){ return R*Math.sin(a); }

/* ---------- 绘图 ---------- */
function arrow(x0,y0,x1,y1,col,w){
  ctx.strokeStyle=col; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  const ang=Math.atan2(y1-y0,x1-x0), h=6;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x1-h*Math.cos(ang-0.4), y1-h*Math.sin(ang-0.4));
  ctx.lineTo(x1-h*Math.cos(ang+0.4), y1-h*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}

function drawLeft(){
  const g=view(L,-0.45,2.3,-1.35,1.35);
  ctx.save();
  // 背景
  ctx.fillStyle='#0b1220';
  ctx.fillRect(L.x,L.y,L.w,L.h);

  // 等势线（垂直于 E）
  const dx=Math.sin(beta), dy=-Math.cos(beta);
  for(let k=-6;k<=6;k++){
    const cx=R + k*0.34*Math.cos(beta), cy=0 + k*0.34*Math.sin(beta);
    const ax=g.X(cx-dx*2.2), ay=g.Y(cy-dy*2.2);
    const bx=g.X(cx+dx*2.2), by=g.Y(cy+dy*2.2);
    ctx.strokeStyle='rgba(90,120,170,0.16)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }

  // 场强箭头网格
  for(let i=0;i<7;i++)for(let j=0;j<5;j++){
    const wx=-0.2+i*0.38, wy=-1.15+j*0.57;
    const len=0.26;
    const x0=g.X(wx), y0=g.Y(wy);
    const x1=g.X(wx+len*Math.cos(beta)), y1=g.Y(wy+len*Math.sin(beta));
    arrow(x0,y0,x1,y1,'rgba(255,201,107,0.55)',1.2);
  }

  // 坐标轴
  ctx.strokeStyle='rgba(150,170,200,0.55)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(g.X(-0.4),g.Y(0)); ctx.lineTo(g.X(2.28),g.Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(g.X(0),g.Y(1.3)); ctx.lineTo(g.X(0),g.Y(-1.3)); ctx.stroke();
  ctx.fillStyle='#93a6c6'; ctx.font='13px "PingFang SC",sans-serif';
  ctx.fillText('x',g.X(2.28)-4,g.Y(0)+18);
  ctx.fillText('y',g.X(0)+8,g.Y(1.3)-4);
  ctx.fillText('O',g.X(0)-16,g.Y(0)+16);

  // 圆
  ctx.strokeStyle='rgba(220,232,255,0.9)'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.arc(g.X(R),g.Y(0),R*g.s,0,Math.PI*2); ctx.stroke();
  // 圆心
  ctx.fillStyle='#9fb3d4';
  ctx.beginPath(); ctx.arc(g.X(R),g.Y(0),3,0,6.283); ctx.fill();
  ctx.fillText('C',g.X(R)+8,g.Y(0)+5);
  ctx.strokeStyle='rgba(160,180,210,0.7)';
  ctx.beginPath(); ctx.moveTo(g.X(R),g.Y(0)); ctx.lineTo(g.X(R+R*Math.cos(1.0)),g.Y(R*Math.sin(1.0))); ctx.stroke();
  ctx.fillText('R',g.X(R+R*0.5*Math.cos(1.0))+6,g.Y(R*0.5*Math.sin(1.0))-4);

  // 两个极值点
  for(const a of [beta, beta+Math.PI]){
    const X=g.X(px(a)), Y=g.Y(py(a));
    ctx.fillStyle = Math.cos(a-beta)<0 ? '#ff8a6a' : '#6fb6ff';
    ctx.beginPath(); ctx.arc(X,Y,4.5,0,6.283); ctx.fill();
  }

  // 探针点
  const PX=g.X(px(alpha)), PY=g.Y(py(alpha));
  const glow=ctx.createRadialGradient(PX,PY,0,PX,PY,22);
  glow.addColorStop(0,'rgba(79,216,255,0.55)'); glow.addColorStop(1,'rgba(79,216,255,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(PX,PY,22,0,6.283); ctx.fill();
  ctx.fillStyle='#4fd8ff'; ctx.beginPath(); ctx.arc(PX,PY,6.5,0,6.283); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();

  // 标注
  ctx.fillStyle='#e9eefb'; ctx.font='bold 15px "PingFang SC",sans-serif';
  ctx.fillText('圆上一点 P', L.x+12, L.y+22);
  ctx.font='14px "PingFang SC",sans-serif';
  ctx.fillStyle='#ffc96b';
  ctx.fillText('E 方向 β = '+Math.round(beta*180/Math.PI)+'°', L.x+12, L.y+44);
  ctx.fillStyle='#4fd8ff';
  ctx.fillText('φ(P) = '+phiAt(alpha,beta).toFixed(2)+' φ₀', L.x+12, L.y+66);
  ctx.restore();
}

function drawRight(){
  const g=view(Rp,-0.15,2.15,-1.28,1.28);
  ctx.save();
  ctx.fillStyle='#0b1220'; ctx.fillRect(Rp.x,Rp.y,Rp.w,Rp.h);

  // 网格
  ctx.strokeStyle='rgba(70,95,140,0.22)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const xv=i*0.5;
    ctx.beginPath(); ctx.moveTo(g.X(xv),g.Y(-1.25)); ctx.lineTo(g.X(xv),g.Y(1.25)); ctx.stroke();
  }
  for(let j=-2;j<=2;j++){
    const yv=j*0.5;
    ctx.beginPath(); ctx.moveTo(g.X(0),g.Y(yv)); ctx.lineTo(g.X(2.1),g.Y(yv)); ctx.stroke();
  }

  // 轴
  ctx.strokeStyle='rgba(150,170,200,0.6)'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(g.X(0),g.Y(0)); ctx.lineTo(g.X(2.1),g.Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(g.X(0),g.Y(-1.25)); ctx.lineTo(g.X(0),g.Y(1.25)); ctx.stroke();
  ctx.fillStyle='#93a6c6'; ctx.font='13px "PingFang SC",sans-serif';
  ctx.fillText('x',g.X(2.1)-2,g.Y(0)+18);
  ctx.fillText('φ',g.X(0)+8,g.Y(1.25)-6);
  ctx.fillText('0',g.X(0)-14,g.Y(0)+16);
  ctx.fillText('R',g.X(R)-4,g.Y(0)+16);
  ctx.fillText('2R',g.X(2*R)-8,g.Y(0)+16);
  ctx.fillText('+φ₀',g.X(0)-38,g.Y(f0)+5);
  ctx.fillText('−φ₀',g.X(0)-38,g.Y(-f0)+5);

  // 完整曲线（淡）
  ctx.strokeStyle='rgba(255,122,192,0.28)'; ctx.lineWidth=1.6;
  ctx.beginPath();
  for(let i=0;i<=420;i++){
    const a=2*Math.PI*i/420;
    const X=g.X(px(a)), Y=g.Y(phiAt(a,beta));
    if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
  }
  ctx.stroke();

  // 已走过的一段（亮，带拖尾）
  const N=140;
  for(let k=0;k<N;k++){
    const a1=alpha-2*Math.PI*(k+1)/N, a2=alpha-2*Math.PI*k/N;
    const t=1-k/N;
    ctx.strokeStyle='rgba(255,122,192,'+(0.15+0.75*t).toFixed(3)+')';
    ctx.lineWidth=1.2+2.4*t;
    ctx.beginPath();
    ctx.moveTo(g.X(px(a1)),g.Y(phiAt(a1,beta)));
    ctx.lineTo(g.X(px(a2)),g.Y(phiAt(a2,beta)));
    ctx.stroke();
  }

  // 两个极值位置
  const xLow=px(beta), xHigh=px(beta+Math.PI);
  ctx.setLineDash([3,5]); ctx.lineWidth=1;
  ctx.strokeStyle='rgba(255,201,107,0.45)';
  ctx.beginPath(); ctx.moveTo(g.X(xLow),g.Y(-f0)); ctx.lineTo(g.X(xLow),g.Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(g.X(xHigh),g.Y(f0)); ctx.lineTo(g.X(xHigh),g.Y(0)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#ffc96b'; ctx.font='12px "PingFang SC",sans-serif';
  ctx.fillText('φ最小', g.X(xLow)-14, g.Y(-f0)+18);
  ctx.fillText('φ最大', g.X(xHigh)-14, g.Y(f0)-8);
  ctx.fillStyle='#8ea3c4';
  ctx.fillText((xLow/R).toFixed(2)+'R', g.X(xLow)-12, g.Y(0)+30);
  ctx.fillText((xHigh/R).toFixed(2)+'R', g.X(xHigh)-12, g.Y(0)+30);

  // 当前点 + 虚线
  const CX=g.X(px(alpha)), CY=g.Y(phiAt(alpha,beta));
  ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(79,216,255,0.45)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(g.X(0),CY); ctx.lineTo(CX,CY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX,g.Y(0)); ctx.lineTo(CX,CY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#ff7ac0'; ctx.beginPath(); ctx.arc(CX,CY,6,0,6.283); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();

  ctx.fillStyle='#e9eefb'; ctx.font='bold 15px "PingFang SC",sans-serif';
  ctx.fillText('φ–x 图（每个 x 对应圆上两点）', Rp.x+12, Rp.y+22);
  ctx.restore();
}

function frame(t){
  ctx.clearRect(0,0,W,H);
  drawLeft(); drawRight();
}

/* ---------- 动画 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing) alpha += dt*speed*2*Math.PI/12;   // 12 秒一圈（1×）
  if(autoSpin) beta += dt*0.35;
  if(alpha>2*Math.PI*2) alpha-=2*Math.PI*2;
  frame(now);
  requestAnimationFrame(loop);
}

/* ---------- 交互 ---------- */
document.getElementById('beta').addEventListener('input',e=>{
  beta=parseFloat(e.target.value)*Math.PI/180;
  document.getElementById('vb').textContent=e.target.value+'°';
});
document.getElementById('spd').addEventListener('input',e=>{
  speed=parseFloat(e.target.value);
  document.getElementById('vs').textContent=speed.toFixed(1)+'×';
});
document.getElementById('play').addEventListener('click',e=>{
  playing=!playing;
  e.target.textContent=playing?'暂停':'播放';
  e.target.classList.toggle('on',playing);
});
document.getElementById('reset').addEventListener('click',()=>{ alpha=0; });
document.getElementById('auto').addEventListener('change',e=>{ autoSpin=e.target.checked; });

const HK={};
location.hash.slice(1).split('&').forEach(function(kv){
  if(!kv) return; const i=kv.indexOf('=');
  if(i<0) HK[kv]=true; else HK[kv.slice(0,i)]=kv.slice(i+1);
});
if(HK.beta!==undefined){
  beta=parseFloat(HK.beta)*Math.PI/180;
  document.getElementById('beta').value=HK.beta;
  document.getElementById('vb').textContent=HK.beta+'°';
}
if(HK.alpha!==undefined){ alpha=parseFloat(HK.alpha); }
if(HK.pause){ playing=false; document.getElementById('play').textContent='播放';
  document.getElementById('play').classList.remove('on'); }

window.addEventListener('resize',()=>{ resize(); });
resize();
requestAnimationFrame(loop);

if(location.hash.indexOf('test')>=0){
  const out={};
  beta=120*Math.PI/180;
  out.ext120=window.__app?null:null;
  out.x1=+px(beta).toFixed(4); out.x2=+px(beta+Math.PI).toFixed(4);
  out.phiAt0=+phiAt(beta,beta).toFixed(4); out.phiAtPi=+phiAt(beta+Math.PI,beta).toFixed(4);
  beta=0;
  out.b0_phi=[+phiAt(0,0).toFixed(3),+phiAt(Math.PI,0).toFixed(3),+phiAt(Math.PI/2,0).toFixed(3)];
  out.b0_x=[+px(0).toFixed(3),+px(Math.PI).toFixed(3),+px(Math.PI/2).toFixed(3)];
  beta=90*Math.PI/180;
  out.b90=[+px(Math.PI/2).toFixed(3),+phiAt(Math.PI/2,Math.PI/2).toFixed(3),+phiAt(Math.PI,Math.PI/2).toFixed(3)];
  document.title='TEST '+JSON.stringify(out);
}

window.__app={
  phi:(a,b)=>phiAt(a,b===undefined?beta:b),
  x:(a)=>px(a),
  setBeta:(deg)=>{ beta=deg*Math.PI/180; document.getElementById('beta').value=deg;
                   document.getElementById('vb').textContent=deg+'°'; },
  setAlpha:(a)=>{ alpha=a; },
  extremes:()=>{ const c=Math.cos(beta);
    return {xNeg:+px(beta).toFixed(4), xPos:+px(beta+Math.PI).toFixed(4),
            phiMax:+E*R, phiMin:-E*R, cos:+c.toFixed(4)}; }
};
})();
</script>
</body>
</html>
