<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考动态平衡 · 交互课件</title>
<script src="p5.min.js"></script>
<style>
  body { margin:0; background:#0d1117; color:#e6edf3; font-family:"Microsoft YaHei",sans-serif; }
  #wrap { max-width:1020px; margin:0 auto; padding:14px; }
  h1 { text-align:center; font-size:26px; margin:8px 0 2px; color:#58a6ff; }
  .sub { text-align:center; font-size:13px; color:#8b949e; margin-bottom:12px; }
  .tabs { display:flex; justify-content:center; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tab { padding:7px 14px; border-radius:18px; cursor:pointer; font-size:14px; background:#161b22; color:#c9d1d9; border:1px solid #30363d; transition:all .2s; }
  .tab.on { background:#1f6feb; color:#fff; border-color:#1f6feb; }
  canvas { display:block; margin:0 auto; border-radius:10px; }
  .sliders { max-width:960px; margin:8px auto 0; background:#161b22; border:1px solid #30363d; border-radius:10px; padding:10px 14px; display:none; }
  .sliders.show { display:block; }
  .sl-row { display:flex; align-items:center; gap:10px; margin:5px 0; font-size:14px; flex-wrap:wrap; }
  .sl-row label { width:150px; color:#c9d1d9; }
  .sl-row input[type=range] { flex:1; min-width:150px; max-width:340px; accent-color:#1f6feb; }
  .sl-row .val { width:70px; text-align:right; color:#ffd33d; font-weight:bold; }
  .concl { max-width:960px; margin:10px auto 0; background:#161b22; border:1px solid #30363d; border-radius:10px; padding:12px 16px; font-size:14.5px; line-height:1.9; color:#e6edf3; display:none; }
  .concl.show { display:block; }
  .concl b { color:#ffd33d; }
  .concl .hl { color:#58a6ff; }
  .concl .tag { color:#3fb950; }
  .foot { text-align:center; font-size:14px; color:#8b949e; margin-top:16px; padding:10px 0 18px; border-top:1px solid #21262d; }
  .tip { color:#8b949e; font-size:12.5px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>高考动态平衡 · 交互课件</h1>
  <div class="sub">拖动滑块调参数，直观看到力的变化 | 图解法·相似三角形·动态圆</div>

  <div class="tabs" id="tabs">
    <div class="tab on" data-t="0">① 知识导览</div>
    <div class="tab" data-t="1">② 挡板转动</div>
    <div class="tab" data-t="2">③ 晾衣绳</div>
    <div class="tab" data-t="3">④ 斜面拉球·极值</div>
    <div class="tab" data-t="4">⑤ 斜面+挡板</div>
    <div class="tab" data-t="5">⑥ 解题套路总结</div>
  </div>

  <div id="canvasHolder"></div>

  <!-- 模型1 滑块 -->
  <div class="sliders" id="sl1">
    <div class="sl-row"><label>挡板与墙夹角 α</label><input type="range" id="p1a" min="10" max="85" value="45" oninput="setP1()"><span class="val" id="p1aV"></span></div>
    <div class="sl-row"><label>重力 G (N)</label><input type="range" id="p1g" min="5" max="20" value="10" oninput="setP1()"><span class="val" id="p1gV"></span></div>
    <div class="tip">拖动 α：挡板从"贴近墙"转到"倒向地面"，观察 N₁ N₂ 如何变化</div>
  </div>
  <!-- 模型2 滑块 -->
  <div class="sliders" id="sl2">
    <div class="sl-row"><label>两挂点水平距离 d</label><input type="range" id="p2d" min="60" max="320" value="180" oninput="setP2()"><span class="val" id="p2dV"></span></div>
    <div class="sl-row"><label>B 点高度差 h</label><input type="range" id="p2h" min="-100" max="100" value="0" oninput="setP2()"><span class="val" id="p2hV"></span></div>
    <div class="sl-row"><label>绳长 L</label><input type="range" id="p2l" min="240" max="520" value="360" oninput="setP2()"><span class="val" id="p2lV"></span></div>
    <div class="sl-row"><label>重物 G (N)</label><input type="range" id="p2g" min="20" max="100" value="50" oninput="setP2()"><span class="val" id="p2gV"></span></div>
    <div class="tip">试试拖动 h（B 点高低）：拉力 T 变不变？再拖 d 或 L 试试</div>
  </div>
  <!-- 模型3 滑块 -->
  <div class="sliders" id="sl3">
    <div class="sl-row"><label>斜面倾角 θ</label><input type="range" id="p3t" min="20" max="50" value="30" oninput="setP3()"><span class="val" id="p3tV"></span></div>
    <div class="sl-row"><label>绳方向 φ（与竖直夹角）</label><input type="range" id="p3f" min="10" max="150" value="30" oninput="setP3()"><span class="val" id="p3fV"></span></div>
    <div class="sl-row"><label>重力 G (N)</label><input type="range" id="p3g" min="10" max="40" value="20" oninput="setP3()"><span class="val" id="p3gV"></span></div>
    <div class="tip">拖动 φ：绳从"正上方拉"转到"水平拉"再往下，看拉力 T 先减后增（辅助圆法求极值）</div>
  </div>
  <!-- 模型4 滑块 -->
  <div class="sliders" id="sl4">
    <div class="sl-row"><label>斜面倾角 θ</label><input type="range" id="p4t" min="20" max="60" value="37" oninput="setP4()"><span class="val" id="p4tV"></span></div>
    <div class="sl-row"><label>挡板与水平夹角 β</label><input type="range" id="p4b" min="50" max="90" value="90" oninput="setP4()"><span class="val" id="p4bV"></span></div>
    <div class="sl-row"><label>重力 G (N)</label><input type="range" id="p4g" min="10" max="40" value="20" oninput="setP4()"><span class="val" id="p4gV"></span></div>
    <div class="tip">固定 β=90° 拖 θ：看 N₁（斜面）减小、N₂（挡板）增大——高考最常考的结论</div>
  </div>

  <div class="concl" id="concl"></div>
  <div class="foot">— 动态平衡：缓慢移动 → 每一刻都近似平衡 → 用图解法看力怎么变 —</div>
</div>

<script>
/* ============ 全局 ============ */
const W = 960, H = 560;
let tab = 0;
let p5inst = null;

/* 模型参数 */
const P = {
  1:{a:45,g:10}, 2:{d:180,h:0,L:360,g:50}, 3:{t:30,f:30,g:20}, 4:{t:37,b:90,g:20}
};

/* ============ 工具 ============ */
function vlen(x,y){ return Math.hypot(x,y); }
function setP1(){ P[1].a=+el('p1a').value; P[1].g=+el('p1g').value; el('p1aV').textContent=P[1].a+'°'; el('p1gV').textContent=P[1].g+'N'; }
function setP2(){ P[2].d=+el('p2d').value; P[2].h=+el('p2h').value; P[2].L=+el('p2l').value; P[2].g=+el('p2g').value;
  el('p2dV').textContent=P[2].d; el('p2hV').textContent=P[2].h; el('p2lV').textContent=P[2].L; el('p2gV').textContent=P[2].g+'N'; }
function setP3(){ P[3].t=+el('p3t').value; P[3].f=+el('p3f').value; P[3].g=+el('p3g').value; el('p3tV').textContent=P[3].t+'°'; el('p3fV').textContent=P[3].f+'°'; el('p3gV').textContent=P[3].g+'N'; }
function setP4(){ P[4].t=+el('p4t').value; P[4].b=+el('p4b').value; P[4].g=+el('p4g').value; el('p4tV').textContent=P[4].t+'°'; el('p4bV').textContent=P[4].b+'°'; el('p4gV').textContent=P[4].g+'N'; }
function el(id){ return document.getElementById(id); }

/* ============ 切换 ============ */
function switchTab(i){
  tab = i;
  document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('on', idx===i));
  for(let k=1;k<=4;k++) el('sl'+k).classList.toggle('show', i===k);
  el('concl').classList.toggle('show', i>0 && i<5);
  draw();
}

/* ============ p5 ============ */
function setup(){
  p5inst = createCanvas(W,H);
  p5inst.parent('canvasHolder');
  frameRate(30);
  draw();
}
function draw(){
  background(13,17,23);
  if(tab===0) pageIntro();
  else if(tab===1) model1();
  else if(tab===2) model2();
  else if(tab===3) model3();
  else if(tab===4) model4();
  else pageSummary();
}

/* 虚线 */
function dash(x1,y1,x2,y2,on=8,off=6){
  drawingContext.save();
  drawingContext.setLineDash([on,off]);
  line(x1,y1,x2,y2);
  drawingContext.restore();
}

/* 箭头 */
function arrow(x1,y1,x2,y2,color,label,ltx,lty){
  stroke(color); strokeWeight(5); fill(color);
  line(x1,y1,x2,y2);
  const a = atan2(y2-y1,x2-x1);
  const s = 14;
  triangle(x2,y2, x2-s*cos(a-0.42), y2-s*sin(a-0.42), x2-s*cos(a+0.42), y2-s*sin(a+0.42));
  if(label!==undefined){
    noStroke(); fill(color); textSize(17); textAlign(LEFT);
    text(label, ltx!==undefined?ltx:x2+10, lty!==undefined?lty:y2-8);
  }
}

/* 力矢量（从点出发） */
function forceVec(px,py,dx,dy,color,label,scale,labelPos){
  const ex=px+dx*scale, ey=py+dy*scale;
  arrow(px,py,ex,ey,color,label,labelPos?labelPos[0]:undefined,labelPos?labelPos[1]:undefined);
}

/* 标题区 */
function canvasTitle(t){
  noStroke(); fill(139,148,158); textSize(13); textAlign(LEFT);
  text(t, 20, 24);
  stroke(48,54,61); strokeWeight(1);
  line(20,32, W-20,32);
}

/* ============ 页面0：导览 ============ */
function pageIntro(){
  noStroke(); fill(230,237,243); textSize(17); textAlign(LEFT);
  text('什么是动态平衡？', 40, 70);
  fill(201,209,217); textSize(15);
  text('物体受共点力作用，处于"缓慢移动"状态——每个瞬间都近似平衡：', 40, 100);
  text('ΣF = 0 恒成立，只是某个力（或方向）在缓慢变化。', 40, 125);
  text('核心方法：把"过程"画成"力矢量三角形"，看边的长短怎么变。', 40, 150);
  text('', 40, 175);
  fill(255,211,61); textSize(16);
  text('三种解法：', 40, 205);
  fill(201,209,217); textSize(15);
  text('① 图解法（平行四边形/矢量三角形）—— 一个力恒、一个力方向恒', 60, 235);
  text('② 相似三角形法 —— 力三角形 ∽ 几何三角形', 60, 265);
  text('③ 辅助圆法（动态圆）—— 求力的极值', 60, 295);
  text('', 60, 325);
  fill(88,166,255); textSize(15);
  text('点击上方标签，逐个模型动手试试 →', 60, 360);
  // 小示意：一个力三角
  const cx=700, cy=330;
  stroke(88,166,255,120); strokeWeight(1.5);
  dash(cx-90,cy+70,cx+90,cy+70);
  stroke(255,211,61); strokeWeight(3); noFill();
  triangle(cx-90,cy+70, cx+90,cy+70, cx-10,cy-60);
  noStroke(); fill(255,211,61); textSize(13);
  text('G', cx-105, cy+85);
  fill(88,166,255); text('N₁', cx+85, cy+85);
  fill(80,200,120); text('N₂', cx-30, cy-75);
  noStroke(); fill(139,148,158); textSize(12.5);
  text('三力首尾相接 → 闭合三角形', cx-120, cy+110);
}

/* ============ 模型1：挡板转动 ============ */
function model1(){
  canvasTitle('模型① 挡板转动 · 图解法（一个力恒、一个力方向恒）');
  const a = P[1].a*Math.PI/180, G = P[1].g;
  const r = 40, wallX = 80, groundY = 500;
  const yB = groundY - r*Math.tan(a/2);
  const bx = wallX + r, by = yB;
  // 场景：地面
  stroke(48,54,61); strokeWeight(2);
  line(40,groundY, W/2-20,groundY);
  // 墙
  line(wallX,groundY, wallX,80);
  // 挡板
  const tx = (r - r*Math.cos(a))/Math.sin(a);
  stroke(176,148,255); strokeWeight(3);
  line(wallX,groundY, wallX+tx*Math.sin(a), groundY-tx*Math.cos(a));
  // 球
  noStroke(); fill(88,166,255,90); stroke(88,166,255); strokeWeight(2);
  circle(bx,by,r);
  noStroke(); fill(230,237,243); textSize(13); textAlign(CENTER);
  text('m', bx, by+4);
  // 力（G 固定长度 110px 基准，N₁ N₂ 按比例放大）
  const sc = 11; // px/N
  const lenG = G*sc;
  const maxLen = 300;
  forceVec(bx,by, 0,lenG, 255,211,61, 'G='+G+'N', 1, [bx+14, by+lenG+4]);
  const N1 = G/Math.tan(a);
  const N2 = G/Math.sin(a);
  const l1 = Math.min(N1*sc, maxLen);
  const l2 = Math.min(N2*sc, maxLen);
  forceVec(bx,by, l1,0, 88,166,255, 'N₁='+N1.toFixed(1)+'N', 1, [bx+l1+12, by+6]);
  forceVec(bx,by, l2*Math.cos(a), -l2*Math.sin(a), 80,200,120, 'N₂='+N2.toFixed(1)+'N', 1, [bx+l2*Math.cos(a)+12, by-l2*Math.sin(a)-6]);
  // 角度标注
  noStroke(); fill(176,148,255); textSize(13);
  text('α='+P[1].a+'°', wallX+tx*Math.sin(a)/2+10, groundY-tx*Math.cos(a)/2-8);
  // ---- 右侧：矢量三角形 ----
  const ox = W/2+140, oy = 150;
  const scT = 11;
  // 画布上的三角形：G 竖直
  const gEnd = {x:ox, y:oy+lenG*scT/sc};
  const n1End = {x:gEnd.x + N1*scT, y:gEnd.y};
  stroke(255,211,61); strokeWeight(5); noFill();
  line(ox,oy, gEnd.x,gEnd.y);
  stroke(88,166,255); line(gEnd.x,gEnd.y, n1End.x,n1End.y);
  stroke(80,200,120); line(n1End.x,n1End.y, ox,oy);
  // 箭头（三角形边也画箭头，表示力的方向）
  arrow(ox,oy, gEnd.x,gEnd.y, 255,211,61);
  arrow(gEnd.x,gEnd.y, n1End.x,n1End.y, 88,166,255);
  arrow(n1End.x,n1End.y, ox,oy, 80,200,120);
  // 力的大小标签
  noStroke(); fill(255,211,61); textSize(15); textAlign(LEFT);
  text('G = '+G.toFixed(1)+' N', ox-90, oy+lenG*scT/sc+24);
  fill(88,166,255); text('N₁ = '+N1.toFixed(1)+' N', n1End.x+12, n1End.y-10);
  fill(80,200,120); text('N₂ = '+N2.toFixed(1)+' N', (n1End.x+ox)/2-90, oy-16);
  // 小标签
  noStroke(); fill(139,148,158); textSize(12.5);
  text('力矢量三角形（首尾相接）', ox-110, oy-30);
  // ---- 曲线：N₁ N₂ vs α ----
  const cx0 = W/2+40, cy0 = 430, cw = 420, ch = 100;
  noStroke(); fill(139,148,158); textSize(12.5);
  text('N₁、N₂ 随 α 的变化（G='+G+'N）', cx0, cy0-12);
  stroke(48,54,61); strokeWeight(1);
  line(cx0,cy0, cx0+cw,cy0); line(cx0,cy0, cx0,cy0-ch);
  // 曲线
  let prev1=null, prev2=null;
  for(let deg=10; deg<=85; deg+=1){
    const rad = deg*Math.PI/180;
    const n1 = G/Math.tan(rad), n2 = G/Math.sin(rad);
    const x = cx0 + (deg-10)/75*cw;
    const y1 = cy0 - n1/(G*2.2)*ch, y2 = cy0 - n2/(G*2.2)*ch;
    stroke(88,166,255); strokeWeight(2.5);
    if(prev1) line(prev1.x,prev1.y, x,y1);
    stroke(80,200,120);
    if(prev2) line(prev2.x,prev2.y, x,y2);
    prev1={x,y:y1}; prev2={x,y:y2};
  }
  // 当前点
  const curX = cx0 + (P[1].a-10)/75*cw;
  const curY1 = cy0 - N1/(G*2.2)*ch, curY2 = cy0 - N2/(G*2.2)*ch;
  stroke(255,255,255); strokeWeight(3);
  point(curX,curY1); point(curX,curY2);
  noStroke(); fill(88,166,255); textSize(12); text('N₁', cx0+cw+6, cy0-ch*0.5);
  fill(80,200,120); text('N₂', cx0+cw+6, cy0-ch*0.9);
  fill(255,255,255); textSize(11); text('α='+P[1].a+'°', curX-18, cy0+14);
  // 结论
  el('concl').innerHTML =
    '<b>结论①：</b>挡板从"贴近墙"倒向"地面"（α 增大），<span class="hl">N₁ 和 N₂ 都减小</span>。<br>' +
    'N₁ = G·cotα　（墙的支持力，水平）<br>' +
    'N₂ = G/sinα　（挡板支持力，⊥挡板）<br>' +
    '<span class="tag">图解法口诀：</span>一个力恒定（G）、一个力方向恒定（N₁ 水平），第三个力方向随挡板转——画闭合三角形，边长短了就是力小了。';
}

/* ============ 模型2：晾衣绳 ============ */
function model2(){
  canvasTitle('模型② 晾衣绳 · 相似三角形/正交分解（"高度随便调，拉力不变"）');
  const d=P[2].d, h=P[2].h, L=P[2].L, G=P[2].g;
  const Ax=170, Ay=120, Bx=Ax+d, By=Ay+h;
  const distAB = vlen(Bx-Ax,By-Ay);
  // 挂钩位置：水平中点 + 数值解 |PA|+|PB|=L
  let Py = Ay + 180;
  // 二分求 Py（Py 向下为正，在 AB 下方）
  let lo = Math.min(Ay,By)+30, hi = Math.min(Ay,By)+600;
  let valid = true;
  if(L <= distAB+2){ valid=false; }
  const f = y => vlen(d/2, y-Ay) + vlen(d/2, y-By) - L;
  for(let i=0;i<80 && valid;i++){
    const mid=(lo+hi)/2;
    if(f(mid)*f(lo) <= 0) hi=mid; else lo=mid;
    if(hi-lo<0.5) break;
  }
  Py = (lo+hi)/2;
  const Px = Ax + d/2;
  // 场景
  stroke(48,54,61); strokeWeight(2);
  line(60, Ay+40, Bx+60, By+40); // 天花板
  // A B 点
  noStroke(); fill(255,211,61);
  circle(Ax,Ay,7); circle(Bx,By,7);
  stroke(255,211,61,120); strokeWeight(1.5);
  line(Ax,Ay, Ax,0); line(Bx,By, Bx,0);
  // 绳
  stroke(201,209,217); strokeWeight(2.5);
  line(Ax,Ay, Px,Py); line(Bx,By, Px,Py);
  // 挂钩+重物
  noStroke(); fill(255,120,80); circle(Px,Py,8);
  stroke(255,120,80); strokeWeight(3);
  line(Px,Py, Px,Py+70);
  noStroke(); fill(255,120,80); textSize(13); textAlign(CENTER);
  text('G='+G+'N', Px+30, Py+75);
  // 绳与竖直夹角 θ
  const sinTh = d/L, cosTh = Math.sqrt(1-sinTh*sinTh);
  const T = valid ? G/(2*cosTh) : Infinity;
  // 力：T1 T2 G（T 按 G 的比例放大，更明显）
  const sc = 3.2;
  const lenT = Math.min(T*sc, 300);
  const tAng = Math.atan2(d/2, Math.abs(Py-Ay));
  forceVec(Px,Py, lenT*Math.sin(tAng), lenT*Math.cos(tAng), 80,200,120, 'T='+(valid?T.toFixed(1):'—')+'N', 1, [Px+lenT*Math.sin(tAng)+8, Py-lenT*Math.cos(tAng)+14]);
  forceVec(Px,Py, -lenT*Math.sin(tAng), lenT*Math.cos(tAng), 80,200,120, 'T='+(valid?T.toFixed(1):'—')+'N', 1, [Px-lenT*Math.sin(tAng)-110, Py-lenT*Math.cos(tAng)+14]);
  forceVec(Px,Py, 0, Math.min(G*3.2,260), 255,120,80, 'G='+G+'N', 1, [Px+14, Py+Math.min(G*3.2,260)+6]);
  // 角度标注
  noStroke(); fill(80,200,120); textSize(12.5);
  text('θ='+(Math.asin(sinTh)*180/Math.PI).toFixed(1)+'°', Px+d/4, Py-14);
  // ---- 右侧：正交分解 ----
  const ox=W/2+150, oy=150;
  noStroke(); fill(139,148,158); textSize(12.5);
  text('T 的正交分解（竖直分量合成 = G）', ox-130, oy-20);
  const s2 = Math.min(T*3.2, 220);
  const ty = s2*cosTh, tx = s2*sinTh;
  stroke(80,200,120); strokeWeight(3); noFill();
  line(ox,oy, ox,oy+ty); // T 竖直分量
  stroke(80,200,120,150); strokeWeight(1.5);
  line(ox,oy+ty, ox+tx,oy+ty); line(ox,oy, ox+tx,oy+ty); // 水平分量+合成
  stroke(255,120,80); strokeWeight(2); dash(ox+tx,oy+ty, ox,oy+ty+30);
  noStroke(); fill(80,200,120); textSize(13);
  text('T·cosθ = G/2', ox+10, oy+ty+18);
  text('T·sinθ', ox+tx/2, oy+ty-8);
  text('T', ox+tx+10, oy+ty/2);
  // 数值
  noStroke(); fill(230,237,243); textSize(15);
  text('T = '+(valid?T.toFixed(1):'—')+' N', ox-130, oy+90);
  fill(139,148,158); textSize(12.5);
  text('sinθ = d/L = '+(d/L).toFixed(2), ox-130, oy+112);
  // ---- 曲线：T vs h（不变！）----
  const cx0=W/2+40, cy0=430, cw=420, ch=100;
  noStroke(); fill(139,148,158); textSize(12.5);
  text('拖动 h（B 点高度）：拉力 T 几乎不变（绿线水平）', cx0, cy0-12);
  stroke(48,54,61); strokeWeight(1);
  line(cx0,cy0,cx0+cw,cy0); line(cx0,cy0,cx0,cy0-ch);
  const yT = cy0 - Math.min(T,150)/150*ch;
  stroke(80,200,120); strokeWeight(2.5);
  line(cx0,yT, cx0+cw,yT);
  noStroke(); fill(80,200,120); textSize(12);
  text('T='+(valid?T.toFixed(1):'?')+'N', cx0+cw+6, yT+4);
  // 当前h标记
  const hx = cx0 + (h+100)/200*cw;
  stroke(255,255,255); strokeWeight(3); point(hx,yT);
  noStroke(); fill(255,255,255); textSize(11); text('h='+h, hx-14, yT+18);
  if(!valid){
    noStroke(); fill(255,120,80); textSize(14);
    text('绳长 L 不够！需 L > 两挂点距离', W/2+100, 260);
  }
  el('concl').innerHTML =
    '<b>结论②：</b>光滑挂钩在绳上自由滑动，两段绳与竖直方向夹角相等，T = G/(2cosθ)。<br>' +
    '<span class="hl">无论 B 点挂多高（h 怎么变），拉力 T 不变！</span>——因为 sinθ = d/L 只由"水平距离 d"和"绳长 L"决定。<br>' +
    '<span class="tag">高考真题：</span>晾衣架一端不动、另一端上下移动，绳中拉力不变；把两挂点拉远（d 增大）或绳变短（L 减小）→ T 增大。';
}

/* ============ 模型3：斜面拉球（动态圆） ============ */
function model3(){
  canvasTitle('模型③ 斜面拉球 · 辅助圆法（一力恒、一力方向恒 → 求极值）');
  const th = P[3].t*Math.PI/180, phi = P[3].f*Math.PI/180, G = P[3].g;
  // 场景：斜面（右下 → 左上，左高右低）
  const x0=80, y0=430;
  const topX = x0 + 360*Math.cos(th), topY = y0 - 360*Math.sin(th);
  stroke(139,148,158); strokeWeight(3);
  line(x0,y0, topX,topY);
  // 球在斜面中点上方
  const r=30;
  const midX=(x0+topX)/2+20, midY=(y0+topY)/2-20;
  // 法线（垂直斜面，指向球=远离斜面，右上）
  const nx=Math.sin(th), ny=-Math.cos(th);
  const bx=midX+nx*(r+6), by=midY+ny*(r+6);
  // 绳方向：t̂=(-sinφ, -cosφ)，φ与竖直夹角（向左偏）
  const tx=-Math.sin(phi), ty=-Math.cos(phi);
  // 解 N,T：N·n̂ + T·t̂ + (0,G) = 0
  // [sinθ, -sinφ; cosθ, cosφ][N;T] = [0; G]
  const det = Math.sin(th)*Math.cos(phi) + Math.sin(phi)*Math.cos(th); // sin(θ+φ)
  const N = det!==0 ? G*Math.sin(phi)/det : 0;
  const T = det!==0 ? G*Math.sin(th)/det : 0;
  const ok = N>0 && T>0;
  // 固定点（绳端，沿 t̂ 方向）
  const ropeLen = 160;
  const fx = bx+tx*ropeLen, fy = by+ty*ropeLen;
  stroke(80,200,120,80); strokeWeight(1.5); dash(bx,by, fx,fy,4,4);
  noStroke(); fill(80,200,120); circle(fx,fy,6);
  // 球
  noStroke(); fill(88,166,255,90); stroke(88,166,255); strokeWeight(2);
  circle(bx,by,r);
  // 力（G 固定长度基准，N T 按比例放大）
  const sc = 8;
  const maxLen = 280;
  forceVec(bx,by, 0,G*sc, 255,211,61, 'G='+G+'N', 1, [bx+14, by+G*sc+4]);
  if(ok){
    const lN = Math.min(N*sc, maxLen), lT = Math.min(T*sc, maxLen);
    forceVec(bx,by, lN*nx, lN*ny, 88,166,255, 'N='+N.toFixed(1)+'N', 1, [bx+lN*nx+10, by+lN*ny-6]);
    forceVec(bx,by, tx*lT, ty*lT, 80,200,120, 'T='+T.toFixed(1)+'N', 1, [bx+tx*lT+10, by+ty*lT-6]);
    noStroke(); fill(139,148,158); textSize(12);
    text('θ='+P[3].t+'°', topX-30, topY-8);
    text('φ='+P[3].f+'°', (bx+fx)/2+10, (by+fy)/2-6);
  } else {
    noStroke(); fill(255,120,80); textSize(14);
    text('此方向无法平衡', bx-60, by-40);
  }
  // ---- 右侧：辅助圆（动态圆）----
  const ox=W/2+160, oy=200;
  noStroke(); fill(139,148,158); textSize(12.5);
  text('辅助圆法：G 固定，N 方向固定，T 端点沿 N 方向线滑动', ox-200, oy-80);
  const scT = 7;
  const gEnd = {x:ox, y:oy+G*scT};
  const nDir = {x: nx, y: ny};
  const lineLen = 260;
  stroke(88,166,255,90); strokeWeight(1.5);
  line(gEnd.x, gEnd.y, gEnd.x+nDir.x*lineLen, gEnd.y+nDir.y*lineLen);
  // 当前 T 端点
  const tEnd = {x: gEnd.x + N*scT*nDir.x, y: gEnd.y + N*scT*nDir.y};
  // 闭合三角形
  stroke(255,211,61); strokeWeight(3); noFill();
  line(ox,oy, gEnd.x,gEnd.y);
  stroke(88,166,255); line(gEnd.x,gEnd.y, tEnd.x,tEnd.y);
  stroke(80,200,120); line(tEnd.x,tEnd.y, ox,oy);
  // 垂足（T⊥N 时最小）
  const vx = ox-gEnd.x, vy = oy-gEnd.y;
  const proj = vx*nDir.x+vy*nDir.y;
  const foot = {x: gEnd.x+proj*nDir.x, y: gEnd.y+proj*nDir.y};
  stroke(255,255,255,140); strokeWeight(1.5); dash(ox,oy,foot.x,foot.y,5,5);
  noStroke(); fill(255,255,255); textSize(12);
  text('T⊥N 时 T 最小', foot.x+10, foot.y-8);
  noStroke(); fill(230,237,243); textSize(14);
  text('T = '+(ok?T.toFixed(1):'—')+' N', ox-160, oy+130);
  fill(88,166,255); text('N = '+(ok?N.toFixed(1):'—')+' N', ox-160, oy+152);
  // ---- 曲线：T vs φ ----
  const cx0=W/2+40, cy0=440, cw=420, ch=90;
  noStroke(); fill(139,148,158); textSize(12.5);
  text('拉力 T 随 φ 的变化（θ='+P[3].t+'°）', cx0, cy0-12);
  stroke(48,54,61); strokeWeight(1);
  line(cx0,cy0,cx0+cw,cy0); line(cx0,cy0,cx0,cy0-ch);
  let prev=null, minT=1e9, minPhi=0;
  for(let f=10; f<=150; f+=1){
    const fr=f*Math.PI/180;
    const d2 = Math.sin(th)*Math.cos(fr) + Math.sin(fr)*Math.cos(th);
    if(Math.abs(d2) < 0.02){ prev=null; continue; }
    const T2 = G*Math.sin(th)/d2;
    const N2 = G*Math.sin(fr)/d2;
    if(N2>0 && T2>0){
      if(T2<minT){minT=T2; minPhi=f;}
      const x = cx0 + (f-10)/140*cw;
      const y = cy0 - Math.min(T2,60)/60*ch;
      stroke(80,200,120); strokeWeight(2);
      if(prev) line(prev.x,prev.y, x,y);
      prev={x,y};
    } else prev=null;
  }
  const mx2 = cx0 + (minPhi-10)/140*cw, my2 = cy0 - Math.min(minT,60)/60*ch;
  stroke(255,255,255); strokeWeight(4); point(mx2,my2);
  noStroke(); fill(255,255,255); textSize(11.5);
  text('Tmin='+minT.toFixed(1)+'N @φ='+minPhi+'°', mx2-75, my2-10);
  if(ok){
    const cxx = cx0 + (P[3].f-10)/140*cw, cyy = cy0 - Math.min(T,60)/60*ch;
    stroke(255,120,80); strokeWeight(3); point(cxx,cyy);
    noStroke(); fill(255,120,80); textSize(11); text('φ='+P[3].f+'°', cxx-18, cyy+14);
  }
  el('concl').innerHTML =
    '<b>结论③：</b>一个力恒（G）、一个力方向恒（N ⊥斜面），第三个力 T 方向变化时——<br>' +
    '<span class="hl">当 T ⊥ N 时，T 取最小值：Tmin = G·sinθ</span>。<br>' +
    '拖动 φ：绳从正上方（φ小）转到水平再往下（φ大），T 先减后增（曲线有谷底）。<br>' +
    '<span class="tag">辅助圆法：</span>以 G 的终点为起点画 N 的方向线，T 的端点在这条线上滑动；T 最短 ⇔ T⊥N（白色虚线即垂线）。';
}

/* ============ 模型4：斜面+挡板 ============ */
function model4(){
  canvasTitle('模型④ 斜面 + 挡板 · 综合应用（高考高频）');
  const th = P[4].t*Math.PI/180, bt = P[4].b*Math.PI/180, G = P[4].g;
  // 场景
  const x0=80, y0=450;
  const topX = x0 + 360*Math.cos(th), topY = y0 - 360*Math.sin(th);
  stroke(139,148,158); strokeWeight(3);
  line(x0,y0, topX,topY);
  // 球：在斜面中点上方 r 处
  const r=28;
  const midX=(x0+topX)/2+20, midY=(y0+topY)/2-20;
  const nx=-Math.sin(th), ny=Math.cos(th);
  const bx=midX+nx*(r+6), by=midY+ny*(r+6);
  // 挡板：从球下方右侧，与水平夹角 bt
  // 挡板线：过 (bx + r*(-sin(bt)), by + r*cos(bt)) 方向沿挡板
  const px = bx + r*Math.sin(bt), py = by - r*Math.cos(bt); // 挡板接触点（法线方向）
  // 挡板从接触点延伸
  stroke(176,148,255); strokeWeight(3);
  line(px, py, px - 200*Math.cos(bt), py - 200*Math.sin(bt));
  line(px, py, px + 140*Math.cos(bt), py + 140*Math.sin(bt));
  // 球
  noStroke(); fill(88,166,255,90); stroke(88,166,255); strokeWeight(2);
  circle(bx,by,r);
  // 解力
  // N1 沿 nx,ny（斜面法线）；N2 沿挡板法线（-sin bt, cos bt 指向左上？挡板法线指向球 = (sin bt, -cos bt) 的反向？）
  // 挡板面方向 (cos bt, sin bt)（向右上），法线指向球（球在挡板左上方）n2 = (-sin bt, cos bt)
  const n2x=-Math.sin(bt), n2y=Math.cos(bt);
  // [-sin th, -sin bt; cos th, cos bt][N1;N2]=[0;-G]
  const det = (-Math.sin(th))*Math.cos(bt) - (-Math.sin(bt))*Math.cos(th);
  const N1 = det!==0 ? (0*Math.cos(bt) - (-Math.sin(bt))*(-G))/det : 0;
  const N2 = det!==0 ? ((-Math.sin(th))*(-G) - 0*Math.cos(th))/det : 0;
  const ok = N1>0 && N2>0;
  const sc=9;
  const maxLen=290;
  forceVec(bx,by, 0,G*sc, 255,211,61, 'G='+G+'N', 1, [bx+14, by+G*sc+4]);
  if(ok){
    const l1=Math.min(N1*sc,maxLen), l2=Math.min(N2*sc,maxLen);
    forceVec(bx,by, l1*nx, l1*ny, 88,166,255, 'N₁='+N1.toFixed(1)+'N', 1, [bx+l1*nx+10, by+l1*ny-6]);
    forceVec(bx,by, l2*n2x, l2*n2y, 80,200,120, 'N₂='+N2.toFixed(1)+'N', 1, [bx+l2*n2x+10, by+l2*n2y-6]);
  }
  noStroke(); fill(139,148,158); textSize(12);
  text('θ='+P[4].t+'°', topX-40, topY-10);
  text('β='+P[4].b+'°', px+10, py-6);
  // ---- 右侧：矢量三角形 ----
  const ox=W/2+160, oy=180;
  noStroke(); fill(139,148,158); textSize(12.5);
  text('力矢量三角形', ox-80, oy-40);
  const scT=7;
  const gEnd={x:ox, y:oy+G*scT};
  const n1End={x:gEnd.x+N1*scT*nx, y:gEnd.y+N1*scT*ny};
  stroke(255,211,61); strokeWeight(3); noFill();
  line(ox,oy,gEnd.x,gEnd.y);
  stroke(88,166,255); line(gEnd.x,gEnd.y, n1End.x,n1End.y);
  stroke(80,200,120); line(n1End.x,n1End.y, ox,oy);
  noStroke(); fill(255,211,61); textSize(13); text('G', ox-30, oy+G*scT+18);
  fill(88,166,255); text('N₁', n1End.x+6, n1End.y-6);
  fill(80,200,120); text('N₂', (n1End.x+ox)/2-40, oy-14);
  // 数值
  noStroke(); fill(230,237,243); textSize(14);
  text('N₁ = '+(ok?N1.toFixed(1):'—')+' N', ox-150, oy+120);
  fill(80,200,120); text('N₂ = '+(ok?N2.toFixed(1):'—')+' N', ox-150, oy+142);
  // ---- 曲线：N vs θ（β 固定）----
  const cx0=W/2+40, cy0=430, cw=420, ch=100;
  noStroke(); fill(139,148,158); textSize(12.5);
  text('β='+P[4].b+'° 固定，N₁ N₂ 随 θ 的变化', cx0, cy0-12);
  stroke(48,54,61); strokeWeight(1);
  line(cx0,cy0,cx0+cw,cy0); line(cx0,cy0,cx0,cy0-ch);
  let p1=null,p2=null;
  for(let deg=20;deg<=60;deg+=1){
    const rr=deg*Math.PI/180;
    const d2=(-Math.sin(rr))*Math.cos(bt)-(-Math.sin(bt))*Math.cos(rr);
    const n1= d2!==0 ? (0*Math.cos(bt)-(-Math.sin(bt))*(-G))/d2 : 0;
    const n2= d2!==0 ? ((-Math.sin(rr))*(-G)-0*Math.cos(rr))/d2 : 0;
    const x=cx0+(deg-20)/40*cw;
    const y1=cy0-Math.min(n1,80)/80*ch, y2=cy0-Math.min(n2,80)/80*ch;
    stroke(88,166,255); strokeWeight(2.5);
    if(p1) line(p1.x,p1.y,x,y1);
    stroke(80,200,120);
    if(p2) line(p2.x,p2.y,x,y2);
    p1={x,y:y1}; p2={x,y:y2};
  }
  const cxx=cx0+(P[4].t-20)/40*cw;
  stroke(255,255,255); strokeWeight(3);
  point(cxx, cy0-Math.min(N1,80)/80*ch); point(cxx, cy0-Math.min(N2,80)/80*ch);
  noStroke(); fill(88,166,255); text('N₁', cx0+cw+6, cy0-ch*0.55);
  fill(80,200,120); text('N₂', cx0+cw+6, cy0-ch*0.95);
  el('concl').innerHTML =
    '<b>结论④：</b>斜面倾角 θ 增大（挡板竖直 β=90° 固定）：<br>' +
    '<span class="hl">N₁（斜面支持力）减小，N₂（挡板支持力）增大</span>。<br>' +
    'N₁ = G·cosθ，N₂ = G·tanθ<br>' +
    '<span class="tag">变式：</span>挡板不再竖直（拖 β），N₂ 的方向也变，闭合三角形跟着转——先固定一个参数，再看另一个，逐个击破。';
}

  text('③ "缓慢"就是平衡——每一步都列 ΣF=0，不是动力学', 60, yy+144);
  text('④ 受力分析别漏力：重力、弹力、摩擦力、拉力，逐个找', 60, yy+166);

  noStroke(); fill(139,148,158); textSize(12.5);
