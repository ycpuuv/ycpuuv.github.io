  <script>
(function(){
    const canvas = document.getElementById('galileoCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width = 950;
    const height = canvas.height = 440;
    
    // ---------- 几何参数 ----------
    const groundY = 360;                // 水平地面高度 (B点严格在此)
    // 左侧斜面与水平面的夹角固定为28°
    const LEFT_ANGLE_DEG = 28;
    const LEFT_ANGLE_RAD = LEFT_ANGLE_DEG * Math.PI / 180;
    
    // B点坐标：水平中点附近且保证A点、B点布局美观
    const B = { x: 390, y: groundY };
    const abSlopeLen = 240;             // AB斜面长度 (像素)
    const dx_AB = -abSlopeLen * Math.cos(LEFT_ANGLE_RAD);
    const dy_AB = -abSlopeLen * Math.sin(LEFT_ANGLE_RAD);
    const A = { x: B.x + dx_AB, y: B.y + dy_AB };
    
    // 右侧斜面参数: 加长1.3倍 (基准长度360 → 468px)
    const baseSlopeLen = 360;
    const rightSlopeLen = baseSlopeLen * 1.3;
    
    const SMOOTH_RADIUS = 42;           // 圆弧半径
    
    let rightAngle = 24;                // 右侧倾角范围0~30°
    let friction = 0.02;
    let showTrail = true;
    let trailPoints = [];
    const g = 0.46;                    
    let frameCounter = 0;
    const TRAIL_INTERVAL = 4;
    
    // 小球状态机
    let ball = {
        x: A.x, y: A.y,
        v: 0,
        segment: 'AB',       // 'AB', 'smoothArc', 'BC', 'ground'
        moving: false,
        stopped: false,
        vanished: false,
        arcParam: 0
    };
    
    // 获取C点坐标（右侧斜面终点，加长1.3倍）
    function getCPoint() {
        const rad = rightAngle * Math.PI / 180;
        return {
            x: B.x + rightSlopeLen * Math.cos(rad),
            y: B.y - rightSlopeLen * Math.sin(rad)
        };
    }
    
    function isCLowerThanA() {
        const C = getCPoint();
        return C.y > A.y;
    }
    
    // AB方向单位向量 (A->B)
    function getABDir() {
        const dx = B.x - A.x;
        const dy = B.y - A.y;
        const len = Math.hypot(dx, dy);
        return { x: dx/len, y: dy/len };
    }
    
    // BC方向单位向量 (B->C)
    function getBCDir() {
        const C = getCPoint();
        const dx = C.x - B.x;
        const dy = C.y - B.y;
        const len = Math.hypot(dx, dy);
        return { x: dx/len, y: dy/len };
    }
    
    function getABAngle() {
        return Math.atan2(B.y - A.y, B.x - A.x);
    }
    
    function getBCAngle() {
        return rightAngle * Math.PI / 180;
    }
    
    // 缩短平滑圆弧（保持B点接地，弧长短且光滑）
    let smoothArcCache = { 
        center: {x:0,y:0}, startAngle:0, endAngle:0, arcLength:0, valid: false, 
        startPoint: {x:0,y:0}, endPoint: {x:0,y:0}, radius: SMOOTH_RADIUS 
    };
    
    function updateSmoothArcGeometry() {
        const angleAB = getABAngle();
        const angleBC = getBCAngle();
        
        const arcOffset = SMOOTH_RADIUS * 0.65;   // 约27px过渡区，短而平滑
        
        const dirAB_rev = getABDir();
        const startPoint = {
            x: B.x - dirAB_rev.x * arcOffset,
            y: B.y - dirAB_rev.y * arcOffset
        };
        const dirBC = getBCDir();
        const endPoint = {
            x: B.x + dirBC.x * arcOffset,
            y: B.y + dirBC.y * arcOffset
        };
        
        // 计算与AB在startPoint相切，与BC在endPoint相切的圆心
        const tangentStart = { x: dirAB_rev.x, y: dirAB_rev.y };
        const tangentEnd = { x: dirBC.x, y: dirBC.y };
        const normalStart = { x: -tangentStart.y, y: tangentStart.x };
        const normalEnd = { x: -tangentEnd.y, y: tangentEnd.x };
        
        const dx = endPoint.x - startPoint.x;
        const dy = endPoint.y - startPoint.y;
        const det = normalStart.x * normalEnd.y - normalStart.y * normalEnd.x;
        if (Math.abs(det) > 1e-6) {
            const t = (dx * normalEnd.y - dy * normalEnd.x) / det;
            const centerX = startPoint.x + t * normalStart.x;
            const centerY = startPoint.y + t * normalStart.y;
            const radius = Math.hypot(centerX - startPoint.x, centerY - startPoint.y);
            if (radius > 5 && radius < 140) {
                const startAngle = Math.atan2(startPoint.y - centerY, startPoint.x - centerX);
                let endAngle = Math.atan2(endPoint.y - centerY, endPoint.x - centerX);
                let delta = endAngle - startAngle;
                if (delta > Math.PI) delta -= 2*Math.PI;
                if (delta < -Math.PI) delta += 2*Math.PI;
                const arcLen = radius * Math.abs(delta);
                smoothArcCache = {
                    center: { x: centerX, y: centerY },
                    startAngle: startAngle,
                    endAngle: endAngle,
                    arcLength: Math.min(arcLen, 100),
                    radius: radius,
                    startPoint: startPoint,
                    endPoint: endPoint,
                    valid: true
                };
                return;
            }
        }
        // 后备圆弧
        const fallbackRadius = SMOOTH_RADIUS;
        const midAngle = (angleAB + angleBC) / 2;
        const perpDir = midAngle + Math.PI/2;
        const altCenter = {
            x: B.x + fallbackRadius * Math.cos(perpDir),
            y: B.y + fallbackRadius * Math.sin(perpDir)
        };
        const startAngAlt = Math.atan2(startPoint.y - altCenter.y, startPoint.x - altCenter.x);
        const endAngAlt = Math.atan2(endPoint.y - altCenter.y, endPoint.x - altCenter.x);
        let deltaAlt = endAngAlt - startAngAlt;
        if (deltaAlt > Math.PI) deltaAlt -= 2*Math.PI;
        if (deltaAlt < -Math.PI) deltaAlt += 2*Math.PI;
        smoothArcCache = {
            center: altCenter,
            startAngle: startAngAlt,
            endAngle: endAngAlt,
            arcLength: fallbackRadius * Math.abs(deltaAlt),
            radius: fallbackRadius,
            startPoint: startPoint,
            endPoint: endPoint,
            valid: true
        };
    }
    
    function getArcPoint(t) {
        if (!smoothArcCache.valid) return { x: B.x, y: B.y };
        const start = smoothArcCache.startAngle;
        const end = smoothArcCache.endAngle;
        const delta = end - start;
        const angle = start + delta * t;
        const cx = smoothArcCache.center.x;
        const cy = smoothArcCache.center.y;
        const r = smoothArcCache.radius;
        return {
            x: cx + r * Math.cos(angle),
            y: cy + r * Math.sin(angle)
        };
    }
    
    function getArcStartPoint() {
        return smoothArcCache.valid ? smoothArcCache.startPoint : getArcPoint(0);
    }
    
    function getArcEndPoint() {
        return smoothArcCache.valid ? smoothArcCache.endPoint : getArcPoint(1);
    }
    
    function resetBall() {
        ball.x = A.x;
        ball.y = A.y;
        ball.v = 0;
        ball.segment = 'AB';
        ball.moving = false;
        ball.stopped = false;
        ball.vanished = false;
        ball.arcParam = 0;
        trailPoints = [];
        frameCounter = 0;
        const warningDiv = document.getElementById('warningMsg');
        if(warningDiv) warningDiv.innerHTML = '';
        updateSmoothArcGeometry();
        updateUI();
        drawScene();
    }
    
    function updateUI() {
        document.getElementById('angleVal').innerText = rightAngle;
        let speed = ball.v.toFixed(2);
        document.getElementById('speedShow').innerText = speed;
        let stageMsg = '待释放';
        if (!ball.moving && !ball.stopped) stageMsg = '待释放';
        else if (ball.moving) {
            if (ball.segment === 'AB') stageMsg = '左侧下滑 ⬇️ 加速 (倾角28°)';
            else if (ball.segment === 'smoothArc') stageMsg = '短平滑轨道 · 流畅过渡';
            else if (ball.segment === 'BC') stageMsg = '右侧上滑 ⬆️ 减速 (加长斜面)';
            else if (ball.segment === 'ground') stageMsg = rightAngle===0 ? '水平理想运动' : '水平段滑行';
        } else if (ball.stopped) {
            if (ball.segment === 'BC') stageMsg = '右侧最高点 (惯性极限)';
            else if (ball.segment === 'ground') stageMsg = '静止于水平地面';
            else stageMsg = '停止';
        }
        if (ball.vanished) {
            stageMsg = '小球已飞出斜面';
        }
        document.getElementById('stageDesc').innerText = stageMsg;
        document.getElementById('heightStat').innerHTML = 'h₁';
        let rightH = '—';
        if (!ball.vanished && (ball.segment === 'BC' || ball.segment === 'ground')) {
            let h2 = (groundY - ball.y).toFixed(1);
            rightH = h2 + 'px';
        }
        document.getElementById('rightHeight').innerText = rightH;
        let dist = 0;
        if (!ball.vanished && (ball.segment === 'BC' || ball.segment === 'ground')) {
            dist = Math.abs(ball.x - B.x).toFixed(1);
        }
        document.getElementById('rangeStat').innerText = dist;
        let tag = '';
        if (rightAngle === 0) tag = '水平理想面';
        else if (rightAngle < 12) tag = '微小倾角';
        else if (rightAngle < 24) tag = '中倾角';
        else tag = '较大倾角 (≤30°)';
        document.getElementById('angleTag').innerText = tag;
        let fric = parseFloat(friction).toFixed(3);
        document.getElementById('fricVal').innerText = fric;
        document.getElementById('fricTag').innerText = friction<0.01?'理想光滑':(friction<0.05?'近光滑':'粗糙');
    }
    
    function addTrailPoint() {
        if (showTrail && ball.moving && !ball.vanished) {
            frameCounter++;
            if (frameCounter % TRAIL_INTERVAL === 0) {
                trailPoints.push({x: ball.x, y: ball.y});
                if (trailPoints.length > 140) trailPoints.shift();
            }
        }
    }
    
    // 物理积分 (左侧固定28°)
    function updatePhysics() {
        if (!ball.moving || ball.vanished) return;
        const dt = 0.68;
        const C = getCPoint();
        
        if (ball.segment === 'AB') {
            const angle = LEFT_ANGLE_RAD;
            const sinAngle = Math.sin(angle);
            const cosAngle = Math.cos(angle);
            let a = g * sinAngle;
            let normal = g * cosAngle;
            let frictionAcc = friction * normal;
            let netA = a - frictionAcc;
            ball.v += netA * dt;
            if (ball.v < 0) ball.v = 0;
            const dir = getABDir();
            const arcStart = getArcStartPoint();
            const distToArcStart = Math.hypot(arcStart.x - A.x, arcStart.y - A.y);
            let t = ((ball.x - A.x) * dir.x + (ball.y - A.y) * dir.y);
            t += ball.v * dt;
            if (t >= distToArcStart && distToArcStart > 0) {
                ball.x = arcStart.x;
                ball.y = arcStart.y;
                ball.segment = 'smoothArc';
                ball.arcParam = 0;
            } else {
                ball.x = A.x + t * dir.x;
                ball.y = A.y + t * dir.y;
            }
            addTrailPoint();
        }
        else if (ball.segment === 'smoothArc') {
            if (!smoothArcCache.valid || smoothArcCache.arcLength <= 0.02) {
                if (rightAngle === 0) ball.segment = 'ground';
                else ball.segment = 'BC';
                return;
            }
            let arcSpeed = Math.max(0.01, ball.v);
            let deltaLen = arcSpeed * dt;
            const totalLen = smoothArcCache.arcLength;
            let newParam = ball.arcParam + (deltaLen / totalLen);
            if (newParam >= 1.0) {
                newParam = 1.0;
                const endPt = getArcEndPoint();
                ball.x = endPt.x;
                ball.y = endPt.y;
                if (rightAngle === 0) {
                    ball.segment = 'ground';
                } else {
                    ball.segment = 'BC';
                }
                ball.arcParam = 0;
            } else {
                ball.arcParam = newParam;
                const pt = getArcPoint(ball.arcParam);
                ball.x = pt.x;
                ball.y = pt.y;
            }
            addTrailPoint();
        }
        else if (ball.segment === 'BC') {
            const angle = getBCAngle();
            const sinAngle = Math.sin(angle);
            const cosAngle = Math.cos(angle);
            let a = -g * sinAngle;
            let normal = g * cosAngle;
            let frictionAcc = friction * normal;
            let netA = a - frictionAcc;
            ball.v += netA * dt;
            if (ball.v < 0) {
                ball.v = 0;
                ball.moving = false;
                ball.stopped = true;
            }
            const dir = getBCDir();
            const arcEnd = getArcEndPoint();
            let t = Math.hypot(ball.x - arcEnd.x, ball.y - arcEnd.y);
            const sign = ((ball.x - arcEnd.x)*dir.x + (ball.y - arcEnd.y)*dir.y) >= 0 ? 1 : -1;
            t = Math.max(0, t);
            t += ball.v * dt * sign;
            const bcFullLen = Math.hypot(C.x - B.x, C.y - B.y);
            const offsetFromB = Math.hypot(arcEnd.x - B.x, arcEnd.y - B.y);
            const maxT = bcFullLen - offsetFromB;
            if (t >= maxT && maxT > 0) {
                ball.x = C.x;
                ball.y = C.y;
                ball.vanished = true;
                ball.moving = false;
            } else if (t <= 0) {
                ball.x = arcEnd.x;
                ball.y = arcEnd.y;
                ball.moving = false;
                ball.stopped = true;
            } else {
                ball.x = arcEnd.x + t * dir.x;
                ball.y = arcEnd.y + t * dir.y;
            }
            if (Math.abs(ball.v) < 0.02 && !ball.vanished) {
                ball.v = 0;
                ball.moving = false;
                ball.stopped = true;
            }
            addTrailPoint();
        }
        else if (ball.segment === 'ground') {
            let speed = ball.v;
            if (speed > 0) {
                let dec = friction * g;
                speed = Math.max(0, speed - dec * dt);
                ball.v = speed;
                ball.x += ball.v * dt;
                ball.y = groundY;
            }
            if (ball.v < 0.02 && friction > 0.001) {
                ball.v = 0;
                ball.moving = false;
                ball.stopped = true;
            }
            addTrailPoint();
        }
        if (ball.x > 930) ball.x = 930, ball.v = 0;
        if (ball.x < 20) ball.x = 20;
        updateUI();
    }
    
    // 绘制轨道: 统一暖金色 + 白色h1虚线向右移动并与A点相交
    function drawScene() {
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        // 辅助网格
        ctx.strokeStyle = '#2f4d5c';
        ctx.lineWidth = 0.5;
        for (let i=0; i<width; i+=40) {
            ctx.beginPath();
            ctx.moveTo(i,0); ctx.lineTo(i,height);
            ctx.strokeStyle='#203b44';
            ctx.stroke();
        }
        // 地面线
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width, groundY);
        ctx.strokeStyle = '#c9a96b';
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.strokeStyle = '#f5d742';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        
        const unifiedColor = '#F5C452';
        
        // 左侧斜面AB
        const arcStartPt = getArcStartPoint();
        ctx.beginPath();
        ctx.moveTo(A.x, A.y);
        ctx.lineTo(arcStartPt.x, arcStartPt.y);
        ctx.strokeStyle = unifiedColor;
        ctx.lineWidth = 5;
        ctx.shadowBlur = 6;
        ctx.stroke();
        
        // 平滑圆弧
        if (smoothArcCache.valid && smoothArcCache.arcLength > 2) {
            ctx.beginPath();
            const startAng = smoothArcCache.startAngle;
            const endAng = smoothArcCache.endAngle;
            const anticlockwise = (endAng - startAng) < 0;
            ctx.arc(smoothArcCache.center.x, smoothArcCache.center.y, smoothArcCache.radius, startAng, endAng, anticlockwise);
            ctx.strokeStyle = unifiedColor;
            ctx.lineWidth = 5;
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.moveTo(arcStartPt.x, arcStartPt.y);
            ctx.lineTo(getArcEndPoint().x, getArcEndPoint().y);
            ctx.strokeStyle = unifiedColor;
            ctx.stroke();
        }
        
        // 右侧斜面 BC (加长)
        const arcEndPt = getArcEndPoint();
        const C = getCPoint();
        ctx.beginPath();
        ctx.moveTo(arcEndPt.x, arcEndPt.y);
        ctx.lineTo(C.x, C.y);
        ctx.strokeStyle = unifiedColor;
        ctx.lineWidth = 5.5;
        ctx.stroke();
        
        // 倾角0时绘制水平延长虚线
        if (rightAngle === 0) {
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(B.x, groundY);
            ctx.lineTo(B.x + rightSlopeLen, groundY);
            ctx.strokeStyle = '#e5bc7c';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        ctx.shadowBlur = 0;
        ctx.font = 'bold 16px "Segoe UI"';
        ctx.fillStyle = '#ebcba0';
        ctx.fillText('A', A.x-20, A.y-10);
        ctx.fillStyle = '#ffdd99';
        ctx.fillText('B', B.x-12, B.y-12);
        ctx.fillStyle = '#F7C873';
        ctx.fillText('C', C.x+5, C.y-12);
        
        // 白色虚线竖直高度标尺 h1 —— 向右移动，与A点相交 (过A点竖直向下延长线恰好经过A点)
        ctx.beginPath();
        ctx.setLineDash([6, 8]);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.2;
        const verticalX = A.x;
        ctx.moveTo(verticalX, A.y);
        ctx.lineTo(verticalX, groundY);
        ctx.stroke();
        ctx.fillStyle = '#f5eac1';
        ctx.font = 'bold 14px "Segoe UI", monospace';
        ctx.fillText('h₁', verticalX - 26, (A.y + groundY) / 2);
        ctx.setLineDash([]);
        
        // 绘制轨迹点
        if (showTrail && trailPoints.length) {
            ctx.fillStyle = '#4aa3ff';
            ctx.shadowBlur = 6;
            for (let p of trailPoints) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.8, 0, 2*Math.PI);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }
        
        if (!ball.vanished) {
            ctx.shadowBlur = 16;
            ctx.shadowColor = '#f5821f';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 12, 0, 2*Math.PI);
            ctx.fillStyle = '#e04428';
            ctx.fill();
            ctx.fillStyle = '#fff0b5';
            ctx.beginPath();
            ctx.arc(ball.x-3, ball.y-3, 4, 0, 2*Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0;
        } else {
            // 小球飞出时显示"小球已飞出斜面"
            ctx.font = 'bold 20px "Segoe UI", "Microsoft YaHei"';
            ctx.fillStyle = '#ffaa66';
            ctx.shadowBlur = 0;
            ctx.fillText('小球已飞出斜面', 360, 180);
        }
        ctx.restore();
    }
    
    let animId;
    function animate() {
        if (ball.moving && !ball.vanished) updatePhysics();
        drawScene();
        animId = requestAnimationFrame(animate);
    }
    animate();
    
    function releaseBall() {
        if (ball.moving) return;
        if (ball.stopped || ball.vanished) resetBall();
        ball.moving = true;
        ball.stopped = false;
        ball.vanished = false;
        if (ball.segment !== 'AB') {
            resetBall();
            ball.moving = true;
        }
        ball.v = 0;
        trailPoints = [];
        frameCounter = 0;
        document.getElementById('warningMsg').innerHTML = '';
        updateUI();
    }
    
    function resetFull() {
        resetBall();
        updateUI();
        drawScene();
    }
    
    document.getElementById('angleSlider').addEventListener('input', (e) => {
        rightAngle = parseInt(e.target.value);
        resetFull();
    });
    document.getElementById('frictionSlider').addEventListener('input', (e) => {
        friction = parseFloat(e.target.value);
        resetFull();
    });
    document.getElementById('releaseBtn').addEventListener('click', releaseBall);
    document.getElementById('resetBtn').addEventListener('click', resetFull);
    document.getElementById('traceBtn').addEventListener('click', ()=>{
        showTrail = !showTrail;
        if (!showTrail) trailPoints = [];
    });
    canvas.addEventListener('click', releaseBall);
    resetFull();
})();
</script>
 </body>
