 <head>

  <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;

        #info-card {

            border-left: 3px solid #cc6600;

        #info-card p {

        }
        .formula-badge {
            background: rgba(200, 220, 255, 0.7);
            border-radius: 16px;
            padding: 4px 10px;

            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            border: 1px solid #6699cc;
            color: #004488;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        /* 控制面板 */
        #control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #aaa;
            border-radius: 16px;
            padding: 15px 18px;
            color: #222;
            width: 220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 30;
            font-weight: 300;
            letter-spacing: 0.5px;
            font-size: 0.8rem;
        }
        #control-panel h3 {
            margin: 0 0 10px;
            font-weight: 300;
            text-align: center;
            color: #3366cc;
            border-bottom: 1px solid #aaa;
            padding-bottom: 5px;
            font-size: 1rem;
        }
        .control-item {
            margin-bottom: 15px;
        }
        .control-item label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .control-item input[type="range"] {
            width: 100%;
            cursor: pointer;
            background: #ccc;
            height: 4px;
            border-radius: 5px;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff9933;
            border: 2px solid #fff;
            box-shadow: 0 0 5px #ffaa55;
            cursor: pointer;
        }
        .direction-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .dir-btn {
            background: #e0e0e0;
            border: 1px solid #aaa;
            color: #333;
            padding: 5px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1 0 auto;
            text-align: center;
            font-weight: 500;
        }
        .dir-btn:hover {
            background: #d0d0ff;
            border-color: #6688ff;
            color: #000;
        }
        .dir-btn.active {
            background: #6688ff;
            border-color: #3355cc;
            color: white;
            box-shadow: 0 0 8px #6688ff;
        }
        .value-indicator {
            display: inline-block;
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 16px;
            margin-left: 6px;
            font-size: 0.7rem;
            color: #333;
            border: 1px solid #aaa;
        }
        #footer-note {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: #555;
            font-size: 0.7rem;
            background: rgba(255,255,255,0.7);
            padding: 4px 12px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid #aaa;
            z-index: 20;
            letter-spacing: 0.5px;
        }
        #footer-note i {
            color: #cc6600;
            font-style: normal;
        }
    </style>

 <body>
  <div id="info-card">
   <h1>⚡ 洛伦兹力 · 安培力 ⚡</h1>
   <p>微观洛伦兹力 <span style="color:#228822">f = q v × B</span> → 宏观安培力 <span style="color:#cc3333">F = I L × B</span></p>
   <p>电流 I = n q S v &nbsp; | &nbsp; F = N·f</p>
   <div class="formula-badge">
    F = (n S L)·(q v B) = I L B
   </div>
   <p style="margin-top:8px; font-size:0.7rem; opacity:0.7;">正电荷48个 · 磁场箭头 · 白灰背景 · 宏观矢量带标注</p>
  </div>
  <div id="control-panel">
   <h3>⚙️ 交互控制<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB8AAAAeCAIAAABbkFLLAAAAhElEQVR42u1UQQ7AIAjr/x9Nl53cIq2w6yDGKGrBUgVvi0efTvfx0ykNmyds4xs9sunyQO+oQDO7wTqCLBFjJmSJGfYDhCIKYpnmjF5yuXcLcN4GrQSjDRbFAy2JYoKuyHW981SbhGH0a9hoKFN8DJz8E+jT2rAPr2nQB33QB33Qf49+Ac3l2rDIM4fEAAAAAElFTkSuQmCC" style="position: absolute; left: -99999px; top: -99999px; opacity: 0; pointer-events: none; width: 1px; height: 1px;"></h3><!-- 电流方向 -->
   <div class="control-item">
    <label>🔁 电流方向 <span id="current-dir-value" class="value-indicator">+X</span></label>
    <div class="direction-buttons">
     <div id="dir-pos" class="dir-btn active">
      +X
     </div>
     <div id="dir-neg" class="dir-btn">
      -X
     </div>
    </div>
   </div><!-- 电流大小 -->
   <div class="control-item">
    <label>⚡ 电流大小 <span id="current-mag-value" class="value-indicator">1.0</span></label> <input type="range" id="current-mag" min="0.2" max="2.0" step="0.1" value="1.0">
   </div><!-- 磁场方向 -->
   <div class="control-item">
    <label>🧲 磁场方向 <span id="B-dir-value" class="value-indicator">+Y</span></label>
    <div class="direction-buttons">
     <div id="B-y" class="dir-btn active">
      +Y
     </div>
     <div id="B-z" class="dir-btn">
      +Z
     </div>
     <div id="B-x" class="dir-btn">
      +X
     </div>
     <div id="B-ny" class="dir-btn">
      -Y
     </div>
    </div>
   </div>
   <p style="font-size:0.65rem; color:#666; margin:5px 0 0; text-align:center;">磁场箭头 | 每个电荷带速度/力箭头</p>
  </div>
  <div id="footer-note">
   <i>🖱️ 拖拽旋转 / 滚轮缩放</i>
  </div><!-- 引入 Three.js 核心库与辅助库 -->
  <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
  <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0); // 白灰底色
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(7, 3, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.maxPolarAngle = Math.PI / 2;
        controls.target.set(0, 0, 0);

        // --- 光照 (适应亮背景) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainLight.position.set(2, 5, 4);
        scene.add(mainLight);
        const fillLight = new THREE.DirectionalLight(0xccccff, 0.6);
        fillLight.position.set(-3, 2, -4);
        scene.add(fillLight);
        const pointLight1 = new THREE.PointLight(0x88aaff, 0.4);
        pointLight1.position.set(1, 2, 2);
        scene.add(pointLight1);
        const pointLight2 = new THREE.PointLight(0xffaa88, 0.3);
        pointLight2.position.set(-1, -1, 2);
        scene.add(pointLight2);

        // --- 背景星星 (装饰，淡一点) ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 200;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            starsPos[i*3] = (Math.random() - 0.5) * 200;
            starsPos[i*3+1] = (Math.random() - 0.5) * 200;
            starsPos[i*3+2] = (Math.random() - 0.5) * 200;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.2, transparent: true, opacity: 0.2 });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // ================== 模型 ==================
        const wireLength = 6.0;
        const wireRadius = 0.9;

        // --- 导线 (深色半透明) ---
        const wireGeo = new THREE.CylinderGeometry(wireRadius, wireRadius, wireLength, 48, 1);
        const wireMat = new THREE.MeshPhongMaterial({ 
            color: 0x3366cc, 
            emissive: 0x112233,
            transparent: true, 
            opacity: 0.3,
            shininess: 30,
            side: THREE.DoubleSide
        });
        const wire = new THREE.Mesh(wireGeo, wireMat);
        wire.rotation.z = -Math.PI / 2;
        wire.position.set(0, 0, 0);
        scene.add(wire);

        const edges = new THREE.EdgesGeometry(wireGeo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x2255aa, opacity: 0.5, transparent: true }));
        line.rotation.z = -Math.PI / 2;
        line.position.set(0, 0, 0);
        scene.add(line);

        // --- 磁场表示：箭头组 (均匀分布) ---
        let BVector = new THREE.Vector3(0, 1, 0); // 默认 +Y
        const BColor = 0x3366cc;

        const arrowGroup = new THREE.Group();
        // 在空间网格上放置箭头
        for (let x = -4; x <= 4; x += 1.2) {
            for (let y = -2; y <= 2; y += 1.2) {
                for (let z = -3; z <= 3; z += 1.2) {
                    if (Math.abs(x) < 1.0 && Math.abs(y) < 1.0 && Math.abs(z) < 1.0) continue;
                    const pos = new THREE.Vector3(x, y, z);
                    const arrow = new THREE.ArrowHelper(BVector.clone(), pos, 0.8, BColor, 0.3, 0.2);
                    arrowGroup.add(arrow);
                }
            }
        }
        for (let y of [-2.5, 2.5]) {
            for (let x = -4; x <= 4; x += 1.2) {
                for (let z = -3; z <= 3; z += 1.2) {
                    if (Math.abs(x) < 1.0 && Math.abs(z) < 1.0) continue;
                    const pos = new THREE.Vector3(x, y, z);
                    const arrow = new THREE.ArrowHelper(BVector.clone(), pos, 0.8, BColor, 0.3, 0.2);
                    arrowGroup.add(arrow);
                }
            }
        }
        scene.add(arrowGroup);

        // 大箭头指示磁场方向
        const bigBArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(-3, 2.5, 2.5), 1.2, 0x3366cc, 0.4, 0.25);
        scene.add(bigBArrow);

        // --- 正电荷 (48个，规则排列) ---
        const charges = [];
        const chargeRadius = 0.15;
        const positions = [];
        const xVals = [-2.2, -0.7, 0.7, 2.2]; // 4层
        const radii = [0, 0.5 * wireRadius, 0.8 * wireRadius];
        const thetaCounts = [1, 5, 6]; // 4*(1+5+6)=48
        for (let ix of xVals) {
            for (let ir = 0; ir < radii.length; ir++) {
                const r = radii[ir];
                const nTheta = thetaCounts[ir];
                for (let iTheta = 0; iTheta < nTheta; iTheta++) {
                    let y, z;
                    if (r === 0) { y = 0; z = 0; }
                    else {
                        const angle = (iTheta / nTheta) * Math.PI * 2;
                        y = Math.cos(angle) * r;
                        z = Math.sin(angle) * r;
                    }
                    positions.push(new THREE.Vector3(ix, y, z));
                }
            }
        }

        const geo = new THREE.SphereGeometry(chargeRadius, 12);
        const mat = new THREE.MeshStandardMaterial({ color: 0xcc6600, emissive: 0x442200 });
        positions.forEach(pos => {
            const charge = new THREE.Mesh(geo, mat.clone());
            charge.position.copy(pos);
            charge.userData.orbitY = pos.y;
            charge.userData.orbitZ = pos.z;
            const vArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 0.5, 0x339999, 0.2, 0.12);
            charge.add(vArrow);
            const fArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), 0.7, 0x33aa33, 0.25, 0.15);
            charge.add(fArrow);
            scene.add(charge);
            charges.push({ mesh: charge, vArrow, fArrow });
        });

        // --- 宏观安培力箭头 (红色) ---
        const fMacroArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0.5, 1.5), 2.2, 0xcc3333, 0.7, 0.45);
        scene.add(fMacroArrow);
        const fMacroArrow2 = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, -0.5, 0), 1.8, 0xcc5555, 0.5, 0.3);
        scene.add(fMacroArrow2);

        // --- 电流方向箭头 (橙色) ---
        const iArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(2.2, 1.2, 1.2), 1.8, 0xcc6600, 0.5, 0.3);
        scene.add(iArrow);

        // ================== 添加物理量标签 (CSS2D) ==================
        function createLabel(text, color, position, fontSize = '1.2rem') {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = fontSize;
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 2px rgba(255,255,255,0.8)';
            div.style.background = 'rgba(255,255,255,0.7)';
            div.style.padding = '2px 8px';
            div.style.borderRadius = '4px';
            div.style.border = '1px solid ' + color;
            div.style.backdropFilter = 'blur(2px)';
            div.style.boxShadow = '0 2px 6px rgba(0,0,0,0.1)';
            const label = new CSS2DObject(div);
            label.position.copy(position);
            scene.add(label);
            return label;
        }

        createLabel('F', '#cc3333', new THREE.Vector3(0, 1.0, 2.8), '1.3rem');
        createLabel('I', '#cc6600', new THREE.Vector3(3.5, 1.5, 1.5), '1.3rem');
        createLabel('B', '#3366cc', new THREE.Vector3(-2.0, 3.2, 3.0), '1.3rem');
        createLabel('F', '#cc5555', new THREE.Vector3(0, -0.8, 1.8), '1.0rem');

        // ================== 交互控制 ==================
        let currentDir = 1;
        let currentMag = 1.0;

        const dirPosBtn = document.getElementById('dir-pos');
        const dirNegBtn = document.getElementById('dir-neg');
        const currentMagInput = document.getElementById('current-mag');
        const currentMagValue = document.getElementById('current-mag-value');
        const currentDirValue = document.getElementById('current-dir-value');
        const B_yBtn = document.getElementById('B-y');
        const B_zBtn = document.getElementById('B-z');
        const B_xBtn = document.getElementById('B-x');
        const B_nyBtn = document.getElementById('B-ny');
        const BdirValue = document.getElementById('B-dir-value');

        function setBDir(x, y, z, label) {
            BVector.set(x, y, z).normalize();
            BdirValue.innerText = label;
            [B_yBtn, B_zBtn, B_xBtn, B_nyBtn].forEach(btn => btn.classList.remove('active'));
            if (label === '+Y') B_yBtn.classList.add('active');
            else if (label === '+Z') B_zBtn.classList.add('active');
            else if (label === '+X') B_xBtn.classList.add('active');
            else if (label === '-Y') B_nyBtn.classList.add('active');
            updateFromControls();
        }

        function updateFromControls() {
            currentDirValue.innerText = currentDir === 1 ? '+X' : '-X';
            currentMagValue.innerText = currentMag.toFixed(1);
            const vDir = new THREE.Vector3(currentDir, 0, 0);
            const fDir = new THREE.Vector3().crossVectors(vDir, BVector).normalize();
            charges.forEach(item => {
                item.vArrow.setDirection(vDir);
                item.vArrow.setLength(0.5 * currentMag, 0.2, 0.12);
                item.fArrow.setDirection(fDir);
                item.fArrow.setLength(0.7 * currentMag, 0.25, 0.15);
            });
            const I = new THREE.Vector3(currentDir, 0, 0);
            const Fdir = new THREE.Vector3().crossVectors(I, BVector).normalize();
            fMacroArrow.setDirection(Fdir);
            fMacroArrow.setLength(2.2 * currentMag, 0.7, 0.45);
            fMacroArrow2.setDirection(Fdir);
            fMacroArrow2.setLength(1.8 * currentMag, 0.5, 0.3);
            iArrow.setDirection(I);

            arrowGroup.children.forEach(arrow => {
                arrow.setDirection(BVector);
            });
            bigBArrow.setDirection(BVector);
        }

        dirPosBtn.addEventListener('click', () => {
            dirPosBtn.classList.add('active');
            dirNegBtn.classList.remove('active');
            currentDir = 1;
            updateFromControls();
        });
        dirNegBtn.addEventListener('click', () => {
            dirNegBtn.classList.add('active');
            dirPosBtn.classList.remove('active');
            currentDir = -1;
            updateFromControls();
        });
        currentMagInput.addEventListener('input', (e) => {
            currentMag = parseFloat(e.target.value);
            updateFromControls();
        });
        B_yBtn.addEventListener('click', () => setBDir(0, 1, 0, '+Y'));
        B_zBtn.addEventListener('click', () => setBDir(0, 0, 1, '+Z'));
        B_xBtn.addEventListener('click', () => setBDir(1, 0, 0, '+X'));
        B_nyBtn.addEventListener('click', () => setBDir(0, -1, 0, '-Y'));
        updateFromControls();

        // ================== 动画 ==================
        const baseSpeed = 0.02;
        const margin = 0.3;
        const leftBound = -wireLength/2 - margin;
        const rightBound = wireLength/2 + margin;

        function animate() {
            requestAnimationFrame(animate);
            const speed = baseSpeed * currentMag;
            charges.forEach(item => {
                let mesh = item.mesh;
                mesh.position.x += currentDir * speed;
                if (currentDir === 1) {
                    if (mesh.position.x > rightBound) {
                        mesh.position.x = leftBound;
                        mesh.position.y = mesh.userData.orbitY;
                        mesh.position.z = mesh.userData.orbitZ;
                    }
                } else {
                    if (mesh.position.x < leftBound) {
                        mesh.position.x = rightBound;
                        mesh.position.y = mesh.userData.orbitY;
                        mesh.position.z = mesh.userData.orbitZ;
                    }
                }
            });

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            labelRenderer.setSize(width, height);
        });
    </script>
