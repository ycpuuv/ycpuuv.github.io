     <h4 class="text-sm font-semibold text-yellow-800 mb-1">变压器原理</h4>
     <p class="text-xs text-yellow-700 leading-relaxed">变压器利用电磁感应原理工作。铁芯由硅钢片叠加而成，可减少涡流损耗。原线圈通入交流电后，在铁芯中产生交变磁通，副线圈中感应出电动势。电压比等于匝数比。</p>

   </div><button id="showBtn" class="hidden absolute top-4 left-4 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg shadow-lg z-10 transition-colors"> 显示控制面板 </button>
   <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur rounded-lg shadow-lg p-3 text-xs text-gray-600 z-10">
    <div>
     🖱️ 左键拖动旋转 | 滚轮缩放 | 右键平移

  </div>
  <script>
        let scene, camera, renderer
        let coreGroup, primaryCoil, secondaryCoil, magneticLines
        let isAssembled = true
        let animationId

        const params = {
            inputVoltage: 220,
            primaryTurns: 1000,
            secondaryTurns: 100
        }

        function init() {
            const canvas = document.getElementById('canvas')
            
            scene = new THREE.Scene()
            scene.background = new THREE.Color(0xffffff)
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000)
            camera.position.set(8, 6, 10)
            
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true })
            renderer.setSize(window.innerWidth, window.innerHeight)
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
            renderer.shadowMap.enabled = true
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6)
            scene.add(ambientLight)
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8)
            directionalLight.position.set(10, 15, 10)
            directionalLight.castShadow = true
            scene.add(directionalLight)
            
            const pointLight = new THREE.PointLight(0xffffff, 0.4)
            pointLight.position.set(-5, 5, -5)
            scene.add(pointLight)
            
            createTransformer()
            createMagneticLines()
            
            setupOrbitControls()
            setupEventListeners()
            calculateOutput()
            
            animate()
        }

        function createLaminatedPart(width, height, depth, material, sheetCount) {
            const group = new THREE.Group()
            const sheetThickness = depth / sheetCount
            const gap = 0.01
            
            for (let i = 0; i < sheetCount; i++) {
                const sheetGeom = new THREE.BoxGeometry(width, height, sheetThickness - gap)
                const sheet = new THREE.Mesh(sheetGeom, material)
                sheet.position.z = -depth / 2 + sheetThickness / 2 + i * sheetThickness
                group.add(sheet)
            }
            
            return group
        }

        function createTransformer() {
            coreGroup = new THREE.Group()
            
            const coreMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x4a5568,
                shininess: 30
            })
            
            const sheetCount = 12
            const coreDepth = 1.2
            
            const uCoreGroup = new THREE.Group()
            uCoreGroup.name = 'uCore'
            
            const leftPillar = createLaminatedPart(0.8, 4, coreDepth, coreMaterial, sheetCount)
            leftPillar.position.set(-2, 0, 0)
            uCoreGroup.add(leftPillar)
            
            const rightPillar = createLaminatedPart(0.8, 4, coreDepth, coreMaterial, sheetCount)
            rightPillar.position.set(2, 0, 0)
            uCoreGroup.add(rightPillar)
            
            const bottomBar = createLaminatedPart(4.8, 0.8, coreDepth, coreMaterial, sheetCount)
            bottomBar.position.set(0, -1.6, 0)
            uCoreGroup.add(bottomBar)
            
            coreGroup.add(uCoreGroup)
            
            const topBarGroup = createLaminatedPart(4.8, 0.8, coreDepth, coreMaterial, sheetCount)
            topBarGroup.position.set(0, 1.6, 0)
            topBarGroup.name = 'iCore'
            coreGroup.add(topBarGroup)
            
            scene.add(coreGroup)
            
            const primaryMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xef4444,
                shininess: 50
            })
            
            primaryCoil = new THREE.Group()
            primaryCoil.name = 'primaryCoil'
            
            const primaryPoints = []
            const primaryTurns = 25
            const primaryRadius = 0.7
            const primaryHeight = 2.8
            const primaryStartY = -1.4
            
            for (let i = 0; i <= primaryTurns * 30; i++) {
                const t = i / 32
                const angle = t * Math.PI * 2
                const y = primaryStartY + (t / primaryTurns) * primaryHeight
                const x = -2 + Math.cos(angle) * primaryRadius
                const z = Math.sin(angle) * primaryRadius
                primaryPoints.push(new THREE.Vector3(x, y, z))
            }
            
            const primaryCurve = new THREE.CatmullRomCurve3(primaryPoints)
            const primaryTubeGeom = new THREE.TubeGeometry(primaryCurve, primaryTurns * 32, 0.05, 8, false)
            const primaryTube = new THREE.Mesh(primaryTubeGeom, primaryMaterial)
            primaryCoil.add(primaryTube)
            
            const primaryWireGeom = new THREE.CylinderGeometry(0.05, 0.05, 1.2, 8)
            const primaryWire1 = new THREE.Mesh(primaryWireGeom, primaryMaterial)
            primaryWire1.position.set(-2 + primaryRadius, 2.0, 0)
            //primaryCoil.add(primaryWire1)
            
            const primaryWire2 = new THREE.Mesh(primaryWireGeom, primaryMaterial)
            primaryWire2.position.set(-2 - primaryRadius, 2.0, 0)
            //primaryCoil.add(primaryWire2)
            
            scene.add(primaryCoil)
            
            const secondaryMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x3b82f6,
                shininess: 50
            })
            
            secondaryCoil = new THREE.Group()
            secondaryCoil.name = 'secondaryCoil'
            
            const secondaryPoints = []
            const secondaryTurns = 18
            const secondaryRadius = 0.7
            const secondaryHeight = 2.6
            const secondaryStartY = -1.3
            
            for (let i = 0; i <= secondaryTurns * 30; i++) {
                const t = i / 32
                const angle = t * Math.PI * 2
                const y = secondaryStartY + (t / secondaryTurns) * secondaryHeight
                const x = 2 + Math.cos(angle) * secondaryRadius
                const z = Math.sin(angle) * secondaryRadius
                secondaryPoints.push(new THREE.Vector3(x, y, z))
            }
            
            const secondaryCurve = new THREE.CatmullRomCurve3(secondaryPoints)
            const secondaryTubeGeom = new THREE.TubeGeometry(secondaryCurve, secondaryTurns * 32, 0.06, 8, false)
            const secondaryTube = new THREE.Mesh(secondaryTubeGeom, secondaryMaterial)
            secondaryCoil.add(secondaryTube)
            
            const secondaryWire1 = new THREE.Mesh(primaryWireGeom, secondaryMaterial)
            secondaryWire1.position.set(2 + secondaryRadius, 1.0, 0)
            //secondaryCoil.add(secondaryWire1)
            
            const secondaryWire2 = new THREE.Mesh(primaryWireGeom, secondaryMaterial)
            secondaryWire2.position.set(2 - secondaryRadius, 1.0, 0)
            //secondaryCoil.add(secondaryWire2)
            
            scene.add(secondaryCoil)
        }

        function createMagneticLines() {
            magneticLines = new THREE.Group()
            magneticLines.name = 'magneticLines'
            magneticLines.visible = false
            
            const lineMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x10b981,
                transparent: true,
                opacity: 0.8
            })
            
            const lineCount = 5
            for (let i = 0; i < lineCount; i++) {
                const offset = (i - 2) * 0.2
                
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(-2, 1.2, offset),
                    new THREE.Vector3(-1, 1.6, offset),
                    new THREE.Vector3(0, 1.6, offset),
                    new THREE.Vector3(1, 1.6, offset),
                    new THREE.Vector3(2, 1.2, offset),
                    new THREE.Vector3(2, 0, offset),
                    new THREE.Vector3(2, -1.2, offset),
                    new THREE.Vector3(1, -1.6, offset),
                    new THREE.Vector3(0, -1.6, offset),
                    new THREE.Vector3(-1, -1.6, offset),
                    new THREE.Vector3(-2, -1.2, offset),
                    new THREE.Vector3(-2, 0, offset),
                    new THREE.Vector3(-2, 1.2, offset)
                ], true)
                
                const tubeGeom = new THREE.TubeGeometry(curve, 64, 0.03, 8, true)
                const tube = new THREE.Mesh(tubeGeom, lineMaterial)
                magneticLines.add(tube)
                
                const arrowPositions = [0.15, 0.4, 0.65, 0.9]
                arrowPositions.forEach(function(t) {
                    const point = curve.getPointAt(t)
                    const tangent = curve.getTangentAt(t)
                    
                    const arrowGeom = new THREE.ConeGeometry(0.08, 0.2, 8)
                    const arrow = new THREE.Mesh(arrowGeom, lineMaterial)
                    arrow.position.copy(point)
                    
                    const axis = new THREE.Vector3(0, 1, 0)
                    const quaternion = new THREE.Quaternion().setFromUnitVectors(axis, tangent.normalize())
                    arrow.quaternion.copy(quaternion)
                    
                    magneticLines.add(arrow)
                })
            }
            
            scene.add(magneticLines)
        }

        function setupOrbitControls() {
            let isDragging = false
            let isPanning = false
            let previousMousePosition = { x: 0, y: 0 }
            let spherical = { theta: Math.PI / 4, phi: Math.PI / 3, radius: 15 }
            let target = new THREE.Vector3(0, 0, 0)

            const canvas = document.getElementById('canvas')

            function updateCameraPosition() {
                camera.position.x = target.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta)
                camera.position.y = target.y + spherical.radius * Math.cos(spherical.phi)
                camera.position.z = target.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta)
                camera.lookAt(target)
            }

            canvas.addEventListener('mousedown', function(e) {
                if (e.button === 0) {
                    isDragging = true
                } else if (e.button === 2) {
                    isPanning = true
                }
                previousMousePosition = { x: e.clientX, y: e.clientY }
            })

            canvas.addEventListener('mousemove', function(e) {
                const deltaX = e.clientX - previousMousePosition.x
                const deltaY = e.clientY - previousMousePosition.y

                if (isDragging) {
                    spherical.theta -= deltaX * 0.01
                    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi + deltaY * 0.01))
                    updateCameraPosition()
                }

                if (isPanning) {
                    const panSpeed = 0.01 * spherical.radius
                    const right = new THREE.Vector3()
                    const up = new THREE.Vector3()
                    camera.getWorldDirection(right)
                    right.crossVectors(camera.up, right).normalize()
                    up.copy(camera.up)
                    target.add(right.multiplyScalar(-deltaX * panSpeed))
                    target.add(up.multiplyScalar(deltaY * panSpeed))
                    updateCameraPosition()
                }

                previousMousePosition = { x: e.clientX, y: e.clientY }
            })

            canvas.addEventListener('mouseup', function() {
                isDragging = false
                isPanning = false
            })

            canvas.addEventListener('mouseleave', function() {
                isDragging = false
                isPanning = false
            })

            canvas.addEventListener('wheel', function(e) {
                e.preventDefault()
                spherical.radius *= e.deltaY > 0 ? 1.1 : 0.9
                spherical.radius = Math.max(5, Math.min(50, spherical.radius))
                updateCameraPosition()
            })

            canvas.addEventListener('contextmenu', function(e) {
                e.preventDefault()
            })

            let touchStartDistance = 0

            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault()
                if (e.touches.length === 1) {
                    isDragging = true
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY }
                } else if (e.touches.length === 2) {
                    isDragging = false
                    const dx = e.touches[0].clientX - e.touches[1].clientX
                    const dy = e.touches[0].clientY - e.touches[1].clientY
                    touchStartDistance = Math.sqrt(dx * dx + dy * dy)
                }
            })

            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault()
                if (e.touches.length === 1 && isDragging) {
                    const deltaX = e.touches[0].clientX - previousMousePosition.x
                    const deltaY = e.touches[0].clientY - previousMousePosition.y
                    spherical.theta -= deltaX * 0.01
                    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi + deltaY * 0.01))
                    updateCameraPosition()
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY }
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX
                    const dy = e.touches[0].clientY - e.touches[1].clientY
                    const distance = Math.sqrt(dx * dx + dy * dy)
                    const scale = touchStartDistance / distance
                    spherical.radius = Math.max(5, Math.min(50, spherical.radius * scale))
                    touchStartDistance = distance
                    updateCameraPosition()
                }
            })

            canvas.addEventListener('touchend', function() {
                isDragging = false
            })

            updateCameraPosition()
        }

        function setupEventListeners() {
            document.getElementById('hideBtn').addEventListener('click', function() {
                document.getElementById('controlPanel').classList.add('-translate-x-full')
                document.getElementById('showBtn').classList.remove('hidden')
            })

            document.getElementById('showBtn').addEventListener('click', function() {
                document.getElementById('controlPanel').classList.remove('-translate-x-full')
                document.getElementById('showBtn').classList.add('hidden')
            })

            document.getElementById('assembleBtn').addEventListener('click', function() {
                animateAssemble()
            })

            document.getElementById('disassembleBtn').addEventListener('click', function() {
                animateDisassemble()
            })

            document.getElementById('showCore').addEventListener('change', function(e) {
                coreGroup.visible = e.target.checked
            })

            document.getElementById('showPrimary').addEventListener('change', function(e) {
                primaryCoil.visible = e.target.checked
            })

            document.getElementById('showSecondary').addEventListener('change', function(e) {
                secondaryCoil.visible = e.target.checked
            })

            document.getElementById('showMagnetic').addEventListener('change', function(e) {
                magneticLines.visible = e.target.checked
            })

            document.getElementById('inputVoltage').addEventListener('input', function(e) {
                params.inputVoltage = parseFloat(e.target.value) || 0
                calculateOutput()
            })

            document.getElementById('primaryTurns').addEventListener('input', function(e) {
                params.primaryTurns = parseInt(e.target.value) || 1
                calculateOutput()
            })

            document.getElementById('secondaryTurns').addEventListener('input', function(e) {
                params.secondaryTurns = parseInt(e.target.value) || 1
                calculateOutput()
            })

            window.addEventListener('resize', function() {
                camera.aspect = window.innerWidth / window.innerHeight
                camera.updateProjectionMatrix()
                renderer.setSize(window.innerWidth, window.innerHeight)
            })
        }

        function calculateOutput() {
            const u1 = params.inputVoltage
            const n1 = params.primaryTurns
            const n2 = params.secondaryTurns
            
            const u2 = (u1 * n2) / n1
            
            document.getElementById('outputVoltage').textContent = u2.toFixed(2) + ' V'
        }

        function animateDisassemble() {
            if (!isAssembled) return
            isAssembled = false
            
            const duration = 1000
            const startTime = Date.now()
            
            const iCore = coreGroup.children.find(function(c) { return c.name === 'iCore' })
            const uCore = coreGroup.children.find(function(c) { return c.name === 'uCore' })
            
            const startPositions = {
                iCore: iCore.position.clone(),
                uCore: uCore.position.clone(),
                primary: primaryCoil.position.clone(),
                secondary: secondaryCoil.position.clone()
            }
            
            const endPositions = {
                iCore: new THREE.Vector3(0, 5, 0),
                uCore: new THREE.Vector3(0, -2, 0),
                primary: new THREE.Vector3(-5, 0, 0),
                secondary: new THREE.Vector3(5, 0, 0)
            }
            
            function animateStep() {
                const elapsed = Date.now() - startTime
                const progress = Math.min(elapsed / duration, 1)
                const eased = 1 - Math.pow(1 - progress, 3)
                
                iCore.position.lerpVectors(startPositions.iCore, endPositions.iCore, eased)
                uCore.position.lerpVectors(startPositions.uCore, endPositions.uCore, eased)
                primaryCoil.position.lerpVectors(startPositions.primary, endPositions.primary, eased)
                secondaryCoil.position.lerpVectors(startPositions.secondary, endPositions.secondary, eased)
                
                if (progress < 1) {
                    requestAnimationFrame(animateStep)
                }
            }
            
            animateStep()
        }

        function animateAssemble() {
            if (isAssembled) return
            isAssembled = true
            
            const duration = 1000
            const startTime = Date.now()
            
            const iCore = coreGroup.children.find(function(c) { return c.name === 'iCore' })
            const uCore = coreGroup.children.find(function(c) { return c.name === 'uCore' })
            
            const startPositions = {
                iCore: iCore.position.clone(),
                uCore: uCore.position.clone(),
                primary: primaryCoil.position.clone(),
                secondary: secondaryCoil.position.clone()
            }
            
            const endPositions = {
                iCore: new THREE.Vector3(0, 1.6, 0),
                uCore: new THREE.Vector3(0, 0, 0),
                primary: new THREE.Vector3(0, 0, 0),
                secondary: new THREE.Vector3(0, 0, 0)
            }
            
            function animateStep() {
                const elapsed = Date.now() - startTime
                const progress = Math.min(elapsed / duration, 1)
                const eased = 1 - Math.pow(1 - progress, 3)
                
                iCore.position.lerpVectors(startPositions.iCore, endPositions.iCore, eased)
                uCore.position.lerpVectors(startPositions.uCore, endPositions.uCore, eased)
                primaryCoil.position.lerpVectors(startPositions.primary, endPositions.primary, eased)
                secondaryCoil.position.lerpVectors(startPositions.secondary, endPositions.secondary, eased)
                
                if (progress < 1) {
                    requestAnimationFrame(animateStep)
                }
            }
            
            animateStep()
        }

        let magneticAnimationTime = 0
        function animate() {
            animationId = requestAnimationFrame(animate)
            
            if (magneticLines.visible) {
                magneticAnimationTime += 0.02
                magneticLines.children.forEach(function(child, index) {
                    if (child.material) {
                        child.material.opacity = 0.5 + 0.3 * Math.sin(magneticAnimationTime + index * 0.5)
                    }
                })
            }
            
            renderer.render(scene, camera)
        }

        init()
    </script>
