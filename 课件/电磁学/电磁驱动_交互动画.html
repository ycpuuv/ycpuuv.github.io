<!doctype html>
<html lang="zh-CN">
 <head>
  <meta charset="UTF-8">
  <title>电磁驱动演示 - 物理参数优化版</title>
  <style>
        body { margin: 0; overflow: hidden; background-color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* 3D 容器 */
        #canvas-container { width: 100vw; height: 100vh; display: block; background: radial-gradient(circle, #f0f0f0 0%, #c0c0c0 100%); }

        /* 左上角大标题 */
        #main-title {
            position: absolute;
            top: 30px;
            left: 40px;
            font-size: 56px;
            font-weight: 900;
            color: #222; 
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5); 
            pointer-events: none;
            z-index: 5;
            letter-spacing: 4px;
        }

        /* 右侧功能区 */
        #ui-sidebar {
            position: absolute;
            top: 0;
            right: 0;
            width: 420px;
            height: 100%;
            background: rgba(35, 35, 35, 0.95);
            border-left: 1px solid #555;
            padding: 25px; 
            box-sizing: border-box;
            overflow-y: auto; 
            backdrop-filter: blur(8px);
            z-index: 10;
            color: #eee;
            display: flex;
            flex-direction: column;
        }

        h2 { 
            color: #fff; 
            font-size: 24px; 
            margin-top: 0; 
            border-bottom: 2px solid #666; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }
        
        .control-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            color: #ddd; 
            margin-bottom: 8px; 
            font-size: 18px; 
            font-weight: bold; 
        }
        
        button {
            width: 100%;
            padding: 12px; 
            margin-bottom: 10px; 
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 16px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-start { background-color: #28a745; color: white; }
        .btn-start:hover { background-color: #218838; transform: translateY(-2px); }
        .btn-pause { background-color: #ffc107; color: black; }
        .btn-pause:hover { background-color: #e0a800; transform: translateY(-2px); }
        .btn-reset { background-color: #dc3545; color: white; }
        .btn-reset:hover { background-color: #c82333; transform: translateY(-2px); }

        .info-text { 
            color: #ccc; 
            font-size: 15px; 
            line-height: 1.5; 
            background: rgba(0,0,0,0.4); 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #555;
        }
        .info-text p { margin: 6px 0; }

        /* 侧边栏底部的图表区域 */
        .sidebar-chart-section {
            margin-top: auto; 
            padding-top: 15px;
            border-top: 2px solid #555;
            flex-shrink: 0; 
        }

        .chart-title {
            font-size: 18px;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            font-weight: bold;
        }
        .chart-title::before {
            content: '📊';
            margin-right: 10px;
            font-size: 20px;
        }

        .canvas-wrapper {
            position: relative;
            height: 220px; 
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
  <script src="https://img.zxxk.com/rbm/html/2026/4/30/0caa831e-4d55-41ff-ad4e-53eb889b831b.js"></script>
  <script src="https://img.zxxk.com/rbm/html/2026/4/30/384f2916-532f-4ecc-89f9-74dac8ec1305.js"></script>
  <script src="https://img.zxxk.com/rbm/html/2026/4/30/6fb3b1aa-865c-47d4-929f-af64024252e3.js"></script>
 </head>
 <body>
  <!-- 左上角大标题 -->
  <div id="main-title">
   电磁驱动
  </div><!-- 3D 场景容器 -->
  <div id="canvas-container"></div><!-- 右侧侧边栏 -->
  <div id="ui-sidebar">
   <h2>控制面板</h2>
   <div class="control-group">
    <button class="btn-start" onclick="startSim()">▶ 开始摇动</button> <button class="btn-pause" onclick="pauseSim()">⏸ 停止摇动</button> <button class="btn-reset" onclick="resetSim()">↺ 重置实验</button>
   </div>
   <div class="control-group">
    <label>实验现象说明：</label>
    <div class="info-text">
     <p><strong>1. 磁场旋转：</strong><br>
      点击开始，曲柄带动磁铁旋转。</p>
     <p><strong>2. 磁通量变化：</strong><br>
      旋转磁场切割闭合铝框。</p>
     <p><strong>3. 异步跟随：</strong><br>
      铝框产生感应电流并受力旋转，但速度略慢于磁铁。</p>
    </div>
   </div><!-- 图表区域 -->
   <div class="sidebar-chart-section">
    <div class="chart-title">
     实时转速对比
    </div>
    <div class="canvas-wrapper">
     <canvas id="speedChart"></canvas>
    </div>
   </div>
  </div>
  <script>
        // ================= 全局变量 =================
        let scene, camera, renderer, controls;
        let magnetGroup, frameGroup, crankHandle, experimentRoot;
        
        // 物理状态
        let isRunning = false;
        let magnetSpeed = 0;
        let frameSpeed = 0;
        let magnetAngle = 0;
        let frameAngle = 0;

        // ================= 核心物理参数调整 =================
        const TARGET_MAGNET_SPEED = 4.0; 
        const COUPLING_FACTOR = 0.015;   // 减小磁耦合力，让稳态速度差更大
        const FRAME_FRICTION = 0.006;    // 调整摩擦力，配合耦合系数控制最终转速比
        const FRAME_INERTIA = 2.5;       // 显著增大转动惯量，使启动和停止变得非常缓慢

        // 图表相关
        let speedChart;
        let chartLabels = [];
        let dataMagnet = [];
        let dataFrame = [];
        let frameCount = 0;
        const MAX_CHART_POINTS = 100; // 增加图表记录点数，以容纳更长的启停过程

        // ================= 初始化 =================
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd0d0d0);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 14, 22); 
            camera.lookAt(-6, 4, 0); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.target.set(-6, 4, 0); 
            }

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            createExperimentSetup();
            initChart();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function createExperimentSetup() {
            experimentRoot = new THREE.Group();
            experimentRoot.position.x = -10; 
            scene.add(experimentRoot);

            const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
            const baseMat = new THREE.MeshStandardMaterial({ color: 0xd2691e, roughness: 0.6 });
            const magnetRed = new THREE.MeshPhongMaterial({ color: 0xe63946, shininess: 80 });
            const magnetBlue = new THREE.MeshPhongMaterial({ color: 0x1d3557, shininess: 80 });
            const steelMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.4, metalness: 0.6 });
            const alumMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3, metalness: 0.4 });

            const baseGeo = new THREE.BoxGeometry(12, 0.5, 8);
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.25;
            base.receiveShadow = true;
            experimentRoot.add(base);

            const standGroup = new THREE.Group();
            const postGeo = new THREE.BoxGeometry(0.8, 8, 0.8);
            const postL = new THREE.Mesh(postGeo, woodMat);
            postL.position.set(-5, 4.25, 0); 
            postL.castShadow = true;
            const postR = new THREE.Mesh(postGeo, woodMat);
            postR.position.set(5, 4.25, 0); 
            postR.castShadow = true;
            const beamGeo = new THREE.BoxGeometry(11.6, 0.8, 0.8); 
            const beam = new THREE.Mesh(beamGeo, woodMat);
            beam.position.set(0, 8.25, 0);
            beam.castShadow = true;
            standGroup.add(postL, postR, beam);
            experimentRoot.add(standGroup);

            frameGroup = new THREE.Group();
            const pinBase = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 16), new THREE.MeshStandardMaterial({color:0xeeeeee}));
            pinBase.position.set(0, 0.75, 0);
            experimentRoot.add(pinBase);
            const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.8, 8), steelMat);
            pin.position.set(0, 1.6, 0);
            experimentRoot.add(pin);

            const fw = 2.2; 
            const fh = 2.8; 
            const th = 0.12;
            const fTop = new THREE.Mesh(new THREE.BoxGeometry(fw, th, th), alumMat);
            fTop.position.y = fh/2;
            const fBot = new THREE.Mesh(new THREE.BoxGeometry(fw, th, th), alumMat);
            fBot.position.y = -fh/2;
            const fLeft = new THREE.Mesh(new THREE.BoxGeometry(th, fh, th), alumMat);
            fLeft.position.x = -fw/2;
            const fRight = new THREE.Mesh(new THREE.BoxGeometry(th, fh, th), alumMat);
            fRight.position.x = fw/2;
            
            frameGroup.add(fTop, fBot, fLeft, fRight);
            frameGroup.position.set(0, 3.2, 0); 
            experimentRoot.add(frameGroup);

            magnetGroup = new THREE.Group();
            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 4, 16), steelMat);
            shaft.position.y = 1;
            magnetGroup.add(shaft);
            const magWidth = 7.5; 
            const magTopGeo = new THREE.BoxGeometry(magWidth, 1, 1.5);
            const magTop = new THREE.Mesh(magTopGeo, steelMat);
            magTop.position.y = 0;
            const poleOffset = 3.0; 
            const poleGeo = new THREE.BoxGeometry(1.5, 4.0, 1.5); 
            const poleN = new THREE.Mesh(poleGeo, magnetRed);
            poleN.position.set(-poleOffset, -2.5, 0); 
            const poleS = new THREE.Mesh(poleGeo, magnetBlue);
            poleS.position.set(poleOffset, -2.5, 0);
            magnetGroup.add(magTop, poleN, poleS);
            magnetGroup.position.set(0, 7.0, 0);
            experimentRoot.add(magnetGroup);

            crankHandle = new THREE.Group();
            const topShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5, 16), steelMat);
            topShaft.position.y = 0.75;
            const arm = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 0.4), steelMat);
            arm.position.set(0.8, 1.5, 0);
            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1, 16), woodMat);
            handle.position.set(1.6, 2.0, 0);
            crankHandle.add(topShaft, arm, handle);
            crankHandle.position.set(0, 8.65, 0);
            experimentRoot.add(crankHandle);
        }

        // ================= 图表逻辑 =================
        function initChart() {
            const ctx = document.getElementById('speedChart').getContext('2d');
            
            let gradientMag = ctx.createLinearGradient(0, 0, 0, 220);
            gradientMag.addColorStop(0, 'rgba(255, 68, 68, 0.6)');
            gradientMag.addColorStop(1, 'rgba(255, 68, 68, 0.0)');

            let gradientFrame = ctx.createLinearGradient(0, 0, 0, 220);
            gradientFrame.addColorStop(0, 'rgba(0, 204, 255, 0.6)');
            gradientFrame.addColorStop(1, 'rgba(0, 204, 255, 0.0)');

            speedChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '磁铁转速',
                            data: [],
                            borderColor: '#ff5555',
                            backgroundColor: gradientMag,
                            borderWidth: 3,
                            pointRadius: 0,
                            fill: true,
                            tension: 0.4 
                        },
                        {
                            label: '铝框转速',
                            data: [],
                            borderColor: '#33ddee',
                            backgroundColor: gradientFrame,
                            borderWidth: 3,
                            pointRadius: 0,
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: { display: false },
                        y: { 
                            suggestedMax: 5, 
                            ticks: { color: '#bbb', font: {size: 11} }, 
                            grid: { color: '#555', tickLength: 5 } 
                        }
                    },
                    plugins: { 
                        legend: { 
                            labels: { color: '#fff', font: {size: 14}, boxWidth: 15, padding: 10 } 
                        } 
                    }
                }
            });
        }

        function updateChart() {
            if (frameCount % 5 === 0) {
                if (chartLabels.length > MAX_CHART_POINTS) {
                    chartLabels.shift();
                    dataMagnet.shift();
                    dataFrame.shift();
                }
                chartLabels.push('');
                dataMagnet.push(magnetSpeed);
                dataFrame.push(frameSpeed);
                
                speedChart.data.labels = chartLabels;
                speedChart.data.datasets[0].data = dataMagnet;
                speedChart.data.datasets[1].data = dataFrame;
                speedChart.update();
            }
        }

        // ================= 动画循环 =================
        function animate() {
            requestAnimationFrame(animate);

            // 磁铁动力学：稍微放缓磁铁自身的启停速度，让整体视觉更柔和
            if (isRunning) {
                magnetSpeed += (TARGET_MAGNET_SPEED - magnetSpeed) * 0.03; 
            } else {
                magnetSpeed *= 0.98; // 减速变缓
                if(magnetSpeed < 0.01) magnetSpeed = 0;
            }

            // 铝框动力学
            let slipSpeed = magnetSpeed - frameSpeed;
            let magneticTorque = slipSpeed * COUPLING_FACTOR;
            let frictionTorque = frameSpeed * FRAME_FRICTION;
            let netTorque = magneticTorque - frictionTorque;
            let alpha = netTorque / FRAME_INERTIA;

            frameSpeed += alpha;
            if(frameSpeed < 0 && magnetSpeed === 0) frameSpeed = 0;

            magnetAngle += magnetSpeed * 0.05;
            frameAngle += frameSpeed * 0.05;

            magnetGroup.rotation.y = magnetAngle;
            crankHandle.rotation.y = magnetAngle;
            frameGroup.rotation.y = frameAngle;

            updateChart();
            frameCount++;

            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ================= 交互 =================
        function startSim() { isRunning = true; }
        function pauseSim() { isRunning = false; }
        function resetSim() {
            isRunning = false;
            magnetSpeed = 0; frameSpeed = 0; magnetAngle = 0; frameAngle = 0;
            magnetGroup.rotation.y = 0; crankHandle.rotation.y = 0; frameGroup.rotation.y = 0;
            chartLabels = []; dataMagnet = []; dataFrame = [];
            speedChart.data.labels = []; 
            speedChart.data.datasets[0].data = []; 
            speedChart.data.datasets[1].data = [];
            speedChart.update();
        }

        init();
    </script>
 </body>
</html>
