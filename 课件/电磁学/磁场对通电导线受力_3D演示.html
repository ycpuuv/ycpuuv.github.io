
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D演示探究影响通电导线在磁场中受力的因素</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #control-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            max-width: 320px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        #control-panel.hidden {
            transform: translateX(-110%);
        }
        #toggle-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 99;
            font-size: 14px;
            transition: all 0.3s;
        }
        #toggle-panel:hover {
            background: #1976D2;
        }
        #toggle-panel.shifted {
            left: 340px;
        }
        h2 {
            color: #1976D2;
            margin-bottom: 15px;
            font-size: 16px;
            text-align: center;
            border-bottom: 2px solid #2196F3;
            padding-bottom: 8px;
        }
        .control-group {
            margin-bottom: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .control-group h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .control-row label {
            min-width: 80px;
            font-size: 13px;
            color: #555;
        }
        .control-row input[type="range"] {
            flex: 1;
            min-width: 100px;
            margin: 0 8px;
        }
        .control-row span {
            min-width: 50px;
            font-size: 12px;
            color: #1976D2;
            font-weight: bold;
        }
        .wire-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .wire-btn {
            padding: 8px 12px;
            border: 2px solid #ccc;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .wire-btn.active {
            border-color: #4CAF50;
            background: #E8F5E9;
            color: #2E7D32;
        }
        .wire-btn:hover {
            border-color: #2196F3;
        }
        select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            background: white;
        }
        #result-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 100;
        }
        #result-panel h3 {
            color: #1976D2;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .result-value {
            font-size: 28px;
            color: #E91E63;
            font-weight: bold;
        }
        .result-unit {
            font-size: 14px;
            color: #666;
        }
        #info-panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        @media (max-width: 768px) {
            #control-panel {
                max-width: 280px;
                padding: 10px;
                font-size: 12px;
            }
            #toggle-panel.shifted {
                left: 290px;
            }
            .control-row label {
                min-width: 60px;
                font-size: 11px;
            }
            #result-panel {
                padding: 10px 15px;
            }
            .result-value {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <button id="toggle-panel" class="shifted">隐藏面板</button>
    
    <div id="control-panel">
        <h2>🧲 通电导线受力实验控制</h2>
        
        <div class="control-group">
            <h3>磁场设置</h3>
            <div class="control-row">
                <label>磁场强度 B:</label>
                <input type="range" id="magnetic-field" min="0.1" max="2" step="0.1" value="1">
                <span id="b-value">1.0 T</span>
            </div>
            <div class="control-row">
                <label>磁场方向:</label>
                <select id="field-direction">
                    <option value="up">向上 ↑</option>
                    <option value="down">向下 ↓</option>
                </select>
            </div>
        </div>
        
        <div class="control-group">
            <h3>导线选择（选择两条）</h3>
            <div class="wire-buttons">
                <button class="wire-btn" data-wire="1">导线 1</button>
                <button class="wire-btn active" data-wire="2">导线 2</button>
                <button class="wire-btn active" data-wire="3">导线 3</button>
                <button class="wire-btn" data-wire="4">导线 4</button>
            </div>
            <p style="font-size: 11px; color: #888; margin-top: 8px;">
                提示：1-4全长 | 2-3半长 | 1-2或3-4四分之一长
            </p>
        </div>
        
        <div class="control-group">
            <h3>电流设置</h3>
            <div class="control-row">
                <label>电流大小 I:</label>
                <input type="range" id="current" min="0" max="5" step="0.1" value="2">
                <span id="i-value">2.0 A</span>
            </div>
            <div class="control-row">
                <label>电流方向:</label>
                <select id="current-direction">
                    <option value="positive">正向<!--（向外）⊙--></option>
                    <option value="negative">负向<!--（向内）⊗--></option>
                </select>
            </div>
        </div>
        
        <div class="control-group">
            <h3>物理参数</h3><!--
            <div class="control-row">
                <label>导线质量:</label>
                <span>10 g/段</span>
            </div>-->
            <div class="control-row">
                <label>悬挂长度:</label>
                <span>20 cm</span>
            </div>
        </div>
        <div id="info-panel">
            鼠标拖动旋转 | 滚轮缩放 | 右键拖动平移
        </div>
    </div>
    
    <div id="result-panel">
        <h3>📐 摆动角度</h3>
        <span class="result-value" id="angle-display">0.0</span>
        <span class="result-unit">°</span>
        <div style="margin-top: 10px; font-size: 12px; color: #666;">
            <div>安培力: <span id="force-display">0.00</span> N</div>
            <div>有效长度: <span id="length-display">0.00</span> m</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // 场景初始化
        let scene, camera, renderer, controls;
        let magnets = [];
        let wireSystem;
        let currentAngle = 0;
        let targetAngle = 0;
        
        // 物理参数
        const params = {
            B: 1.0,
            I: 2.0,
            fieldDirection: 1,
            currentDirection: 1,
            activeWires: [2, 3],
            wireLength: 0.1,
            wireMass: 0.01,
            suspensionLength: 0.28,
            g: 9.8
        };
        
        // 导线位置映射
        const wirePositions = {
            1: -0.25,
            2: -0.08,
            3: 0.08,
            4: 0.25
        };

        function init() {
            const container = document.getElementById('canvas-container');
            
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            
            // 相机
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-0.9, 0, 0.8);
            
            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // 控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 0.3;
            controls.maxDistance = 3;
            
            // 灯光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 0.4);
            pointLight.position.set(-3, 5, -3);
            scene.add(pointLight);
            
            // 创建场景元素
            createTable();
            createMagnets();
            createWireSystem();
            createMagneticFieldArrows();
            
            // 事件监听
            setupEventListeners();
            
            // 开始动画
            animate();
        }

        function createTable() {
            // 桌面
            const tableGeometry = new THREE.BoxGeometry(1.2, 0.03, 0.8);
            const tableMaterial = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
            const table = new THREE.Mesh(tableGeometry, tableMaterial);
            table.position.y = -0.15;
            table.receiveShadow = true;
            scene.add(table);
            
            // 桌腿
            const legGeometry = new THREE.BoxGeometry(0.04, 0.3, 0.04);
            const legMaterial = new THREE.MeshPhongMaterial({ color: 0x654321 });
            const legPositions = [
                [-0.55, -0.3, 0.35],
                [0.55, -0.3, 0.35],
                [-0.55, -0.3, -0.35],
                [0.55, -0.3, -0.35]
            ];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(...pos);
                scene.add(leg);
            });
        }

        function createMagnets() {
            // 清除旧磁铁
            magnets.forEach(m => scene.remove(m));
            magnets = [];
            
            // 创建三个蹄形磁铁
            for (let i = 0; i < 3; i++) {
                const magnetGroup = new THREE.Group();
                
                // 磁铁底座
                const baseGeometry = new THREE.BoxGeometry(0.22, 0.03, 0.15);
                const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x444444 });
                const base = new THREE.Mesh(baseGeometry, baseMaterial);
                base.position.y = -0.05;
                base.position.x = 0.08;
                magnetGroup.add(base);
                
                // N极（红色）
                const poleGeometry = new THREE.BoxGeometry(0.03, 0.38, 0.15);
                const nPoleMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
                const nPole = new THREE.Mesh(poleGeometry, nPoleMaterial);
                nPole.position.set(-0.017, 0.15, 0);
                magnetGroup.add(nPole);
                
                // S极（蓝色）
                const sPoleMaterial = new THREE.MeshPhongMaterial({ color: 0x0000ff });
                const sPole = new THREE.Mesh(poleGeometry, sPoleMaterial);
                sPole.position.set(0.17, 0.15, 0);
                magnetGroup.add(sPole);
                
                // N标签
                const nLabel = createTextSprite('N', 0xff0000);
                nLabel.position.set(-0.017, 0.38, 0);
                nLabel.scale.set(0.05, 0.05, 1);
                magnetGroup.add(nLabel);
                
                // S标签
                const sLabel = createTextSprite('S', 0x0000ff);
                sLabel.position.set(0.17, 0.38, 0);
                sLabel.scale.set(0.05, 0.05, 1);
                magnetGroup.add(sLabel);
                
                magnetGroup.position.set(0.1, -0.1, (i - 1) * 0.16);
                scene.add(magnetGroup);
                magnets.push(magnetGroup);
                magnetGroup.rotation.z=Math.PI/2;
            }

        }

        function createTextSprite(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 32, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            return new THREE.Sprite(material);
        }

        function createWireSystem() {
            if (wireSystem) scene.remove(wireSystem);
            
            wireSystem = new THREE.Group();
            
            // 支架
            const supportGeometry = new THREE.BoxGeometry(0.02, 0.5, 0.02);
            const supportMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
            
            const leftSupport = new THREE.Mesh(supportGeometry, supportMaterial);
            leftSupport.position.set(-0.3, 0.1, 0);
            wireSystem.add(leftSupport);
            
            const rightSupport = new THREE.Mesh(supportGeometry, supportMaterial);
            rightSupport.position.set(0.3, 0.1, 0);
            wireSystem.add(rightSupport);
            
            // 横梁
            const beamGeometry = new THREE.BoxGeometry(0.64, 0.02, 0.02);
            const beam = new THREE.Mesh(beamGeometry, supportMaterial);
            beam.position.set(0, 0.2, 0);
            wireSystem.add(beam);
            
            // 创建悬挂导线系统
            createSwingingWire();
            
            scene.add(wireSystem);
            wireSystem.rotation.y=Math.PI/2;
        }

        function createSwingingWire() {
            // 移除旧的摆动部件
            const oldPendulum = wireSystem.getObjectByName('pendulum');
            if (oldPendulum) wireSystem.remove(oldPendulum);
            
            const pendulum = new THREE.Group();
            pendulum.name = 'pendulum';
            
            // 计算有效导线长度
            const wires = params.activeWires.sort((a, b) => a - b);
            const startPos = wirePositions[wires[0]];
            const endPos = wirePositions[wires[1]];
            const effectiveLength = Math.abs(endPos - startPos);
            params.wireLength = effectiveLength;
            
            // 悬挂线（左）
            const stringGeometry = new THREE.CylinderGeometry(0.002, 0.002, params.suspensionLength);
            const stringMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
            
            const leftString = new THREE.Mesh(stringGeometry, stringMaterial);
            leftString.position.set(startPos, -params.suspensionLength / 2, 0);
            pendulum.add(leftString);
            
            // 悬挂线（右）
            const rightString = new THREE.Mesh(stringGeometry, stringMaterial);
            rightString.position.set(endPos, -params.suspensionLength / 2, 0);
            pendulum.add(rightString);
            
            // 导线（水平部分）
            const wireGeometry = new THREE.CylinderGeometry(0.004, 0.004, effectiveLength);
            const wireMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xB87333,
                metalness: 0.8,
                roughness: 0.2
            });
            const wire = new THREE.Mesh(wireGeometry, wireMaterial);
            wire.rotation.z = Math.PI / 2;
            wire.position.set((startPos + endPos) / 2, -params.suspensionLength, 0);
            wire.name = 'activeWire';
            pendulum.add(wire);
            
            // 导线端点标记
            for (let i = 1; i <= 4; i++) {
                const markerGeometry = new THREE.SphereGeometry(0.008);
                const isActive = params.activeWires.includes(i);
                const markerMaterial = new THREE.MeshPhongMaterial({ 
                    color: isActive ? 0x00ff00 : 0x888888 
                });
                const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                marker.position.set(wirePositions[i], 0, 0);
                pendulum.add(marker);
                
                // 标签
                const label = createTextSprite(i.toString(), isActive ? 0x00aa00 : 0x666666);
                label.position.set(wirePositions[i], 0.03, 0);
                label.scale.set(0.03, 0.03, 1);
                pendulum.add(label);
            }
            
            // 电流方向指示
            createCurrentArrow(pendulum, startPos, endPos);
            
            pendulum.position.y = 0.2;
            wireSystem.add(pendulum);
        }

        function createCurrentArrow(parent, startPos, endPos) {
            const arrowGroup = new THREE.Group();
            arrowGroup.name = 'currentArrow';
            
            const midX = (startPos + endPos) / 2;
            const direction = params.currentDirection;
            
            // 电流方向箭头
            const arrowLength = 0.05;
            const arrowGeometry = new THREE.ConeGeometry(0.008, 0.02, 8);
            const arrowMaterial = new THREE.MeshPhongMaterial({ color: 0xffff00 });
            const arrow = new THREE.Mesh(arrowGeometry, arrowMaterial);
            
            if (direction > 0) {
                arrow.rotation.x = -Math.PI / 2;
                arrow.position.set(midX, -params.suspensionLength, 0.03);
            } else {
                arrow.rotation.x = Math.PI / 2;
                arrow.position.set(midX, -params.suspensionLength, -0.03);
            }
            
            arrowGroup.add(arrow);
            
            // 电流符号
            const symbol = createTextSprite(direction > 0 ? '⊙' : '⊗', 0xffaa00);
            symbol.position.set(midX + 0.05, -params.suspensionLength, 0);
            symbol.scale.set(0.04, 0.04, 1);
            //arrowGroup.add(symbol);
            
            //parent.add(arrowGroup);
        }

        let fieldArrows = [];
        
        function createMagneticFieldArrows() {
            // 清除旧箭头
            fieldArrows.forEach(arrow => scene.remove(arrow));
            fieldArrows = [];
            
            const direction = params.fieldDirection;
            const arrowColor = direction > 0 ? 0x00aaff : 0xff6600;
            
            // 在磁极之间创建磁场箭头
            for (let z = -0.15; z <= 0.2; z += 0.1) {
                const arrowGroup = new THREE.Group();
                
                // 箭头杆
                const shaftGeometry = new THREE.CylinderGeometry(0.003, 0.003, 0.06);
                const shaftMaterial = new THREE.MeshPhongMaterial({ color: arrowColor });
                const shaft = new THREE.Mesh(shaftGeometry, shaftMaterial);
                arrowGroup.add(shaft);
                
                // 箭头头
                const headGeometry = new THREE.ConeGeometry(0.008, 0.02, 8);
                const head = new THREE.Mesh(headGeometry, shaftMaterial);
                head.position.y = direction > 0 ? 0.04 : -0.04;
                head.rotation.z = direction > 0 ? 0 : Math.PI;
                arrowGroup.add(head);
                
                arrowGroup.position.set(0, 0, z);
                scene.add(arrowGroup);
                fieldArrows.push(arrowGroup);
            }
            
            // B标签
            const bLabel = createTextSprite('B', arrowColor);
            bLabel.position.set(0.08, 0, 0);
            bLabel.scale.set(0.05, 0.05, 1);
            scene.add(bLabel);
            fieldArrows.push(bLabel);
        }

        function calculateAngle() {
            // F = BIL
            const F = params.B * params.I * params.wireLength;
            
            // 计算有效质量（根据选择的导线段数）
            const wires = params.activeWires.sort((a, b) => a - b);
            const segments = wires[1] - wires[0];
            //const mass = params.wireMass * segments;
            const mass = params.wireMass * 3;//无论选择几根导线质量不变
            
            // 重力
            const G = mass * params.g;
            
            // 平衡时：tan(θ) = F / G
            // 考虑方向
            const effectiveF = F * params.fieldDirection * params.currentDirection;
            
            if (G === 0 || params.I === 0) {
                targetAngle = 0;
            } else {
                targetAngle = Math.atan(effectiveF / G) * (180 / Math.PI)*0.5;
            }
            
            // 限制最大角度
            targetAngle = Math.max(-85, Math.min(85, targetAngle));
            
            // 更新显示
            document.getElementById('force-display').textContent = F.toFixed(4);
            document.getElementById('length-display').textContent = params.wireLength.toFixed(2);
        }

        function updateWirePosition() {
            const pendulum = wireSystem.getObjectByName('pendulum');
            if (!pendulum) return;
            
            // 平滑过渡到目标角度
            const diff = targetAngle - currentAngle;
            currentAngle += diff * 0.05;
            
            // 应用旋转（绕X轴，因为导线沿X方向）
            pendulum.rotation.x = currentAngle * (Math.PI / 180);
            
            // 更新显示
            document.getElementById('angle-display').textContent = Math.abs(currentAngle).toFixed(1);
        }

        function setupEventListeners() {
            // 磁场强度
            document.getElementById('magnetic-field').addEventListener('input', function() {
                params.B = parseFloat(this.value);
                document.getElementById('b-value').textContent = params.B.toFixed(1) + ' T';
                calculateAngle();
            });
            
            // 磁场方向
            document.getElementById('field-direction').addEventListener('change', function() {
                params.fieldDirection = this.value === 'up' ? 1 : -1;
                createMagneticFieldArrows();
                calculateAngle();
            });
            
            // 电流大小
            document.getElementById('current').addEventListener('input', function() {
                params.I = parseFloat(this.value);
                document.getElementById('i-value').textContent = params.I.toFixed(1) + ' A';
                calculateAngle();
            });
            
            // 电流方向
            document.getElementById('current-direction').addEventListener('change', function() {
                params.currentDirection = this.value === 'positive' ? 1 : -1;
                createSwingingWire();
                calculateAngle();
            });
            
            // 导线选择
            document.querySelectorAll('.wire-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const wire = parseInt(this.dataset.wire);
                    
                    if (this.classList.contains('active')) {
                        if (params.activeWires.length > 2) {
                            this.classList.remove('active');
                            params.activeWires = params.activeWires.filter(w => w !== wire);
                        }
                    } else {
                        if (params.activeWires.length < 2) {
                            this.classList.add('active');
                            params.activeWires.push(wire);
                        } else {
                            // 替换第一个选中的
                            const firstActive = document.querySelector('.wire-btn.active');
                            firstActive.classList.remove('active');
                            params.activeWires = params.activeWires.filter(w => w !== parseInt(firstActive.dataset.wire));
                            this.classList.add('active');
                            params.activeWires.push(wire);
                        }
                    }
                    
                    if (params.activeWires.length === 2) {
                        createSwingingWire();
                        calculateAngle();
                    }
                });
            });
            
            // 控制面板显示/隐藏
            document.getElementById('toggle-panel').addEventListener('click', function() {
                const panel = document.getElementById('control-panel');
                panel.classList.toggle('hidden');
                this.classList.toggle('shifted');
                this.textContent = panel.classList.contains('hidden') ? '显示面板' : '隐藏面板';
            });
            
            // 窗口大小调整
            window.addEventListener('resize', function() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            updateWirePosition();
            controls.update();
            renderer.render(scene, camera);
        }

        // 初始化
        init();
        calculateAngle();
    </script>
</body>
</html>
