<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/looogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>共点力平衡 · 仿真实验 - PhySenLab</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary-color: #4A90E2;
            --primary-light: #E8F4FD;
            --primary-dark: #357ABD;
            --secondary-color: #6BB6FF;
            --bg-color: #F8FBFF;
            --card-bg: #FFFFFF;
            --text-primary: #2C3E50;
            --text-secondary: #5A6C7D;
            --text-light: #8B9DC3;
            --border-color: #E1EEF7;
            --shadow: 0 2px 12px rgba(74, 144, 226, 0.1);
            --shadow-hover: 0 8px 24px rgba(74, 144, 226, 0.2);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #E8F4FD 0%, #F8FBFF 50%, #E1EEF7 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .simulation-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* 画布区域 - 800x600 */
        #canvas-wrapper {
            position: relative;
            width: 800px;
            height: 600px;
            margin-bottom: 15px;
            box-shadow: 0 8px 24px rgba(74, 144, 226, 0.2);
            border-radius: 16px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(2px);
            border: 1px solid #E1EEF7;
        }
        
        #forceCanvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            background: white;
            cursor: grab;
        }
        
        #forceCanvas:active {
            cursor: grabbing;
        }
        
        /* 返回按钮 - 左下角 */
        .back-btn {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: white;
            color: #4A90E2;
            padding: 12px 28px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid #4A90E2;
            box-shadow: 0 2px 12px rgba(74, 144, 226, 0.1);
            transition: all 0.3s ease;
            z-index: 50;
        }
        
        .back-btn:hover {
            background: #4A90E2;
            color: white;
            transform: translateY(-2px);
        }
        
        /* 信息面板 - 左上角 */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.15);
            z-index: 20;
            max-width: 280px;
        }
        
        .info-panel h1 {
            font-size: 1.1rem;
            color: #2C3E50;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .formula-box {
            background: linear-gradient(135deg, #E8F4FD 0%, #F8FBFF 100%);
            padding: 6px 10px;
            border-radius: 8px;
            border-left: 4px solid #4A90E2;
            margin-bottom: 6px;
        }
        
        .formula {
            font-size: 1rem;
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        
        .info-text {
            font-size: 0.8rem;
            color: #5A6C7D;
            line-height: 1.5;
        }
        
        /* 右侧控制面板 */
        .controls-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.15);
            width: 300px;
            z-index: 20;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        
        .controls-panel h3 {
            font-size: 1rem;
            color: #2C3E50;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #E1EEF7;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .force-card {
            background: #F8FBFF;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #E1EEF7;
            position: relative;
        }
        
        .force-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .force-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }
        
        .delete-btn {
            background: #ffebee;
            color: #e74c3c;
            border: none;
            border-radius: 14px;
            padding: 2px 10px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .delete-btn:hover {
            background: #e74c3c;
            color: white;
        }
        
        .slider-item {
            margin-bottom: 10px;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 4px;
        }
        
        .value-badge {
            background: linear-gradient(135deg, #4A90E2 0%, #6BB6FF 100%);
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        input[type=range] {
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: #E1EEF7;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4A90E2 0%, #6BB6FF 100%);
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(74, 144, 226, 0.4);
            cursor: pointer;
        }
        
        .add-btn {
            width: 100%;
            padding: 8px;
            background: white;
            border: 2px dashed #4A90E2;
            border-radius: 30px;
            color: #4A90E2;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        
        .add-btn:hover {
            background: #E8F4FD;
            border-style: solid;
        }
        
        .result-box {
            background: linear-gradient(135deg, #E8F4FD 0%, #F8FBFF 100%);
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid #4A90E2;
            margin: 10px 0;
        }
        
        .result-box h4 {
            font-size: 0.8rem;
            color: #5A6C7D;
            margin-bottom: 5px;
        }
        
        .result-value-large {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4A90E2;
            font-family: monospace;
        }
        
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 0.8rem;
        }
        
        .balance-badge {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 6px;
        }
        
        /* 图例 - 左侧中间 */
        .legend-panel {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.15);
            z-index: 20;
            font-size: 0.8rem;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            color: #5A6C7D;
        }
        
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-right: 6px;
        }
        
        /* 底部动画控制栏 */
        .bottom-animation-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.2);
            display: flex;
            gap: 15px;
            z-index: 30;
        }
        
        .anim-btn {
            background: transparent;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: #2C3E50;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .anim-btn:hover {
            background: #4A90E2;
            color: white;
        }
        
        .anim-btn.success { color: #27ae60; }
        .anim-btn.warning { color: #e67e22; }
        .anim-btn.danger { color: #e74c3c; }
        
        .anim-btn.success:hover { background: #27ae60; color: white; }
        .anim-btn.warning:hover { background: #e67e22; color: white; }
        .anim-btn.danger:hover { background: #e74c3c; color: white; }
        
        .anim-info-mini {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
            z-index: 25;
            display: none;
        }
        
        .anim-info-mini.active {
            display: block;
        }
        
        .zoom-controls {
            position: absolute;
            bottom: 90px;
            right: 20px;
            display: flex;
            gap: 6px;
            z-index: 30;
        }
        
        .zoom-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #E1EEF7;
            background: white;
            color: #4A90E2;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        
        .zoom-btn:hover {
            background: #4A90E2;
            color: white;
            border-color: #4A90E2;
        }
        
        .hint-text {
            position: absolute;
            bottom: 90px;
            left: 20px;
            color: #8B9DC3;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 25;
        }

        @media (max-width: 1200px) {
            #canvas-wrapper { width: 600px; height: 450px; }
            .controls-panel { width: 260px; right: 10px; }
            .info-panel { left: 10px; max-width: 220px; }
        }
        @media (max-width: 900px) {
            .controls-panel { display: none; }
            .legend-panel { display: none; }
            #canvas-wrapper { width: 90vw; height: 60vw; }
        }
    </style>
</head>
<body>

    <div class="simulation-container">
        <div id="canvas-wrapper">
            <canvas id="forceCanvas" width="800" height="600"></canvas>
        </div>
        
        <!-- 左上信息卡片 -->
        <div class="info-panel">
            <h1><span class="icon">⚖️</span>共点力平衡 · 逐步合成</h1>
            <div class="formula-box">
                <div class="formula">F₁ + F₂ + ... + Fₙ = 0</div>
            </div>
            <p class="info-text">
                每个平行四边形表示相邻两个力的合成，中间合力为灰色虚线，最终合力为紫色。
            </p>
        </div>
        
        <!-- 返回实验列表按钮已移至左下角，样式保持，位置 left:30px bottom:30px -->
        
        
        <div class="legend-panel">
            <div class="legend-item"><div class="legend-color" style="background:#E74C3C;"></div>分力 (彩色)</div>
            <div class="legend-item"><div class="legend-color" style="background:#9B59B6;"></div>最终合力</div>
            <div class="legend-item"><div class="legend-color" style="background:#B0C4DE;"></div>中间合力</div>
            <div class="legend-item"><div class="legend-color" style="background:#A9A9A9;"></div>平行四边形辅助线</div>
        </div>
        
        <div class="controls-panel" id="controlsPanel">
            <h3>🔧 力的调节</h3>
            <button class="add-btn" id="addForceBtn">+ 添加力</button>
            <div id="forcesContainer"></div>
            <div class="result-box">
                <h4>最终合力 F<sub>合</sub></h4>
                <div class="result-value-large" id="resultantValue">0.0 N</div>
                <div class="result-row">
                    <span>方向:</span>
                    <span id="resultantAngle" style="font-weight: 600; color: #4A90E2;">0.0°</span>
                </div>
                <div id="balanceIndicator" class="balance-badge" style="display: none;">✓ 平衡</div>
            </div>
        </div>
        
        <div class="zoom-controls">
            <button class="zoom-btn" id="zoomOut">−</button>
            <button class="zoom-btn" id="zoomReset">⟲</button>
            <button class="zoom-btn" id="zoomIn">+</button>
        </div>
        
        <div class="bottom-animation-bar">
            <button class="anim-btn success" id="playBtn">▶ 扫描F₁</button>
            <button class="anim-btn warning" id="pauseBtn">⏸ 暂停</button>
            <button class="anim-btn" id="continueBtn">⏵ 继续</button>
            <button class="anim-btn danger" id="stopBtn">⏹ 停止</button>
        </div>
        
        <div class="anim-info-mini" id="animInfoMini">
            F₁角度: <span id="miniAngle">0°</span> 合力: <span id="miniResultant">0.0N</span>
        </div>
        
        <div class="hint-text">🖱️ 拖拽平移 · 滚轮缩放</div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('forceCanvas');
            const ctx = canvas.getContext('2d');
            
            // 状态变量
            let forces = []; // 存储 {mag, ang, color}
            let nextColorIndex = 0;
            const colorPalette = ['#E74C3C', '#3498DB', '#27ae60', '#F39C12', '#9B59B6', '#1ABC9C', '#E67E22', '#2C3E50'];
            
            // 视图变换
            let scale = 1;
            let offsetX = 0, offsetY = 0;
            let isDragging = false;
            let dragStartX = 0, dragStartY = 0;
            
            // 动画变量 (扫描第一个力的角度)
            let animationId = null;
            let isAnimating = false;
            let isPaused = false;
            let animDirection = 1;
            
            const BALANCE_THRESHOLD = 1.0; // N
            
            // DOM 元素
            const forcesContainer = document.getElementById('forcesContainer');
            const addForceBtn = document.getElementById('addForceBtn');
            const resultantValue = document.getElementById('resultantValue');
            const resultantAngle = document.getElementById('resultantAngle');
            const balanceIndicator = document.getElementById('balanceIndicator');
            
            const animInfoMini = document.getElementById('animInfoMini');
            const miniAngle = document.getElementById('miniAngle');
            const miniResultant = document.getElementById('miniResultant');
            
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const continueBtn = document.getElementById('continueBtn');
            const stopBtn = document.getElementById('stopBtn');
            const zoomIn = document.getElementById('zoomIn');
            const zoomOut = document.getElementById('zoomOut');
            const zoomReset = document.getElementById('zoomReset');
            
            // ===== 初始化：三个力 =====
            function initForces() {
                forces = [
                    { mag: 50, ang: 0, color: colorPalette[0] },
                    { mag: 50, ang: 120, color: colorPalette[1] },
                    { mag: 50, ang: 240, color: colorPalette[2] }
                ];
                nextColorIndex = 3;
                renderForceCards();
                updateDisplay();
            }
            
            // ===== 渲染力卡片 =====
            function renderForceCards() {
                forcesContainer.innerHTML = '';
                forces.forEach((force, index) => {
                    const card = document.createElement('div');
                    card.className = 'force-card';
                    card.innerHTML = `
                        <div class="force-header">
                            <div class="force-title">
                                <span class="color-dot" style="background:${force.color}"></span>
                                力 F<sub>${index+1}</sub>
                            </div>
                            ${forces.length > 2 ? `<button class="delete-btn" data-index="${index}">删除</button>` : ''}
                        </div>
                        <div class="slider-item">
                            <div class="slider-label">
                                <span>📏 大小 (N)</span>
                                <span class="value-badge" id="magVal-${index}">${force.mag}</span>
                            </div>
                            <input type="range" class="mag-slider" data-index="${index}" min="0" max="150" value="${force.mag}" step="1">
                        </div>
                        <div class="slider-item">
                            <div class="slider-label">
                                <span>🔄 角度 (°)</span>
                                <span class="value-badge" id="angVal-${index}">${force.ang}</span>
                            </div>
                            <input type="range" class="ang-slider" data-index="${index}" min="0" max="360" value="${force.ang}" step="1">
                        </div>
                    `;
                    forcesContainer.appendChild(card);
                });
                
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        if (forces.length > 2) {
                            forces.splice(index, 1);
                            renderForceCards();
                            updateDisplay();
                        }
                    });
                });
                
                document.querySelectorAll('.mag-slider').forEach(slider => {
                    slider.addEventListener('input', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        forces[index].mag = parseInt(e.target.value);
                        document.getElementById(`magVal-${index}`).textContent = forces[index].mag;
                        updateDisplay();
                    });
                });
                
                document.querySelectorAll('.ang-slider').forEach(slider => {
                    slider.addEventListener('input', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        forces[index].ang = parseInt(e.target.value);
                        document.getElementById(`angVal-${index}`).textContent = forces[index].ang;
                        updateDisplay();
                    });
                });
            }
            
            // ===== 添加力 =====
            addForceBtn.addEventListener('click', () => {
                if (forces.length < 8) {
                    forces.push({
                        mag: 50,
                        ang: 0,
                        color: colorPalette[nextColorIndex % colorPalette.length]
                    });
                    nextColorIndex++;
                    renderForceCards();
                    updateDisplay();
                } else {
                    alert('最多支持8个力');
                }
            });
            
            // ===== 计算合力 =====
            function calculateResultant() {
                let rx = 0, ry = 0;
                forces.forEach(f => {
                    const rad = f.ang * Math.PI / 180;
                    rx += f.mag * Math.cos(rad);
                    ry += f.mag * Math.sin(rad);
                });
                const magnitude = Math.sqrt(rx * rx + ry * ry);
                let direction = Math.atan2(ry, rx) * 180 / Math.PI;
                if (direction < 0) direction += 360;
                return { magnitude, direction, rx, ry };
            }
            
            // ===== 更新显示 =====
            function updateDisplay() {
                const result = calculateResultant();
                resultantValue.textContent = result.magnitude.toFixed(1) + ' N';
                resultantAngle.textContent = result.direction.toFixed(1) + '°';
                
                if (result.magnitude < BALANCE_THRESHOLD) {
                    balanceIndicator.style.display = 'inline-block';
                } else {
                    balanceIndicator.style.display = 'none';
                }
                
                if (isAnimating && forces.length > 0) {
                    miniAngle.textContent = forces[0]?.ang.toFixed(0) + '°';
                    miniResultant.textContent = result.magnitude.toFixed(1) + 'N';
                }
                
                draw();
            }
            
            // ===== 绘制 =====
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                ctx.save();
                ctx.translate(canvas.width/2 + offsetX, canvas.height/2 + offsetY);
                ctx.scale(scale, scale);
                
                const centerX = 0, centerY = 0;
                const pixelScale = 2; // 1N = 2px
                
                // 绘制网格
                drawGrid();
                
                // 绘制坐标轴（先画轴，再画箭头，让箭头显示在轴上方）
                drawAxes();
                
                // 计算所有力的终点坐标
                const points = forces.map(f => {
                    const rad = f.ang * Math.PI / 180;
                    return {
                        x: f.mag * pixelScale * Math.cos(rad),
                        y: -f.mag * pixelScale * Math.sin(rad) // Y轴向下为正，取反
                    };
                });
                
                // ===== 逐步平行四边形合成 (从第一个力开始依次合成) =====
                if (forces.length >= 2) {
                    ctx.save();
                    ctx.strokeStyle = '#A9A9A9'; // 灰色平行四边形边框
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([4, 3]);
                    
                    // 当前累积向量 (从原点出发)
                    let currX = points[0].x;
                    let currY = points[0].y;
                    
                    for (let i = 1; i < forces.length; i++) {
                        const next = points[i];
                        // 平行四边形的第四个顶点
                        const p4x = currX + next.x;
                        const p4y = currY + next.y;
                        
                        // 绘制平行四边形 (原点, 当前向量, 下一个向量)
                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY);
                        ctx.lineTo(currX, currY);
                        ctx.lineTo(p4x, p4y);
                        ctx.lineTo(next.x, next.y);
                        ctx.closePath();
                        ctx.stroke();
                        
                        // 绘制中间合力 (从原点到p4) - 浅蓝色虚线
                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY);
                        ctx.lineTo(p4x, p4y);
                        ctx.strokeStyle = '#B0C4DE'; // 浅钢蓝
                        ctx.lineWidth = 2.5;
                        ctx.setLineDash([6, 4]);
                        ctx.stroke();
                        
                        // 标注中间合力 (非最终)
                        if (i < forces.length - 1) {
                            ctx.fillStyle = '#696969';
                            ctx.font = '10px Arial';
                            ctx.fillText(`F${i+1}合`, p4x/2 - 10, p4y/2 - 10);
                        }
                        
                        // 更新当前向量为新的合力
                        currX = p4x;
                        currY = p4y;
                    }
                    ctx.restore();
                }
                
                // 绘制各个力 (彩色箭头，现在显示在坐标轴上方)
                forces.forEach((f, i) => {
                    const p = points[i];
                    drawArrow(centerX, centerY, p.x, p.y, f.color, `F${i+1}`, f.mag);
                });
                
                // 绘制最终合力 (紫色箭头，显示在坐标轴上方)
                const result = calculateResultant();
                const rx = result.rx * pixelScale;
                const ry = -result.ry * pixelScale;
                if (result.magnitude > 0.1) {
                    drawArrow(centerX, centerY, rx, ry, '#9B59B6', 'F合', result.magnitude.toFixed(1));
                }
                
                // 绘制作用点
                ctx.beginPath();
                ctx.arc(centerX, centerY, 5, 0, 2*Math.PI);
                ctx.fillStyle = '#2C3E50';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
            }
            
            // 绘制网格
            function drawGrid() {
                ctx.strokeStyle = '#E1EEF7';
                ctx.lineWidth = 1;
                const gridSize = 50;
                const numGrids = 12;
                
                for (let i = -numGrids; i <= numGrids; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * gridSize, -numGrids * gridSize);
                    ctx.lineTo(i * gridSize, numGrids * gridSize);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(-numGrids * gridSize, i * gridSize);
                    ctx.lineTo(numGrids * gridSize, i * gridSize);
                    ctx.stroke();
                }
            }
            
            // 绘制坐标轴
            function drawAxes() {
                ctx.strokeStyle = '#4A90E2';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.moveTo(-400, 0);
                ctx.lineTo(400, 0);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, 300);
                ctx.lineTo(0, -300);
                ctx.stroke();
                
                drawArrowHead(400, 0, 0, '#4A90E2');
                drawArrowHead(0, -300, -Math.PI/2, '#4A90E2');
                
                ctx.fillStyle = '#4A90E2';
                ctx.font = 'bold 12px Arial';
                ctx.fillText('X', 380, 20);
                ctx.fillText('Y', -20, -280);
            }
            
            function drawArrow(fromX, fromY, toX, toY, color, label, value) {
                const headLength = 12;
                const angle = Math.atan2(toY - fromY, toX - fromX);
                
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.moveTo(fromX, fromY);
                ctx.lineTo(toX, toY);
                ctx.stroke();
                
                drawArrowHead(toX, toY, angle, color);
                
                ctx.fillStyle = color;
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                const midX = (fromX + toX) / 2;
                const midY = (fromY + toY) / 2;
                ctx.fillText(label, midX - 12, midY - 8);
                ctx.font = '10px Arial';
                ctx.fillText(value + 'N', midX - 12, midY + 8);
            }
            
            function drawArrowHead(x, y, angle, color) {
                const headLength = 12;
                ctx.beginPath();
                ctx.fillStyle = color;
                ctx.moveTo(x, y);
                ctx.lineTo(
                    x - headLength * Math.cos(angle - Math.PI/6),
                    y - headLength * Math.sin(angle - Math.PI/6)
                );
                ctx.lineTo(
                    x - headLength * Math.cos(angle + Math.PI/6),
                    y - headLength * Math.sin(angle + Math.PI/6)
                );
                ctx.closePath();
                ctx.fill();
            }
            
            // ===== 动画 =====
            function startAnimation() {
                if (forces.length === 0) return;
                if (isAnimating) return;
                isAnimating = true;
                isPaused = false;
                animInfoMini.classList.add('active');
                animDirection = 1;
                animateStep();
            }
            
            function animateStep() {
                if (!isAnimating || isPaused) return;
                if (forces.length > 0) {
                    forces[0].ang += animDirection;
                    if (forces[0].ang >= 360) {
                        forces[0].ang = 360;
                        animDirection = -1;
                    } else if (forces[0].ang <= 0) {
                        forces[0].ang = 0;
                        animDirection = 1;
                    }
                    const angSlider = document.querySelector(`.ang-slider[data-index="0"]`);
                    if (angSlider) {
                        angSlider.value = forces[0].ang;
                        document.getElementById(`angVal-0`).textContent = forces[0].ang;
                    }
                }
                updateDisplay();
                
                animationId = requestAnimationFrame(() => {
                    setTimeout(animateStep, 30);
                });
            }
            
            function pauseAnimation() { isPaused = true; }
            function continueAnimation() { if (isAnimating && isPaused) { isPaused = false; animateStep(); } }
            function stopAnimation() {
                isAnimating = false;
                isPaused = false;
                if (animationId) cancelAnimationFrame(animationId);
                animInfoMini.classList.remove('active');
            }
            
            playBtn.addEventListener('click', startAnimation);
            pauseBtn.addEventListener('click', pauseAnimation);
            continueBtn.addEventListener('click', continueAnimation);
            stopBtn.addEventListener('click', stopAnimation);
            
            // ===== 视图控制 =====
            zoomIn.addEventListener('click', () => { scale = Math.min(scale * 1.2, 3); draw(); });
            zoomOut.addEventListener('click', () => { scale = Math.max(scale / 1.2, 0.3); draw(); });
            zoomReset.addEventListener('click', () => { scale = 1; offsetX = 0; offsetY = 0; draw(); });
            
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                offsetX += dx;
                offsetY += dy;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                draw();
            });
            
            document.addEventListener('mouseup', () => { isDragging = false; });
            
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY > 0) scale = Math.max(scale / 1.1, 0.3);
                else scale = Math.min(scale * 1.1, 3);
                draw();
            });
            
            // 初始化
            initForces();
        })();
    </script>
    </body>
</html>
