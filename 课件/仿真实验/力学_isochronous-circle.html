<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/looogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>等时圆模型演示 · 高中物理</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --primary-light: #E8F4FD;
            --primary-dark: #357ABD;
            --secondary-color: #6BB6FF;
            --text-primary: #2C3E50;
            --text-secondary: #5A6C7D;
            --text-light: #8B9DC3;
            --border-color: #E1EEF7;
            --shadow: 0 4px 20px rgba(74, 144, 226, 0.12);
            --shadow-hover: 0 8px 24px rgba(74, 144, 226, 0.18);
            --radius: 14px;
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #E8F4FD 0%, #F8FBFF 50%, #E1EEF7 100%);
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
        }
        .simulation-container { position: relative; width: 100vw; height: 100vh; }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; z-index: 1;
        }
        #mainCanvas {
            background: #fff; border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08); image-rendering: crisp-edges;
        }
        .panel {
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 16px 20px; z-index: 10; position: absolute;
            transition: var(--transition);
        }
        .panel:hover { box-shadow: var(--shadow-hover); }

        .info-panel { top: 16px; left: 16px; max-width: 260px; }
        .info-panel h1 { font-size: 1.1rem; color: var(--text-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .formula-box {
            background: linear-gradient(135deg, var(--primary-light), #F8FBFF);
            padding: 8px 12px; border-radius: 8px; border-left: 4px solid var(--primary-color);
            margin-bottom: 8px; font-size: .85rem; font-family: 'Times New Roman', serif; font-style: italic; color: var(--text-primary);
        }
        .info-text { font-size: .78rem; color: var(--text-secondary); line-height: 1.55; }

        .physics-panel { bottom: 16px; left: 16px; width: 240px; }
        .physics-panel h3 { font-size: .92rem; color: var(--text-primary); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--border-color); }
        .param-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: .8rem; color: var(--text-secondary); }
        .param-value { font-family: Consolas, monospace; font-weight: 600; color: var(--primary-color); }

        .controls-panel { top: 16px; right: 16px; width: 300px; max-height: calc(100vh - 32px); overflow-y: auto; }
        .controls-panel h3 { font-size: 1rem; color: var(--text-primary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border-color); }
        .section-label { font-size: .72rem; color: var(--text-light); margin: 12px 0 4px; font-weight: 600; letter-spacing: .5px; }
        .slider-group {
            margin-bottom: 12px; padding: 10px; background: #F8FBFF; border-radius: 10px; border: 1px solid var(--border-color);
        }
        .slider-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: .85rem; }
        .slider-label .lt { font-weight: 600; color: var(--text-primary); }
        .vbadge {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: #fff;
            padding: 2px 8px; border-radius: 12px; font-family: monospace; font-size: .78rem; font-weight: 600;
        }
        input[type=range] {
            width: 100%; height: 6px; border-radius: 3px; background: #E1EEF7; outline: none;
            -webkit-appearance: none; cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: 2px solid #fff; box-shadow: 0 2px 8px rgba(74, 144, 226, 0.4); cursor: pointer;
        }
        .btn-row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
        .btn {
            padding: 9px 16px; border: none; border-radius: 22px; font-weight: 600; font-size: .82rem;
            cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff; box-shadow: 0 3px 10px rgba(74, 144, 226, 0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(74, 144, 226, 0.4); }
        .btn-ghost { background: #F0F4F8; color: var(--text-secondary); border: 1px solid var(--border-color); }
        .btn-ghost:hover { background: #E1EEF7; }

        .back-btn {
            position: absolute; bottom: 16px; right: 16px; background: #fff; color: var(--primary-color);
            padding: 9px 18px; border-radius: 22px; text-decoration: none; font-weight: 600;
            border: 2px solid var(--primary-color); box-shadow: 0 2px 10px rgba(74, 144, 226, 0.15);
            transition: all .3s; z-index: 10; font-size: .82rem;
        }
        .back-btn:hover { background: var(--primary-color); color: #fff; }

        @media (max-width: 900px) {
            .info-panel { max-width: 210px; padding: 12px 14px; }
            .physics-panel { width: 190px; padding: 12px 14px; }
            .controls-panel { width: 250px; padding: 12px 14px; }
        }
    </style>
</head>
<body>
<div class="simulation-container">
    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- 左上信息面板 -->
    <div class="info-panel panel">
        <h1>⏳ 等时圆模型</h1>
        <div class="formula-box">t = 2√(R/g)</div>
        <p class="info-text">
            中间弦竖直，左右弦呈非对称分布（左侧角度小、右侧角度大，右侧约为左侧的1.5~2倍）。<br>
            调节步长可改变角度间隔，所有小球同时到达底部。
        </p>
    </div>

    <!-- 左下实时数据 -->
    <div class="physics-panel panel">
        <h3>📊 实时数据</h3>
        <div class="param-row"><span>📏 半径 R</span><span id="liveRadius" class="param-value">150 px</span></div>
        <div class="param-row"><span>🧲 重力 g</span><span id="liveGravity" class="param-value">10.0 m/s²</span></div>
        <div class="param-row"><span>⏱️ 理论时间</span><span id="liveTime" class="param-value">0.00 s</span></div>
        <div class="param-row"><span>📐 各弦角度</span><span id="liveAngles" class="param-value">0°, ±10°, ±20°</span></div>
    </div>

    <!-- 右上控制面板 -->
    <div class="controls-panel panel">
        <h3>🔧 控制面板</h3>
        <div class="section-label">模型参数</div>
        <div class="slider-group">
            <div class="slider-label"><span class="lt">圆半径 R</span><span id="vRadius" class="vbadge">150</span></div>
            <input type="range" id="sRadius" min="60" max="220" value="150" step="1">
        </div>
        <div class="slider-group">
            <div class="slider-label"><span class="lt">重力加速度 g</span><span id="vGravity" class="vbadge">10.0</span></div>
            <input type="range" id="sGravity" min="2" max="30" value="10" step="0.5">
        </div>
        <div class="slider-group">
            <div class="slider-label"><span class="lt">动画速度</span><span id="vSpeed" class="vbadge">2.0x</span></div>
            <input type="range" id="sSpeed" min="0.3" max="5" value="2" step="0.1">
        </div>
        <div class="slider-group">
            <div class="slider-label"><span class="lt">弦步长 d (rad)</span><span id="vStep" class="vbadge">0.18</span></div>
            <input type="range" id="sStep" min="0.2" max="0.75" value="0.5" step="0.01">
        </div>

        <div class="section-label">操作</div>
        <div class="btn-row">
            <button class="btn btn-primary" id="btnStart">▷ 开始动画</button>
            <button class="btn btn-ghost" id="btnReset">↻ 重置动画</button>
        </div>
        <p class="info-text" style="margin-top:8px; font-size:0.7rem;">
            💡 非对称偏移系数：左 -2, -1 | 中 0 | 右 +1.5, +2.5
        </p>
    </div>

    
</div>

<script>
    (function() {
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        // DOM
        const sRadius = document.getElementById('sRadius');
        const vRadius = document.getElementById('vRadius');
        const sGravity = document.getElementById('sGravity');
        const vGravity = document.getElementById('vGravity');
        const sSpeed = document.getElementById('sSpeed');
        const vSpeed = document.getElementById('vSpeed');
        const sStep = document.getElementById('sStep');
        const vStep = document.getElementById('vStep');

        const liveRadius = document.getElementById('liveRadius');
        const liveGravity = document.getElementById('liveGravity');
        const liveTime = document.getElementById('liveTime');
        const liveAngles = document.getElementById('liveAngles');

        const btnStart = document.getElementById('btnStart');
        const btnReset = document.getElementById('btnReset');

        let radius = 150;
        let gravity = 10.0;
        let speed = 2.0;
        let step = 0.18; // 左侧基准步长

        const BALL_COUNT = 5;
        // 清新亮色配色（最初版本）
        const COLORS = ['#FF8A80', '#FFD54F', '#69F0AE', '#40C4FF', '#B388FF'];

        let balls = [];
        let animationId = null;
        let isAnimating = false;
        let startTime = 0;

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const size = Math.min(container.clientWidth, container.clientHeight) * 0.9;
            const finalSize = Math.min(size, 700);
            canvas.width = finalSize;
            canvas.height = finalSize;
            resetSimulation();
        }

        function generateBalls() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const topX = cx;
            const topY = cy - radius;

            // 非对称偏移系数，右侧约为左侧的1.5~2.5倍
            const offsets = [-1.5, -0.5, 0, 1, 2];
            const angles = offsets.map(k => {
                let raw = Math.PI / 2 + k * step;
                // 确保角度在 (0, PI) 范围内，避免弦超出圆下半部
                return Math.max(0.01, Math.min(Math.PI - 0.01, raw));
            });

            // 显示角度字符串
            const angleDegs = angles.map(a => ((a - Math.PI/2) * 180 / Math.PI).toFixed(1) + '°').join(', ');
            liveAngles.textContent = angleDegs;

            balls = angles.map((angle, idx) => {
                const endX = cx + radius * Math.cos(angle);
                const endY = cy + radius * Math.sin(angle);
                const dx = endX - topX;
                const dy = endY - topY;
                const length = Math.sqrt(dx * dx + dy * dy);
                const theta = Math.asin(Math.abs(dx) / length);
                return {
                    startX: topX,
                    startY: topY,
                    endX,
                    endY,
                    length,
                    theta,
                    color: COLORS[idx],
                    reachedEnd: false
                };
            });

            liveTime.textContent = (2 * Math.sqrt(radius / gravity)).toFixed(2) + ' s';
        }

        function drawScene(progress = 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // 圆
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#a0aec0';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // 弦
            balls.forEach(ball => {
                ctx.beginPath();
                ctx.moveTo(ball.startX, ball.startY);
                ctx.lineTo(ball.endX, ball.endY);
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ball.startX, ball.startY);
                ctx.lineTo(ball.endX, ball.endY);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // 小球（柔和渐变，无白色高光）
            balls.forEach(ball => {
                const posX = ball.startX + (ball.endX - ball.startX) * progress;
                const posY = ball.startY + (ball.endY - ball.startY) * progress;
                const grad = ctx.createRadialGradient(posX - 2, posY - 2, 0, posX, posY, 9);
                grad.addColorStop(0, lighten(ball.color, 0.2));
                grad.addColorStop(1, ball.color);
                ctx.beginPath();
                ctx.arc(posX, posY, 7.5, 0, 2 * Math.PI);
                ctx.fillStyle = grad;
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
            });

            ctx.beginPath();
            ctx.arc(cx, cy, 3.5, 0, 2 * Math.PI);
            ctx.fillStyle = '#6b7280';
            ctx.fill();
        }

        function lighten(hex, factor) {
            let R = parseInt(hex.substring(1,3), 16);
            let G = parseInt(hex.substring(3,5), 16);
            let B = parseInt(hex.substring(5,7), 16);
            R = Math.min(255, Math.round(R + (255 - R) * factor));
            G = Math.min(255, Math.round(G + (255 - G) * factor));
            B = Math.min(255, Math.round(B + (255 - B) * factor));
            return `rgb(${R},${G},${B})`;
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = (timestamp - startTime) / 1000;
            const totalTime = 2 * Math.sqrt(radius / gravity);
            const progress = Math.min(elapsed * speed / totalTime, 1.0);
            drawScene(progress);
            if (progress < 1.0) {
                animationId = requestAnimationFrame(animate);
            } else {
                isAnimating = false;
                animationId = null;
                startTime = 0;
                drawScene(1.0);
            }
        }

        function startAnimation() {
            if (isAnimating) return;
            balls.forEach(b => b.reachedEnd = false);
            isAnimating = true;
            startTime = 0;
            animationId = requestAnimationFrame(animate);
        }

        function resetSimulation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            isAnimating = false;
            startTime = 0;
            generateBalls();
            drawScene(0);
        }

        function updateUI() {
            radius = parseInt(sRadius.value);
            gravity = parseFloat(sGravity.value);
            speed = parseFloat(sSpeed.value);
            step = parseFloat(sStep.value);

            vRadius.textContent = radius;
            vGravity.textContent = gravity.toFixed(1);
            vSpeed.textContent = speed.toFixed(1) + 'x';
            vStep.textContent = step.toFixed(2);

            liveRadius.textContent = radius + ' px';
            liveGravity.textContent = gravity.toFixed(1) + ' m/s²';
            resetSimulation();
        }

        sRadius.addEventListener('input', updateUI);
        sGravity.addEventListener('input', updateUI);
        sSpeed.addEventListener('input', () => {
            speed = parseFloat(sSpeed.value);
            vSpeed.textContent = speed.toFixed(1) + 'x';
        });
        sStep.addEventListener('input', updateUI);

        btnStart.addEventListener('click', startAnimation);
        btnReset.addEventListener('click', resetSimulation);
        window.addEventListener('resize', resizeCanvas);

        resizeCanvas();
        updateUI();
    })();
</script>
    </body>
</html>
