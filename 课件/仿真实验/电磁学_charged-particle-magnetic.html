<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/looogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子斜入磁场 - PhySenLab仿真实验</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #E8F4FD 0%, #F8FBFF 50%, #E1EEF7 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        .simulation-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 18px 22px;
            border-radius: 12px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.15);
            z-index: 10;
            max-width: 320px;
        }
        
        .info-panel h1 {
            font-size: 1.15rem;
            color: #2C3E50;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info-panel h1 .icon { font-size: 1.3rem; }
        
        .formula-box {
            background: linear-gradient(135deg, #E8F4FD 0%, #F8FBFF 100%);
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 4px solid #4A90E2;
            margin-bottom: 8px;
        }
        
        .formula {
            font-size: 1.1rem;
            color: #000000;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 2px;
            font-family: 'Times New Roman', serif;
        }
        
        .formula-var {
            font-style: italic;
            color: #000000;
            font-weight: 600;
        }
        
        .formula-bold {
            font-weight: bold;
            color: #000000;
        }
        
        .info-text {
            font-size: 0.85rem;
            color: #5A6C7D;
            line-height: 1.5;
        }
        
        .controls-panel {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.15);
            width: 340px;
            z-index: 10;
        }
        
        .controls-panel h3 {
            font-size: 1.1rem;
            color: #2C3E50;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #E1EEF7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .slider-group {
            margin-bottom: 18px;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #2C3E50;
        }
        
        .slider-label .label-text {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .value-badge {
            background: linear-gradient(135deg, #4A90E2 0%, #6BB6FF 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        input[type=range] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #E1EEF7;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4A90E2 0%, #6BB6FF 100%);
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(74, 144, 226, 0.4);
            cursor: pointer;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4A90E2 0%, #6BB6FF 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #5A6C7D;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .stats-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.15);
            z-index: 10;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        
        .stat-label {
            color: #5A6C7D;
            font-size: 0.9rem;
        }
        
        .stat-value {
            color: #4A90E2;
            font-weight: 700;
            font-family: monospace;
            font-size: 1.3rem;
        }
        
        .back-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: white;
            color: #4A90E2;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid #4A90E2;
            box-shadow: 0 2px 10px rgba(74, 144, 226, 0.2);
            transition: all 0.3s;
            z-index: 10;
        }
        
        .back-btn:hover {
            background: #4A90E2;
            color: white;
        }
        
        .legend-panel {
            position: absolute;
            top: 100px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.15);
            z-index: 10;
            font-size: 0.85rem;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
            color: #5A6C7D;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            margin-right: 8px;
        }
        
        .hint-text {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #8B9DC3;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.8);
            padding: 6px 15px;
            border-radius: 20px;
            z-index: 10;
        }
        
        @media (max-width: 900px) {
            .info-panel { max-width: 260px; padding: 15px; }
            .info-panel h1 { font-size: 1rem; }
            .controls-panel { width: 280px; padding: 20px; bottom: 20px; left: 20px; }
            .stats-box { padding: 12px 15px; }
            .back-btn { right: 150px; padding: 8px 15px; }
        }
    </style>
</head>
<body>
    <div class="simulation-container">
        <div id="canvas-container"></div>
        
        <div class="info-panel">
            <h1><span class="icon">⚡</span>带电粒子斜入磁场</h1>
            <div class="formula-box">
                <div class="formula">
                    <span class="formula-var">F</span> = <span class="formula-var">q</span>(
                    <span class="formula-bold">v</span> × 
                    <span class="formula-bold">B</span>)
                </div>
            </div>
            <p class="info-text">
                观察带电粒子在匀强磁场中的螺旋运动，理解洛伦兹力的作用。调节速度大小和方向，观察轨迹变化。
            </p>
        </div>
        
        <div class="controls-panel">
            <h3>🔧 实验参数调节</h3>
            
            <div class="slider-group">
                <div class="slider-label">
                    <span class="label-text">🧲 磁场方向</span>
                    <span id="magAngle-val" class="value-badge">0°</span>
                </div>
                <input type="range" id="magAngle" min="0" max="360" value="0" step="1">
            </div>
            
            <div class="slider-group">
                <div class="slider-label">
                    <span class="label-text">⚡ 速度大小</span>
                    <span id="speed-val" class="value-badge">1.20</span>
                </div>
                <input type="range" id="speed" min="0.3" max="2.5" value="1.2" step="0.01">
            </div>
            
            <div class="slider-group">
                <div class="slider-label">
                    <span class="label-text">📐 投射角</span>
                    <span id="angle-val" class="value-badge">45°</span>
                </div>
                <input type="range" id="angle" min="0" max="90" value="45" step="1">
            </div>
            
            <div class="btn-group">
                <button id="pauseBtn" class="btn btn-primary">⏸️ 暂停</button>
                <button id="resetBtn" class="btn btn-secondary">🔄 重置</button>
            </div>
        </div>
        
        <div class="stats-box">
            <div class="stat-row">
                <span class="stat-label">沿磁场距离 h</span>
                <span id="h-value" class="stat-value">0.00</span>
            </div>
        </div>
        
        
        
        <div class="legend-panel">
            <div class="legend-item"><div class="legend-color" style="background:#3366cc;"></div>磁场方向</div>
            <div class="legend-item"><div class="legend-color" style="background:#33cc33;"></div>总速度</div>
            <div class="legend-item"><div class="legend-color" style="background:#0066ff;"></div>平行速度</div>
            <div class="legend-item"><div class="legend-color" style="background:#cc3333;"></div>洛伦兹力</div>
            <div class="legend-item"><div class="legend-color" style="background:#cc7700;"></div>运动轨迹</div>
        </div>
        
        <div class="hint-text">鼠标拖动旋转视角 | 滚轮缩放</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f8ff);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 12);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2;

        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);
        
        const gridHelper = new THREE.GridHelper(20, 20, 0x4A90E2, 0xE1EEF7);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        const fieldArrowGroup = new THREE.Group();
        const arrowColor = 0x3366cc;
        for (let x = -6; x <= 6; x += 1.8) {
            for (let y = -3; y <= 3; y += 1.5) {
                for (let z = -6; z <= 6; z += 1.8) {
                    const arrow = new THREE.ArrowHelper(
                        new THREE.Vector3(0, 0, 1),
                        new THREE.Vector3(x, y, z),
                        1.2, arrowColor, 0.4, 0.3
                    );
                    fieldArrowGroup.add(arrow);
                }
            }
        }
        scene.add(fieldArrowGroup);

        const particleGeo = new THREE.SphereGeometry(0.15, 32, 32);
        const particleMat = new THREE.MeshStandardMaterial({
            color: 0xff6600,
            emissive: 0x442200,
            roughness: 0.3
        });
        const particle = new THREE.Mesh(particleGeo, particleMat);
        scene.add(particle);
        
        const particleLight = new THREE.PointLight(0xff5500, 0.8, 5);
        scene.add(particleLight);
        
        const velocityArrow = new THREE.ArrowHelper(
            new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 1.0, 0x33cc33, 0.4, 0.25
        );
        scene.add(velocityArrow);
        
        const parallelVelocityArrow = new THREE.ArrowHelper(
            new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 1.0, 0x0066ff, 0.4, 0.25
        );
        scene.add(parallelVelocityArrow);
        
        const forceArrow = new THREE.ArrowHelper(
            new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 1.0, 0xcc3333, 0.4, 0.25
        );
        scene.add(forceArrow);
        
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xcc7700, linewidth: 3 });
        const lineGeometry = new THREE.BufferGeometry();
        const trajectoryLine = new THREE.Line(lineGeometry, lineMaterial);
        scene.add(trajectoryLine);

        const circlePoints = [];
        for (let i = 0; i <= 64; i++) {
            const angle = (i / 64) * Math.PI * 2;
            circlePoints.push(new THREE.Vector3(Math.cos(angle), Math.sin(angle), 0));
        }
        const circleGeometry = new THREE.BufferGeometry().setFromPoints(circlePoints);
        const circleMaterial = new THREE.LineDashedMaterial({
            color: 0x555555, dashSize: 0.1, gapSize: 0.08, linewidth: 2
        });
        const circleLoop = new THREE.LineLoop(circleGeometry, circleMaterial);
        circleLoop.computeLineDistances();
        scene.add(circleLoop);

        const state = {
            magAngle: 0,
            speed: 1.2,
            theta: 45,
            time: 0,
            bDir: new THREE.Vector3(0, 0, 1),
            vParallel: 0,
            vPerp: 0,
            radius: 0,
            omega: 1.0,
            u1: new THREE.Vector3(1, 0, 0),
            u2: new THREE.Vector3(0, 1, 0),
            startOffset: new THREE.Vector3(0, 0, -5.5),
            isPaused: false
        };
        
        let needResetTime = false;
        const maxTrajectoryTime = 20.0;
        
        const hValueSpan = document.getElementById('h-value');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        pauseBtn.addEventListener('click', () => {
            state.isPaused = !state.isPaused;
            pauseBtn.textContent = state.isPaused ? '▶️ 继续' : '⏸️ 暂停';
            pauseBtn.classList.toggle('btn-primary', !state.isPaused);
            pauseBtn.classList.toggle('btn-secondary', state.isPaused);
        });
        
        resetBtn.addEventListener('click', () => {
            state.time = 0;
            needResetTime = true;
        });

        function updateDerivedParams() {
            const angleRad = THREE.MathUtils.degToRad(state.magAngle);
            state.bDir.set(0, Math.sin(angleRad), Math.cos(angleRad)).normalize();
            
            const X = new THREE.Vector3(1, 0, 0);
            state.u1.copy(X).cross(state.bDir).normalize();
            state.u2.copy(state.bDir).cross(state.u1).normalize();
            
            fieldArrowGroup.children.forEach(arrow => arrow.setDirection(state.bDir));
            
            const v = state.speed;
            const thetaRad = THREE.MathUtils.degToRad(state.theta);
            state.vParallel = v * Math.cos(thetaRad);
            state.vPerp = v * Math.sin(thetaRad);
            state.radius = (state.vPerp === 0) ? 0 : state.vPerp / state.omega;
            state.startOffset.copy(state.bDir).multiplyScalar(-5.5);
            circleLoop.scale.set(state.radius, state.radius, state.radius);
        }
        
        function generateTrajectoryPoints(segments = 500) {
            const points = [];
            const dt = maxTrajectoryTime / segments;
            const pos = new THREE.Vector3();
            const b = state.bDir;
            const u1 = state.u1;
            const u2 = state.u2;
            const vp = state.vParallel;
            const R = state.radius;
            const omega = state.omega;
            const start = state.startOffset;
            
            for (let i = 0; i <= segments; i++) {
                const t = i * dt;
                const paraMove = vp * t;
                const angle = omega * t;
                pos.copy(b).multiplyScalar(paraMove).add(start);
                pos.addScaledVector(u1, R * Math.cos(angle));
                pos.addScaledVector(u2, R * Math.sin(angle));
                points.push(pos.clone());
            }
            return points;
        }
        
        function updateTrajectoryGeometry() {
            const points = generateTrajectoryPoints();
            const positions = new Float32Array(points.length * 3);
            points.forEach((p, idx) => {
                positions[idx*3] = p.x;
                positions[idx*3+1] = p.y;
                positions[idx*3+2] = p.z;
            });
            trajectoryLine.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            trajectoryLine.geometry.setDrawRange(0, 0);
        }
        
        updateDerivedParams();
        updateTrajectoryGeometry();
        
        document.getElementById('magAngle').addEventListener('input', (e) => {
            state.magAngle = parseFloat(e.target.value);
            document.getElementById('magAngle-val').textContent = state.magAngle + '°';
            updateDerivedParams();
            updateTrajectoryGeometry();
            needResetTime = true;
        });
        
        document.getElementById('speed').addEventListener('input', (e) => {
            state.speed = parseFloat(e.target.value);
            document.getElementById('speed-val').textContent = state.speed.toFixed(2);
            updateDerivedParams();
            updateTrajectoryGeometry();
            needResetTime = true;
        });
        
        document.getElementById('angle').addEventListener('input', (e) => {
            state.theta = parseFloat(e.target.value);
            document.getElementById('angle-val').textContent = state.theta + '°';
            updateDerivedParams();
            updateTrajectoryGeometry();
            needResetTime = true;
        });

        let clock = new THREE.Clock();
        
        function animate() {
            const delta = clock.getDelta();
            
            if (!state.isPaused) {
                state.time += delta;
            }
            
            if (needResetTime) {
                state.time = 0;
                clock = new THREE.Clock();
                needResetTime = false;
            }
            
            const t = state.time;
            const b = state.bDir;
            const u1 = state.u1;
            const u2 = state.u2;
            const vp = state.vParallel;
            const vPerp = state.vPerp;
            const R = state.radius;
            const omega = state.omega;
            const start = state.startOffset;
            
            const paraMove = vp * t;
            const angle = omega * t;
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);
            
            const pos = new THREE.Vector3().copy(b).multiplyScalar(paraMove).add(start);
            pos.addScaledVector(u1, R * cosA);
            pos.addScaledVector(u2, R * sinA);
            
            particle.position.copy(pos);
            particleLight.position.copy(pos);
            
            const vDir = new THREE.Vector3().copy(b).multiplyScalar(vp);
            vDir.addScaledVector(u1, -vPerp * sinA);
            vDir.addScaledVector(u2, vPerp * cosA);
            const vMag = Math.sqrt(vp*vp + vPerp*vPerp);
            
            if (vMag > 0.01) {
                velocityArrow.setDirection(vDir.clone().normalize());
                velocityArrow.setLength(2.0 * vMag, 0.4, 0.25);
                velocityArrow.position.copy(pos);
            } else {
                velocityArrow.setLength(0);
            }
            
            if (Math.abs(vp) > 0.01) {
                parallelVelocityArrow.setDirection(b.clone().normalize());
                parallelVelocityArrow.setLength(2.0 * Math.abs(vp), 0.4, 0.25);
                parallelVelocityArrow.position.copy(pos);
            } else {
                parallelVelocityArrow.setLength(0);
            }
            
            if (vPerp > 0.01) {
                const e_r = new THREE.Vector3().copy(u1).multiplyScalar(cosA).addScaledVector(u2, sinA);
                const forceDir = e_r.clone().negate();
                forceArrow.setDirection(forceDir);
                forceArrow.setLength(2.0 * vPerp, 0.4, 0.25);
                forceArrow.position.copy(pos);
            } else {
                forceArrow.setLength(0);
            }
            
            const proj = new THREE.Vector3().copy(b).multiplyScalar(paraMove).add(start);
            circleLoop.position.copy(proj);
            const quat = new THREE.Quaternion().setFromUnitVectors(
                new THREE.Vector3(0, 0, 1),
                b.clone().normalize()
            );
            circleLoop.quaternion.copy(quat);
            
            hValueSpan.textContent = paraMove.toFixed(2);
            
            const totalPoints = trajectoryLine.geometry.attributes.position.count;
            if (totalPoints > 1) {
                const progress = Math.min(t / maxTrajectoryTime, 1.0);
                const drawCount = Math.floor(progress * (totalPoints - 1)) + 1;
                trajectoryLine.geometry.setDrawRange(0, drawCount);
            }
            
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
    </body>
</html>
