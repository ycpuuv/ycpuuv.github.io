<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/looogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布朗运动 - 物理仿真实验 - PhySenLab</title>
    <style>
        /* ===== 样式变量 ===== */
        :root {
            --primary-color: #4A90E2;
            --primary-light: #E8F4FD;
            --primary-dark: #357ABD;
            --secondary-color: #6BB6FF;
            --bg-color: #F8FBFF;
            --card-bg: #FFFFFF;
            --text-primary: #2C3E50;
            --text-secondary: #5A6C7D;
            --text-light: #8B9DC3;
            --border-color: #E1EEF7;
            --shadow: 0 2px 12px rgba(74, 144, 226, 0.1);
            --shadow-hover: 0 8px 24px rgba(74, 144, 226, 0.2);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #E8F4FD 0%, #F8FBFF 50%, #E1EEF7 100%);
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
        }

        .simulation-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* 3D画布容器 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 通用毛玻璃卡片 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 22px;
            color: var(--text-primary);
            transition: var(--transition);
            z-index: 10;
        }

        .glass-panel:hover { box-shadow: var(--shadow-hover); }

        /* 左上信息卡片 */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            max-width: 280px;
            z-index: 20;
        }

        .info-panel h1 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-dark);
        }

        .formula-box {
            background: var(--primary-light);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            margin-bottom: 8px;
        }

        .formula {
            font-size: 1rem;
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }

        .info-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* 右侧控制面板 */
        .controls-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            z-index: 20;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .controls-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .slider-group { margin-bottom: 20px; }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .value-badge {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.8rem;
            font-weight: 600;
        }

        input[type=range] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #E1EEF7;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(74, 144, 226, 0.4);
            cursor: pointer;
        }

        /* 底部按钮栏 */
        .bottom-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: 60px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-hover);
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 12px rgba(74,144,226,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(74,144,226,0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: var(--text-secondary);
        }

        .btn-secondary:hover { background: #e0e0e0; }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #ec7063);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(231,76,60,0.4);
        }

        /* 右下角轨迹图卡片 */
        .trajectory-card {
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: 320px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 12px;
        }

        .trajectory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .trajectory-title {
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trajectory-container {
            background: white;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }

        #trajectoryCanvas {
            display: block;
            width: 100%;
            height: auto;
            background: #f5f7fa;
            border-radius: 6px;
            cursor: crosshair;
        }

        /* 右侧中间图例 */
        .legend-panel {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 20;
            font-size: 0.8rem;
            width: 150px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            color: var(--text-secondary);
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .legend-color.line { background: #ffd700; border-radius: 2px; }
        .legend-color.pollen { background: #ffd700; }
        .legend-color.molecule { background: #00d2ff; }
        .legend-color.trajectory { background: #ff6600; width: 14px; height: 2px; border-radius: 1px; }

        /* 返回按钮 - 左下角 */
        .back-btn {
            position: absolute;
            bottom: 30px;
            left: 20px;
            background: white;
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid var(--primary-color);
            box-shadow: var(--shadow);
            transition: var(--transition);
            z-index: 30;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        .hint-text {
            position: absolute;
            bottom: 100px;
            left: 20px;
            color: var(--text-light);
            font-size: 0.7rem;
            background: rgba(255,255,255,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 20;
        }

        .controls-panel::-webkit-scrollbar { width: 4px; }
        .controls-panel::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        @media (max-width: 1000px) {
            .controls-panel { width: 280px; }
            .trajectory-card { width: 280px; }
        }
    </style>
    <!-- 引入Three.js核心库和扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="simulation-container">
        <!-- Three.js 画布容器 -->
        <div id="canvas-container"></div>

        <!-- 左上信息卡片 -->
        <div class="info-panel glass-panel">
            <h1>⚡ 布朗运动</h1>
            <div class="formula-box">
                <div class="formula">Δx ∝ √(k<sub>B</sub>T·t)</div>
            </div>
            <p class="info-text">
                水分子无规则运动撞击花粉颗粒，导致其做无规则运动。温度越高、分子质量越小，运动越剧烈。
            </p>
        </div>

        <!-- 右侧控制面板（参数滑块） -->
        <div class="controls-panel glass-panel">
            <h3>🔧 实验参数调节</h3>

            <div class="slider-group">
                <div class="slider-label">
                    <span>🌡️ 水温 (活跃度)</span>
                    <span id="tempVal" class="value-badge">1.0</span>
                </div>
                <input type="range" id="tempSlider" min="0" max="3.0" step="0.1" value="1.0">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>⚙️ 花粉质量 (惯性)</span>
                    <span id="massVal" class="value-badge">1.0</span>
                </div>
                <input type="range" id="massSlider" min="0.5" max="5.0" step="0.5" value="1.0">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>📏 轨迹保留长度</span>
                    <span id="trailVal" class="value-badge">400</span>
                </div>
                <input type="range" id="trailSlider" min="50" max="1000" step="50" value="400">
            </div>
        </div>

        <!-- 底部按钮栏 -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="startBtn">▶ 开始运动</button>
            <button class="btn btn-secondary" id="pauseBtn">⏸ 暂停</button>
            <button class="btn btn-danger" id="resetBtn">🔄 重置</button>
        </div>

        <!-- 右下角轨迹图卡片 -->
        <div class="trajectory-card glass-panel">
            <div class="trajectory-header">
                <div class="trajectory-title">📈 花粉俯视轨迹 (X-Z平面)</div>
            </div>
            <div class="trajectory-container">
                <canvas id="trajectoryCanvas" width="280" height="280"></canvas>
            </div>
        </div>

        <!-- 右侧中间图例 -->
        <div class="legend-panel">
            <div style="font-weight: 600; margin-bottom: 12px;">📖 图例</div>
            <div class="legend-item"><div class="legend-color pollen"></div> 花粉颗粒 (3D)</div>
            <div class="legend-item"><div class="legend-color molecule"></div> 水分子 (3D)</div>
            <div class="legend-item"><div class="legend-color line"></div> 3D运动轨迹</div>
            <div class="legend-item"><div class="legend-color trajectory"></div> 2D俯视轨迹</div>
        </div>

        <!-- 返回按钮 -->
        
        <div class="hint-text">🖱️ 鼠标拖拽旋转视角 | 滚轮缩放</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x001133);
        scene.fog = new THREE.FogExp2(0x001133, 0.015);

        const canvasContainer = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(50, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 1000);
        camera.position.set(0, 30, 40);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        canvasContainer.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.2;

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0x444444);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(10, 50, 20);
        scene.add(sunLight);
        const waterLight = new THREE.PointLight(0x00aaff, 2, 50);
        waterLight.position.set(0, 5, 0);
        scene.add(waterLight);

        // --- 水面平面 ---
        const waterGeometry = new THREE.PlaneGeometry(200, 200);
        const waterMaterial = new THREE.MeshPhongMaterial({
            color: 0x006994,
            transparent: true,
            opacity: 0.7,
            shininess: 80,
            side: THREE.DoubleSide
        });
        const waterPlane = new THREE.Mesh(waterGeometry, waterMaterial);
        waterPlane.rotation.x = -Math.PI / 2;
        waterPlane.position.y = 0;
        scene.add(waterPlane);

        // --- 花粉颗粒 (黄色球体) ---
        const pollenGeometry = new THREE.IcosahedronGeometry(1.5, 2);
        const pollenMaterial = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            roughness: 0.7,
            metalness: 0.2,
            emissive: 0xaa6600,
            emissiveIntensity: 0.2
        });
        const pollenMesh = new THREE.Mesh(pollenGeometry, pollenMaterial);
        pollenMesh.position.set(0, 1.6, 0);
        scene.add(pollenMesh);

        // --- 水下分子 (蓝色点云) ---
        const moleculeCount = 1200;
        const moleculePositions = [];
        for (let i = 0; i < moleculeCount; i++) {
            moleculePositions.push(
                (Math.random() - 0.5) * 100, // x
                -Math.random() * 30 - 1,     // y (水下)
                (Math.random() - 0.5) * 100  // z
            );
        }
        const moleculeGeometry = new THREE.BufferGeometry();
        moleculeGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(moleculePositions), 3));
        const moleculeMaterial = new THREE.PointsMaterial({ color: 0x00d2ff, size: 0.4, transparent: true, opacity: 0.5 });
        const molecules = new THREE.Points(moleculeGeometry, moleculeMaterial);
        scene.add(molecules);

        // --- 3D轨迹线 (白色线) ---
        const trailMaxPoints = 1000;
        const trailPositions = new Float32Array(trailMaxPoints * 3);
        const trailGeometry = new THREE.BufferGeometry();
        trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        trailGeometry.setDrawRange(0, 0);
        const trailMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2, opacity: 0.6 });
        const trailLine = new THREE.Line(trailGeometry, trailMaterial);
        trailLine.position.y = 0.1;
        scene.add(trailLine);

        // --- 状态变量 ---
        let pollenPosition = new THREE.Vector3(0, 1.6, 0);
        let trailPoints = [];
        let isRunning = true;
        let lastTime = performance.now() / 1000;

        // 参数
        let temperature = 1.0;
        let pollenMass = 1.0;
        let trailLength = 400;

        // --- 轨迹图 (2D俯视图) ---
        const trajCanvas = document.getElementById('trajectoryCanvas');
        const trajCtx = trajCanvas.getContext('2d');
        let trajHistory = [];
        const maxTrajPoints = 500;

        trajCanvas.width = 280;
        trajCanvas.height = 280;

        function drawTrajectory() {
            if (trajHistory.length === 0) {
                trajCtx.clearRect(0, 0, trajCanvas.width, trajCanvas.height);
                trajCtx.fillStyle = '#f5f7fa';
                trajCtx.fillRect(0, 0, trajCanvas.width, trajCanvas.height);
                trajCtx.fillStyle = '#8B9DC3';
                trajCtx.font = '12px sans-serif';
                trajCtx.textAlign = 'center';
                trajCtx.fillText('等待数据...', trajCanvas.width/2, trajCanvas.height/2);
                return;
            }

            let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
            for (let p of trajHistory) {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minZ = Math.min(minZ, p.z);
                maxZ = Math.max(maxZ, p.z);
            }
            const padding = 0.1 * Math.max(maxX - minX, maxZ - minZ, 5);
            minX -= padding;
            maxX += padding;
            minZ -= padding;
            maxZ += padding;
            const rangeX = maxX - minX;
            const rangeZ = maxZ - minZ;
            const scale = Math.min(trajCanvas.width / rangeX, trajCanvas.height / rangeZ);
            const offsetX = (trajCanvas.width - rangeX * scale) / 2;
            const offsetY = (trajCanvas.height - rangeZ * scale) / 2;

            function mapX(x) { return offsetX + (x - minX) * scale; }
            function mapZ(z) { return offsetY + (maxZ - z) * scale; }

            trajCtx.clearRect(0, 0, trajCanvas.width, trajCanvas.height);
            trajCtx.fillStyle = '#f5f7fa';
            trajCtx.fillRect(0, 0, trajCanvas.width, trajCanvas.height);

            trajCtx.strokeStyle = '#E1EEF7';
            trajCtx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const x = offsetX + i * (trajCanvas.width - offsetX * 2) / 4;
                trajCtx.beginPath();
                trajCtx.moveTo(x, offsetY);
                trajCtx.lineTo(x, trajCanvas.height - offsetY);
                trajCtx.stroke();
                const y = offsetY + i * (trajCanvas.height - offsetY * 2) / 4;
                trajCtx.beginPath();
                trajCtx.moveTo(offsetX, y);
                trajCtx.lineTo(trajCanvas.width - offsetX, y);
                trajCtx.stroke();
            }

            trajCtx.beginPath();
            trajCtx.strokeStyle = '#ff6600';
            trajCtx.lineWidth = 2;
            for (let i = 0; i < trajHistory.length; i++) {
                const p = trajHistory[i];
                const x = mapX(p.x);
                const z = mapZ(p.z);
                if (i === 0) trajCtx.moveTo(x, z);
                else trajCtx.lineTo(x, z);
            }
            trajCtx.stroke();

            const current = trajHistory[trajHistory.length - 1];
            const cx = mapX(current.x);
            const cz = mapZ(current.z);
            trajCtx.beginPath();
            trajCtx.arc(cx, cz, 5, 0, 2 * Math.PI);
            trajCtx.fillStyle = '#ffd700';
            trajCtx.fill();
        }

        function updateTrajectoryHistory() {
            trajHistory.push({ x: pollenPosition.x, z: pollenPosition.z });
            if (trajHistory.length > maxTrajPoints) trajHistory.shift();
            drawTrajectory();
        }

        function updateTrailGeometry() {
            const positions = trailLine.geometry.attributes.position.array;
            const count = trailPoints.length;
            for (let i = 0; i < count; i++) {
                positions[i*3] = trailPoints[i].x;
                positions[i*3+1] = 0;
                positions[i*3+2] = trailPoints[i].z;
            }
            trailLine.geometry.setDrawRange(0, count);
            trailLine.geometry.attributes.position.needsUpdate = true;
        }

        function updatePhysics(deltaTime) {
            if (!isRunning) return;

            const molPos = molecules.geometry.attributes.position.array;
            const speed = 0.3 * temperature;
            for (let i = 0; i < moleculeCount; i++) {
                molPos[i*3] += (Math.random() - 0.5) * speed;
                molPos[i*3+1] += (Math.random() - 0.5) * speed * 0.2;
                molPos[i*3+2] += (Math.random() - 0.5) * speed;
                if (molPos[i*3+1] > -0.5) molPos[i*3+1] = -0.5;
                if (molPos[i*3+1] < -30) molPos[i*3+1] = -30;
            }
            molecules.geometry.attributes.position.needsUpdate = true;

            const force = 0.4 * temperature;
            const inertialFactor = Math.sqrt(pollenMass);
            const dx = ((Math.random() - 0.5) * force) / inertialFactor;
            const dz = ((Math.random() - 0.5) * force) / inertialFactor;

            pollenPosition.x += dx;
            pollenPosition.z += dz;
            pollenPosition.x = Math.min(Math.max(pollenPosition.x, -40), 40);
            pollenPosition.z = Math.min(Math.max(pollenPosition.z, -40), 40);
            pollenMesh.position.copy(pollenPosition);
            pollenMesh.rotation.x += dz * 0.1;
            pollenMesh.rotation.z -= dx * 0.1;

            trailPoints.push(pollenPosition.clone());
            if (trailPoints.length > trailLength) trailPoints.shift();
            updateTrailGeometry();

            updateTrajectoryHistory();
        }

        function animate() {
            const now = performance.now() / 1000;
            let delta = Math.min(0.033, now - lastTime);
            if (delta <= 0) delta = 0.016;
            lastTime = now;

            updatePhysics(delta);
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // --- DOM 元素绑定 ---
        const tempSlider = document.getElementById('tempSlider');
        const massSlider = document.getElementById('massSlider');
        const trailSlider = document.getElementById('trailSlider');
        const tempVal = document.getElementById('tempVal');
        const massVal = document.getElementById('massVal');
        const trailVal = document.getElementById('trailVal');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        tempSlider.addEventListener('input', (e) => {
            temperature = parseFloat(e.target.value);
            tempVal.innerText = temperature.toFixed(1);
        });
        massSlider.addEventListener('input', (e) => {
            pollenMass = parseFloat(e.target.value);
            massVal.innerText = pollenMass.toFixed(1);
        });
        trailSlider.addEventListener('input', (e) => {
            trailLength = parseInt(e.target.value);
            trailVal.innerText = trailLength;
            if (trailPoints.length > trailLength) {
                trailPoints = trailPoints.slice(-trailLength);
                updateTrailGeometry();
            }
        });

        startBtn.addEventListener('click', () => { isRunning = true; });
        pauseBtn.addEventListener('click', () => { isRunning = false; });
        resetBtn.addEventListener('click', () => {
            pollenPosition.set(0, 1.6, 0);
            pollenMesh.position.copy(pollenPosition);
            trailPoints = [];
            updateTrailGeometry();
            trajHistory = [];
            drawTrajectory();
            const molPos = molecules.geometry.attributes.position.array;
            for (let i = 0; i < moleculeCount; i++) {
                molPos[i*3] = (Math.random() - 0.5) * 100;
                molPos[i*3+1] = -Math.random() * 30 - 1;
                molPos[i*3+2] = (Math.random() - 0.5) * 100;
            }
            molecules.geometry.attributes.position.needsUpdate = true;
            isRunning = true;
        });

        drawTrajectory();
        lastTime = performance.now() / 1000;
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        });
    </script>
    </body>
</html>
