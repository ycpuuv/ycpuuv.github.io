<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/looogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光电门测速 - PhySenLab仿真实验</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #E8F4FD 0%, #F8FBFF 50%, #E1EEF7 100%);
            overflow: hidden;
            color: #2C3E50;
            user-select: none;
        }
        .simulation-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #canvas-wrapper {
            position: relative;
            width: 90vw;
            height: 85vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            cursor: grab;
        }
        #canvas-wrapper.dragging { cursor: grabbing; }
        canvas { display: block; border-radius: 12px; }

        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74,144,226,0.15);
            padding: 20px;
            width: 280px;
            z-index: 10;
            pointer-events: none;
        }
        .info-title { font-size: 1.2rem; font-weight: 700; color: #2C3E50; margin-bottom: 10px; }
        .formula-box {
            background: linear-gradient(145deg, #f0f7fd 0%, #fdfeff 40%, #eaf3fb 100%);
            padding: 12px 14px;
            border-radius: 10px;
            border-left: 4px solid #4A90E2;
            margin-bottom: 10px;
            font-size: 0.88rem;
            font-family: 'Times New Roman', 'Georgia', 'STIX Two Math', serif;
        }
        .info-text { font-size: 0.85rem; color: #5A6C7D; line-height: 1.6; }

        .controls-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74,144,226,0.15);
            padding: 20px;
            z-index: 10;
            max-height: 85vh;
            overflow-y: auto;
            pointer-events: auto;
        }
        .controls-panel h3 { font-size: 1rem; color: #2C3E50; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #E1EEF7; }
        .control-group { margin-bottom: 16px; border-bottom: 1px solid #E1EEF7; padding-bottom: 12px; }
        .control-group:last-child { border-bottom: none; }
        .control-group label { display: block; font-size: 0.85rem; color: #5A6C7D; margin-bottom: 6px; }
        .value-display { float: right; color: #4A90E2; font-weight: 600; font-family: monospace; }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #E1EEF7;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4A90E2 0%, #6BB6FF 100%);
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(74,144,226,0.3);
        }
        .btn-primary {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            pointer-events: auto;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(74,144,226,0.3); }
        .btn-secondary {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #f0f4f8;
            color: #5A6C7D;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            pointer-events: auto;
        }
        .btn-secondary:hover { background: #e0e8f0; }

        .data-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: none;
        }
        .data-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid #E1EEF7;
            box-shadow: 0 4px 20px rgba(74,144,226,0.15);
            padding: 12px 20px;
            min-width: 120px;
            text-align: center;
        }
        .data-label { font-size: 0.75rem; color: #8B9DC3; margin-bottom: 4px; }
        .data-value { font-size: 1.3rem; font-weight: 700; color: #4A90E2; font-family: monospace; }

        .back-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 10px 20px;
            background: white;
            border: 2px solid #4A90E2;
            border-radius: 30px;
            color: #4A90E2;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
            text-decoration: none;
            pointer-events: auto;
        }
        .back-btn:hover { background: #4A90E2; color: white; }

        .drag-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        @media (max-width: 900px) {
            .info-panel { display: none; }
            .controls-panel { width: 260px; top: 10px; right: 10px; padding: 14px; max-height: 70vh; }
            .data-panel { gap: 8px; bottom: 10px; }
            .data-card { padding: 8px 12px; min-width: 80px; }
            .data-value { font-size: 1rem; }
            .back-btn { bottom: 10px; left: 10px; padding: 6px 14px; font-size: 0.8rem; }
            .drag-hint { bottom: 70px; font-size: 0.7rem; padding: 4px 12px; }
        }
    </style>
</head>
<body>
<div class="simulation-container">
    <div id="canvas-wrapper">
        <div class="drag-hint">🖱 拖拽小车沿轨道移动</div>
    </div>

    <div class="info-panel">
        <div class="info-title">⚡ 光电门测速实验</div>
        <div class="formula-box">
            v = d / Δt<br />
            a = (v₂ − v₁) / Δt
        </div>
        <p class="info-text">
            挡光片角度：<strong>0°=垂直（最大有效宽度）</strong>，<strong>90°=水平（不挡光）</strong><br />
            有效宽度 = d·cos(角度)。拖拽小车或启动自动运动。
        </p>
    </div>

    <div class="controls-panel">
        <h3>⚙️ 实验参数</h3>
        <div class="control-group">
            <label>显示光束 <input type="checkbox" id="beam-toggle" checked style="accent-color:#4A90E2;" /></label>
        </div>
        <div class="control-group">
            <label>挡光片宽度 d (m) <span class="value-display" id="width-val">0.012</span></label>
            <input type="range" id="width-slider" min="0.004" max="0.06" step="0.001" value="0.012" />
        </div>
        <div class="control-group">
            <label>挡光片旋转角度 (°) <span class="value-display" id="angle-val">0</span></label>
            <input type="range" id="angle-slider" min="0" max="90" step="1" value="0" />
            <div style="font-size:0.7rem;color:#8B9DC3;margin-top:4px;">0°=垂直（最大挡） · 90°=水平（不挡）</div>
        </div>
        <div class="control-group">
            <label>光电门间距 s (m) <span class="value-display" id="dist-val">0.40</span></label>
            <input type="range" id="dist-slider" min="0.15" max="0.8" step="0.01" value="0.40" />
        </div>
        <div class="control-group">
            <label>初速度 v₀ (m/s) <span class="value-display" id="speed-val">1.00</span></label>
            <input type="range" id="speed-slider" min="0.1" max="5.0" step="0.1" value="1.0" />
        </div>
        <div class="control-group">
            <label>加速度 a (m/s²) <span class="value-display" id="acc-val">0.00</span></label>
            <input type="range" id="acc-slider" min="-2.0" max="10.0" step="0.1" value="0.0" />
        </div>
        <button id="start-btn" class="btn-primary">▶ 开始自动运动</button>
        <button id="reset-btn" class="btn-secondary">↺ 复位</button>
    </div>

    <div class="data-panel">
        <div class="data-card"><div class="data-label">Δt₁ (s)</div><div class="data-value" id="t1-val">0.000</div></div>
        <div class="data-card"><div class="data-label">Δt₂ (s)</div><div class="data-value" id="t2-val">0.000</div></div>
        <div class="data-card"><div class="data-label">v₁ (m/s)</div><div class="data-value" id="v1-val">0.00</div></div>
        <div class="data-card"><div class="data-label">v₂ (m/s)</div><div class="data-value" id="v2-val">0.00</div></div>
        <div class="data-card"><div class="data-label">a (m/s²)</div><div class="data-value" id="a-val">0.00</div></div>
    </div>

 	
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- DOM refs ---
const t1Val = document.getElementById('t1-val');
const t2Val = document.getElementById('t2-val');
const v1Val = document.getElementById('v1-val');
const v2Val = document.getElementById('v2-val');
const aVal = document.getElementById('a-val');
const beamToggle = document.getElementById('beam-toggle');
const widthSlider = document.getElementById('width-slider');
const angleSlider = document.getElementById('angle-slider');
const distSlider = document.getElementById('dist-slider');
const speedSlider = document.getElementById('speed-slider');
const accSlider = document.getElementById('acc-slider');
const widthVal = document.getElementById('width-val');
const angleVal = document.getElementById('angle-val');
const distVal = document.getElementById('dist-val');
const speedVal = document.getElementById('speed-val');
const accVal = document.getElementById('acc-val');
const startBtn = document.getElementById('start-btn');
const resetBtn = document.getElementById('reset-btn');
const wrapper = document.getElementById('canvas-wrapper');

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xF8FBFF);

const camera = new THREE.PerspectiveCamera(45, wrapper.clientWidth / wrapper.clientHeight, 0.1, 20);
camera.position.set(1.2, 1.0, 1.5);
camera.lookAt(0.2, 0.1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrapper.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0.2, 0.1, 0);
controls.minDistance = 0.4;
controls.maxDistance = 4.0;

// --- Lights ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(1, 3, 2);
dirLight.castShadow = true;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xE8F4FD, 0.4);
fillLight.position.set(-1, 0.5, -1);
scene.add(fillLight);

// --- Ground grid ---
const gridHelper = new THREE.GridHelper(2, 20, 0xD0DDE8, 0xE8F0F5);
gridHelper.position.y = -0.02;
scene.add(gridHelper);

// --- Track (only narrow rail) ---
const trackGroup = new THREE.Group();
scene.add(trackGroup);

const railGeo = new THREE.BoxGeometry(2.2, 0.04, 0.12);
const railMat = new THREE.MeshStandardMaterial({ color: 0x8B9DC3, roughness: 0.5, metalness: 0.2 });
const rail = new THREE.Mesh(railGeo, railMat);
rail.position.set(0.2, -0.02, 0);
rail.receiveShadow = true;
rail.castShadow = true;
trackGroup.add(rail);

// --- Car ---
const carGroup = new THREE.Group();
trackGroup.add(carGroup);

// body
const bodyGeo = new THREE.BoxGeometry(0.16, 0.05, 0.09);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3A7BD5, roughness: 0.25, metalness: 0.3 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.05;
body.castShadow = true;
carGroup.add(body);

// cab
const cabGeo = new THREE.BoxGeometry(0.055, 0.025, 0.065);
const cabMat = new THREE.MeshStandardMaterial({ color: 0x8FC9FF, roughness: 0.1, metalness: 0.2, transparent: true, opacity: 0.7 });
const cab = new THREE.Mesh(cabGeo, cabMat);
cab.position.set(0.03, 0.08, 0);
cab.castShadow = true;
carGroup.add(cab);

// headlights
const lightMat = new THREE.MeshStandardMaterial({ color: 0xFFEE88, emissive: 0x553311 });
const hl1 = new THREE.Mesh(new THREE.SphereGeometry(0.007, 12, 12), lightMat);
hl1.position.set(0.085, 0.04, 0.025);
carGroup.add(hl1);
const hl2 = new THREE.Mesh(new THREE.SphereGeometry(0.007, 12, 12), lightMat);
hl2.position.set(0.085, 0.04, -0.025);
carGroup.add(hl2);

// rear lights
const rearMat = new THREE.MeshStandardMaterial({ color: 0xFF4444, emissive: 0x441111 });
const rl1 = new THREE.Mesh(new THREE.SphereGeometry(0.006, 10, 10), rearMat);
rl1.position.set(-0.085, 0.04, 0.025);
carGroup.add(rl1);
const rl2 = new THREE.Mesh(new THREE.SphereGeometry(0.006, 10, 10), rearMat);
rl2.position.set(-0.085, 0.04, -0.025);
carGroup.add(rl2);

// wheels
const wheelGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.014, 32);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x2C3E50, roughness: 0.5, metalness: 0.6 });
const wheelPositions = [
    [-0.055, 0.02, 0.045],
    [-0.055, 0.02, -0.045],
    [0.055, 0.02, 0.045],
    [0.055, 0.02, -0.045]
];
wheelPositions.forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.x = Math.PI / 2;
    wheel.position.set(...pos);
    wheel.castShadow = true;
    carGroup.add(wheel);
});

// --- Mask (挡光片) - 宽度沿X轴方向，模型旋转90°实现垂直挡光 ---
const maskGroup = new THREE.Group();
carGroup.add(maskGroup);
maskGroup.position.set(0, 0.095, 0);

const maskBaseWidth = 0.012;
// 将宽度放在X方向，厚度放在Z方向，高度不变
const maskGeo = new THREE.BoxGeometry(maskBaseWidth, 0.08, 0.002);
const maskMat = new THREE.MeshStandardMaterial({
    color: 0xFFD700,
    emissive: 0x664400,
    emissiveIntensity: 0.2,
    metalness: 0.2,
    roughness: 0.3
});
const mask = new THREE.Mesh(maskGeo, maskMat);
mask.castShadow = true;
maskGroup.add(mask);

// --- Photogates (without white base) ---
function buildPhotogate() {
    const group = new THREE.Group();
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x6BB6FF, roughness: 0.4, metalness: 0.3 });
    const frontPillar = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.28, 0.025), pillarMat);
    frontPillar.position.set(0, 0.14, -0.055);
    frontPillar.castShadow = true;
    group.add(frontPillar);
    const backPillar = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.28, 0.025), pillarMat);
    backPillar.position.set(0, 0.14, 0.055);
    backPillar.castShadow = true;
    group.add(backPillar);
    const topBar = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.02, 0.12), pillarMat);
    topBar.position.set(0, 0.28, 0);
    topBar.castShadow = true;
    group.add(topBar);

    const emitterMat = new THREE.MeshStandardMaterial({ color: 0xFF4444, emissive: 0x882222 });
    const emitter = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), emitterMat);
    emitter.position.set(0, 0.10, -0.045);
    group.add(emitter);
    const receiverMat = new THREE.MeshStandardMaterial({ color: 0x44AAFF, emissive: 0x004488 });
    const receiver = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), receiverMat);
    receiver.position.set(0, 0.10, 0.045);
    group.add(receiver);

    const beamMat = new THREE.LineBasicMaterial({ color: 0xFF6666, transparent: true, opacity: 0.4 });
    const beamPoints = [new THREE.Vector3(0, 0.10, -0.04), new THREE.Vector3(0, 0.10, 0.04)];
    const beamGeo = new THREE.BufferGeometry().setFromPoints(beamPoints);
    const beamLine = new THREE.Line(beamGeo, beamMat);
    group.add(beamLine);

    return group;
}

const gateGroup1 = buildPhotogate();
gateGroup1.position.set(-0.2, 0, 0);
trackGroup.add(gateGroup1);

const gateGroup2 = buildPhotogate();
gateGroup2.position.set(0.6, 0, 0);
trackGroup.add(gateGroup2);

const beamLines = [];
gateGroup1.children.forEach(child => { if (child.type === 'Line') beamLines.push(child); });
gateGroup2.children.forEach(child => { if (child.type === 'Line') beamLines.push(child); });

// --- State ---
// angle: 0° = vertical (full block), 90° = horizontal (no block)
const state = {
    pos: -0.55,
    v0: 1.0,
    a: 0.0,
    d: 0.012,
    angle: 0,
    s: 0.40,
    beamVisible: true,
    isMoving: false,
    animTime: 0,
    recordedT1: 0,
    recordedT2: 0,
    hasRecorded1: false,
    hasRecorded2: false,
    v1: 0,
    v2: 0,
    isBlocking1: false,
    isBlocking2: false,
};

// --- Drag state ---
let isDragging = false;
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let dragOffsetX = 0;

// --- Helpers ---
function getEffectiveWidth() {
    // 宽度在X方向，旋转角度后投影到X方向为 d*cos(angle)
    return state.d * Math.cos(state.angle * Math.PI / 180);
}

function resetRecords() {
    state.recordedT1 = 0;
    state.recordedT2 = 0;
    state.hasRecorded1 = false;
    state.hasRecorded2 = false;
    state.v1 = 0;
    state.v2 = 0;
    state.isBlocking1 = false;
    state.isBlocking2 = false;
    t1Val.textContent = '0.000';
    t2Val.textContent = '0.000';
    v1Val.textContent = '0.00';
    v2Val.textContent = '0.00';
    aVal.textContent = state.a.toFixed(2);
}

function updateCarPosition(x) {
    const effectiveWidth = getEffectiveWidth();
    const halfWidth = effectiveWidth / 2;
    const gate1X = -0.2;
    const gate2X = gateGroup2.position.x;
    const v = state.v0 + state.a * state.animTime;
    const vAbs = Math.abs(v);

    if (effectiveWidth > 0.0001 && vAbs > 0.001) {
        const overlap1 = (x > gate1X - halfWidth && x < gate1X + halfWidth);
        if (overlap1 && !state.isBlocking1) {
            state.isBlocking1 = true;
            if (!state.hasRecorded1) {
                state.recordedT1 = effectiveWidth / vAbs;
                state.v1 = v;
                state.hasRecorded1 = true;
            }
        } else if (!overlap1 && state.isBlocking1) {
            state.isBlocking1 = false;
        }

        const overlap2 = (x > gate2X - halfWidth && x < gate2X + halfWidth);
        if (overlap2 && !state.isBlocking2) {
            state.isBlocking2 = true;
            if (!state.hasRecorded2) {
                state.recordedT2 = effectiveWidth / vAbs;
                state.v2 = v;
                state.hasRecorded2 = true;
            }
        } else if (!overlap2 && state.isBlocking2) {
            state.isBlocking2 = false;
        }
    } else {
        state.isBlocking1 = false;
        state.isBlocking2 = false;
    }

    t1Val.textContent = state.hasRecorded1 ? state.recordedT1.toFixed(3) : '0.000';
    t2Val.textContent = state.hasRecorded2 ? state.recordedT2.toFixed(3) : '0.000';
    v1Val.textContent = state.hasRecorded1 ? state.v1.toFixed(2) : '0.00';
    v2Val.textContent = state.hasRecorded2 ? state.v2.toFixed(2) : '0.00';
    aVal.textContent = state.a.toFixed(2);
}

function setCarX(x) {
    const clamped = Math.max(-0.6, Math.min(1.2, x));
    state.pos = clamped;
    carGroup.position.x = clamped;
    updateCarPosition(clamped);
}

function resetToDefault() {
    state.isMoving = false;
    state.animTime = 0;
    startBtn.textContent = '▶ 开始自动运动';
    resetRecords();
    setCarX(-0.55);
}

function updateUI() {
    widthVal.textContent = state.d.toFixed(3);
    angleVal.textContent = state.angle;
    distVal.textContent = state.s.toFixed(2);
    speedVal.textContent = state.v0.toFixed(2);
    accVal.textContent = state.a.toFixed(2);
    widthSlider.value = state.d;
    angleSlider.value = state.angle;
    distSlider.value = state.s;
    speedSlider.value = state.v0;
    accSlider.value = state.a;
    gateGroup2.position.x = state.s - 0.2;
    // 缩放X方向宽度
    const scaleX = state.d / maskBaseWidth;
    mask.scale.x = scaleX;
    // 旋转：角度0垂直，角度90水平
    maskGroup.rotation.y = state.angle * Math.PI / 180;
    beamLines.forEach(line => line.visible = state.beamVisible);
    setCarX(state.pos);
}

// --- UI events ---
widthSlider.addEventListener('input', () => {
    state.d = parseFloat(widthSlider.value);
    widthVal.textContent = state.d.toFixed(3);
    if (!state.isMoving) resetRecords();
    setCarX(state.pos);
});

angleSlider.addEventListener('input', () => {
    state.angle = parseInt(angleSlider.value);
    angleVal.textContent = state.angle;
    maskGroup.rotation.y = state.angle * Math.PI / 180;
    if (!state.isMoving) resetRecords();
    setCarX(state.pos);
});

distSlider.addEventListener('input', () => {
    state.s = parseFloat(distSlider.value);
    distVal.textContent = state.s.toFixed(2);
    gateGroup2.position.x = state.s - 0.2;
    if (!state.isMoving) resetRecords();
    setCarX(state.pos);
});

speedSlider.addEventListener('input', () => {
    state.v0 = parseFloat(speedSlider.value);
    speedVal.textContent = state.v0.toFixed(2);
    if (!state.isMoving) {
        resetRecords();
        setCarX(state.pos);
    }
});

accSlider.addEventListener('input', () => {
    state.a = parseFloat(accSlider.value);
    accVal.textContent = state.a.toFixed(2);
    if (!state.isMoving) {
        resetRecords();
        setCarX(state.pos);
    }
});

beamToggle.addEventListener('change', () => {
    state.beamVisible = beamToggle.checked;
    beamLines.forEach(line => line.visible = state.beamVisible);
});

resetBtn.addEventListener('click', resetToDefault);

startBtn.addEventListener('click', () => {
    if (state.isMoving) {
        state.isMoving = false;
        startBtn.textContent = '▶ 继续';
    } else {
        if (state.pos > 1.1) resetToDefault();
        resetRecords();
        state.isMoving = true;
        startBtn.textContent = '⏸ 暂停';
        if (isDragging) {
            isDragging = false;
            wrapper.classList.remove('dragging');
            controls.enabled = true;
        }
    }
});

// --- Drag logic ---
function getPointerNDC(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    return {
        x: ((event.clientX - rect.left) / rect.width) * 2 - 1,
        y: -((event.clientY - rect.top) / rect.height) * 2 + 1
    };
}

function getPlaneIntersect(event) {
    const ndc = getPointerNDC(event);
    pointer.set(ndc.x, ndc.y);
    raycaster.setFromCamera(pointer, camera);
    const target = new THREE.Vector3();
    const hit = raycaster.ray.intersectPlane(dragPlane, target);
    return hit ? target : null;
}

function isHitCar(event) {
    const ndc = getPointerNDC(event);
    pointer.set(ndc.x, ndc.y);
    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObjects(carGroup.children, true);
    return intersects.length > 0;
}

function onPointerDown(event) {
    if (event.button !== 0) return;
    if (event.target.closest('.controls-panel') || event.target.closest('.back-btn')) return;
    if (isHitCar(event)) {
        const hit = getPlaneIntersect(event);
        if (hit) {
            isDragging = true;
            wrapper.classList.add('dragging');
            controls.enabled = false;
            dragOffsetX = carGroup.position.x - hit.x;
            if (state.isMoving) {
                state.isMoving = false;
                startBtn.textContent = '▶ 开始自动运动';
            }
            resetRecords();
        }
    }
}

function onPointerMove(event) {
    if (!isDragging) return;
    const hit = getPlaneIntersect(event);
    if (hit) {
        let newX = hit.x + dragOffsetX;
        newX = Math.max(-0.6, Math.min(1.2, newX));
        state.pos = newX;
        carGroup.position.x = newX;
        updateCarPosition(newX);
    }
}

function onPointerUp(event) {
    if (isDragging) {
        isDragging = false;
        wrapper.classList.remove('dragging');
        controls.enabled = true;
    }
}

const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointerleave', onPointerUp);

// --- Resize ---
window.addEventListener('resize', () => {
    const w = wrapper.clientWidth;
    const h = wrapper.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

// --- Animation ---
let clock = new THREE.Clock();

function animate() {
    const delta = clock.getDelta();
    if (state.isMoving) {
        state.animTime += delta;
        const xStart = -0.55;
        const v0 = state.v0;
        const a = state.a;
        const x = xStart + v0 * state.animTime + 0.5 * a * state.animTime * state.animTime;
        state.pos = x;
        if (state.pos > 1.2) {
            state.isMoving = false;
            startBtn.textContent = '▶ 开始自动运动';
            state.pos = 1.2;
        } else if (state.pos < -0.6) {
            state.isMoving = false;
            startBtn.textContent = '▶ 开始自动运动';
            state.pos = -0.6;
        }
        carGroup.position.x = state.pos;
        updateCarPosition(state.pos);
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

// --- Init ---
updateUI();
animate();

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') { resetToDefault(); e.preventDefault(); }
    if (e.key === ' ' || e.key === 'Space') { startBtn.click(); e.preventDefault(); }
});

console.log('🖱 拖拽小车 · R键复位 · 空格键启停');
console.log('挡光片角度: 0°=垂直(最大挡), 90°=水平(不挡)');
</script>
