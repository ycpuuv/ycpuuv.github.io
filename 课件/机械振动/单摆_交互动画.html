 <head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单摆3D动画演示（修正速度-时间图像）</title>

  <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #1a237e, #283593);
            color: white;

            width: 100%;
            height: 100vh;
        }
        #info-panel {

            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;

            max-width: 320px;

            z-index: 100;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 100;
            flex-wrap: wrap;
            padding: 0 20px;
        }
        .control-group {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
            backdrop-filter: blur(5px);

            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        input[type="range"] {
            width: 100%;
        }
        button {
            padding: 10px 15px;
            background: #0077ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        button:hover {
            background: #0055cc;
            transform: translateY(-2px);
        }
        h1, h3 {
            margin: 0 0 10px 0;
            color: #4fc3f7;
        }
        .value {
            color: #4fc3f7;
            font-weight: bold;
        }
        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            max-width: 250px;
            font-size: 14px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        #coordinate-display {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        #velocity-chart-container {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 25px;
            border-radius: 12px;
            width: 650px;
            height: 450px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            border: 2px solid rgba(79, 195, 247, 0.4);
        }
        #velocity-chart {
            width: 100%;
            height: 100%;
        }
        .chart-title {
            text-align: center;
            margin-bottom: 15px;
            color: #4fc3f7;
            font-size: 20px;
            font-weight: bold;
        }
        .chart-subtitle {
            text-align: center;
            margin-bottom: 20px;
            color: #aaa;
            font-size: 14px;
        }
        .time-markers {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: rgba(79, 195, 247, 0.8);
            font-size: 12px;
        }
        .y-axis-label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            color: #4fc3f7;
            font-size: 16px;
            font-weight: bold;
        }
    </style>

 <body>
  <div id="container"></div>
  <div id="info-panel">
   <h1>单摆3D动画演示</h1>
   <p>节点位置: <span class="value">(0, 4, 0)</span></p>
   <p>周期: <span id="period" class="value">0.00</span> 秒</p>
   <p>当前角度: <span id="angle" class="value">0.00</span>°</p>
   <p>摆长: <span id="length-value" class="value">10.0</span> 单位</p>
   <p>重力加速度: <span id="gravity-value" class="value">9.8</span> m/s²</p>
   <p>摆动次数: <span id="swing-count" class="value">0</span></p>
   <p>当前速度: <span id="velocity-value" class="value">0.00</span> m/s</p>
  </div>
  <div id="instructions">
   <h3>操作指南</h3>
   <p>• 鼠标拖动: 旋转视角</p>
   <p>• 鼠标滚轮: 缩放</p>
   <p>• 右键拖动: 平移视角</p>
   <p>• 使用下方控制面板调整参数</p>
  </div>
  <div id="coordinate-display">
   <h3>坐标显示</h3>
   <p>节点: <span class="value">(0, 4, 0)</span></p>
   <p>摆锤: <span id="bob-position" class="value">(0, -6, 0)<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABsAAAAWCAIAAAC+KHDcAAAAgElEQVR42u1TQQ6AMAjr/x9tzW4TCwU9akMWdaO2A8CFY1vl6/15/3gBWCHkywi7i9GcKOmC9hVILNPRpUBu5CGQ3F3TshAOlcZGHbxrDrWkKUFjXy+bjLLJR10Va11XuXUnKHvN2mSHkcP6xP9h2IZyumhd+1Ebzcxb/IzfYTwBLaruZnqwHp4AAAAASUVORK5CYII=" style="position: absolute; left: -99999px; top: -99999px; opacity: 0; pointer-events: none; width: 1px; height: 1px;"></span></p>
  </div>
  <div id="velocity-chart-container">
   <h3 class="chart-title">速度-时间图像</h3>
   <p class="chart-subtitle">显示单摆速度随时间的变化规律（完整显示正负速度）</p>
   <canvas id="velocity-chart"></canvas>
   <div class="time-markers">
    <span>0s</span> <span id="time-marker-1">2s</span> <span id="time-marker-2">4s</span> <span id="time-marker-3">6s</span> <span id="time-marker-4">8s</span> <span id="time-marker-5">10s</span>
   </div>
  </div>
  <div id="controls">
   <div class="control-group">
    <h3>单摆参数</h3>
    <div class="slider-container">
     <label for="length">摆长: <span id="length-display">10.0</span></label> <input type="range" id="length" min="5" max="20" value="10" step="0.5">
    </div>
    <div class="slider-container">
     <label for="amplitude">初始角度: <span id="amplitude-display">30</span>°</label> <input type="range" id="amplitude" min="5" max="60" value="30" step="1">
    </div>
    <div class="slider-container">
     <label for="gravity">重力: <span id="gravity-display">9.8</span> m/s²</label> <input type="range" id="gravity" min="1" max="20" value="9.8" step="0.1">
    </div>
   </div>
   <div class="control-group">
    <h3>控制</h3><button id="reset">重置单摆</button> <button id="pause">暂停/继续</button> <button id="change-plane">改变摆动平面</button> <button id="toggle-trail">显示轨迹</button> <button id="toggle-chart">隐藏速度图像</button>
   </div>
  </div>
  <script>
        // 初始化场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050a30);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('container').appendChild(renderer.domElement);
        
        // 添加轨道控制器
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 添加光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 15);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);
        
        // 创建坐标系
        const axesHelper = new THREE.AxesHelper(10);
        scene.add(axesHelper);
        
        // 创建网格地面
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        gridHelper.position.y = -10;
        scene.add(gridHelper);
        
        // 单摆参数
        const pivotPosition = new THREE.Vector3(0, 4, 0); // 节点位置
        let pendulumLength = 10;
        let amplitude = 30; // 角度
        let gravity = 9.8;
        let isPaused = false;
        let time = 0;
        let swingCount = 0;
        let lastDirection = 0;
        let showTrail = false;
        let showChart = true;
        let trailPoints = [];
        let trail;
        let swingPlane = 'XY'; // 默认在XY平面摆动
        
        // 创建单摆组
        const pendulumGroup = new THREE.Group();
        pendulumGroup.position.copy(pivotPosition);
        scene.add(pendulumGroup);
        
        // 创建固定点（节点）
        const pivotGeometry = new THREE.SphereGeometry(0.3, 16, 16);
        const pivotMaterial = new THREE.MeshPhongMaterial({ color: 0xff4444 });
        const pivot = new THREE.Mesh(pivotGeometry, pivotMaterial);
        pendulumGroup.add(pivot);
        
        // 创建摆线
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
        let lineGeometry = new THREE.BufferGeometry();
        const line = new THREE.Line(lineGeometry, lineMaterial);
        pendulumGroup.add(line);
        
        // 创建摆锤 - 减小体积
        const bobGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const bobMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x4fc3f7,
            shininess: 100
        });
        const bob = new THREE.Mesh(bobGeometry, bobMaterial);
        bob.castShadow = true;
        pendulumGroup.add(bob);
        
        // 创建轨迹线
        const trailGeometry = new THREE.BufferGeometry();
        const trailMaterial = new THREE.LineBasicMaterial({ 
            color: 0xffaa00,
            transparent: true,
            opacity: 0.7
        });
        trail = new THREE.Line(trailGeometry, trailMaterial);
        scene.add(trail);
        
        // 速度图表相关
        const velocityChartCanvas = document.getElementById('velocity-chart');
        const velocityChartCtx = velocityChartCanvas.getContext('2d');
        let velocityData = [];
        const maxDataPoints = 600; // 最多显示的数据点数量（10秒数据）
        const timeWindow = 10; // 显示的时间窗口（秒）
        
        // 初始化速度图表
        function initVelocityChart() {
            velocityChartCanvas.width = velocityChartCanvas.clientWidth;
            velocityChartCanvas.height = velocityChartCanvas.clientHeight;
            drawVelocityChart();
        }
        
        // 绘制速度图表
        function drawVelocityChart() {
            const ctx = velocityChartCtx;
            const width = velocityChartCanvas.width;
            const height = velocityChartCanvas.height;
            
            // 清除画布
            ctx.clearRect(0, 0, width, height);
            
            // 绘制背景
            ctx.fillStyle = 'rgba(15, 15, 35, 0.9)';
            ctx.fillRect(0, 0, width, height);
            
            // 绘制边框
            ctx.strokeStyle = 'rgba(79, 195, 247, 0.6)';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, width, height);
            
            // 绘制坐标轴
            ctx.strokeStyle = '#4fc3f7';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(80, 40);
            ctx.lineTo(80, height - 50);
            ctx.lineTo(width - 40, height - 50);
            ctx.stroke();
            
            // 绘制坐标轴标签
            ctx.fillStyle = '#4fc3f7';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('时间 (s)', width / 2 - 20, height - 15);
            
            // 如果没有数据，直接返回
            if (velocityData.length < 2) return;
            
            // 计算速度范围（确保正负对称）
            let maxVelocity = 0;
            for (let i = 0; i < velocityData.length; i++) {
                if (Math.abs(velocityData[i].velocity) > maxVelocity) {
                    maxVelocity = Math.abs(velocityData[i].velocity);
                }
            }
            
            // 添加一些余量，确保完整显示正负速度
            maxVelocity = Math.max(maxVelocity, 0.1) * 1.3;
            
            // 计算时间范围
            const currentTime = velocityData[velocityData.length - 1].time;
            const minTime = Math.max(0, currentTime - timeWindow);
            const timeRange = timeWindow;
            
            // 绘制网格
            ctx.strokeStyle = 'rgba(79, 195, 247, 0.4)';
            ctx.lineWidth = 1.2;
            
            // 水平网格线（完整显示正负值）
            for (let i = -4; i <= 4; i++) {
                const y = 40 + (height - 90) / 2 - (i / 4) * ((height - 90) / 2);
                ctx.beginPath();
                ctx.moveTo(80, y);
                ctx.lineTo(width - 40, y);
                ctx.stroke();
                
                // Y轴数字标签
                ctx.fillStyle = 'rgba(79, 195, 247, 0.9)';
                ctx.font = '14px Arial';
                const velocityValue = (i * maxVelocity / 4).toFixed(1);
                ctx.fillText(velocityValue, 60, y + 4);
            }
            
            // 垂直网格线（时间轴）
            for (let i = 0; i <= 10; i++) {
                const x = 80 + (i / 10) * (width - 120);
                ctx.beginPath();
                ctx.moveTo(x, 40);
                ctx.lineTo(x, height - 50);
                ctx.stroke();
                
                // 时间标签
                ctx.fillStyle = 'rgba(79, 195, 247, 0.9)';
                ctx.font = '14px Arial';
                ctx.fillText(i.toString(), x - 5, height - 30);
            }
            
            // 绘制Y轴标签（速度文字）
            ctx.fillStyle = '#4fc3f7';
            ctx.font = 'bold 16px Arial';
            ctx.save();
            ctx.translate(30, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('速度 (m/s)', 0, 0);
            ctx.restore();
            
            // 绘制速度曲线
            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            
            for (let i = 0; i < velocityData.length; i++) {
                const x = 80 + ((velocityData[i].time - minTime) / timeRange) * (width - 120);
                // 计算y坐标，确保正负速度都能显示
                const y = 40 + (height - 90) / 2 - (velocityData[i].velocity / maxVelocity) * ((height - 90) / 2);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.stroke();
            
            // 绘制零速度线（更粗更明显）
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            const zeroY = 40 + (height - 90) / 2;
            ctx.moveTo(80, zeroY);
            ctx.lineTo(width - 40, zeroY);
            ctx.stroke();
            
            // 绘制当前时间标记线
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            const currentX = 80 + ((currentTime - minTime) / timeRange) * (width - 120);
            ctx.moveTo(currentX, 40);
            ctx.lineTo(currentX, height - 50);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 更新时间标记
            updateTimeMarkers(currentTime);
        }
        
        // 更新时间标记
        function updateTimeMarkers(currentTime) {
            const markers = [
                document.getElementById('time-marker-1'),
                document.getElementById('time-marker-2'),
                document.getElementById('time-marker-3'),
                document.getElementById('time-marker-4'),
                document.getElementById('time-marker-5')
            ];
            
            for (let i = 0; i < markers.length; i++) {
                const markerTime = currentTime - (timeWindow - (i + 1) * 2);
                if (markerTime >= 0) {
                    markers[i].textContent = markerTime.toFixed(1) + 's';
                } else {
                    markers[i].textContent = ((i + 1) * 2) + 's';
                }
            }
        }
        
        // 更新单摆位置
        function updatePendulum() {
            if (isPaused) return;
            
            // 计算角度 (简谐运动近似)
            const angularFrequency = Math.sqrt(gravity / pendulumLength);
            const angle = amplitude * Math.PI / 180 * Math.cos(angularFrequency * time);
            const angularVelocity = -amplitude * Math.PI / 180 * angularFrequency * Math.sin(angularFrequency * time);
            const velocity = angularVelocity * pendulumLength; // 带方向的速度
            
            // 更新显示信息
            document.getElementById('angle').textContent = (angle * 180 / Math.PI).toFixed(2);
            document.getElementById('period').textContent = (2 * Math.PI / angularFrequency).toFixed(2);
            document.getElementById('velocity-value').textContent = velocity.toFixed(2);
            
            // 检测摆动次数
            const currentDirection = Math.sign(angle);
            if (currentDirection !== lastDirection && lastDirection !== 0) {
                swingCount++;
                document.getElementById('swing-count').textContent = swingCount;
            }
            lastDirection = currentDirection;
            
            // 根据摆动平面计算位置
            let x, y, z;
            if (swingPlane === 'XY') {
                x = pendulumLength * Math.sin(angle);
                y = -pendulumLength * Math.cos(angle);
                z = 0;
            } else if (swingPlane === 'XZ') {
                x = pendulumLength * Math.sin(angle);
                y = 0;
                z = -pendulumLength * Math.cos(angle);
            } else { // YZ平面
                x = 0;
                y = -pendulumLength * Math.cos(angle);
                z = pendulumLength * Math.sin(angle);
            }
            
            // 更新摆锤位置
            bob.position.set(x, y, z);
            
            // 更新摆线
            const positions = new Float32Array([
                0, 0, 0,  // 节点位置
                x, y, z   // 摆锤位置
            ]);
            lineGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            lineGeometry.attributes.position.needsUpdate = true;
            
            // 更新摆锤坐标显示
            const bobWorldPosition = new THREE.Vector3();
            bob.getWorldPosition(bobWorldPosition);
            document.getElementById('bob-position').textContent = 
                `(${bobWorldPosition.x.toFixed(1)}, ${bobWorldPosition.y.toFixed(1)}, ${bobWorldPosition.z.toFixed(1)})`;
            
            // 更新轨迹
            if (showTrail) {
                trailPoints.push(bobWorldPosition.clone());
                if (trailPoints.length > 100) {
                    trailPoints.shift();
                }
                
                const trailPositions = new Float32Array(trailPoints.length * 3);
                trailPoints.forEach((point, i) => {
                    trailPositions[i * 3] = point.x;
                    trailPositions[i * 3 + 1] = point.y;
                    trailPositions[i * 3 + 2] = point.z;
                });
                
                trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
                trailGeometry.attributes.position.needsUpdate = true;
            }
            
            // 更新速度数据
            velocityData.push({
                time: time,
                velocity: velocity // 带方向的速度
            });
            
            // 限制数据点数量
            if (velocityData.length > maxDataPoints) {
                velocityData.shift();
            }
            
            // 更新速度图表
            if (showChart) {
                drawVelocityChart();
            }
            
            time += 0.016; // 假设60fps
        }
        
        // 初始化单摆
        updatePendulum();
        
        // 设置控件事件
        document.getElementById('length').addEventListener('input', function(e) {
            pendulumLength = parseFloat(e.target.value);
            document.getElementById('length-display').textContent = pendulumLength.toFixed(1);
            document.getElementById('length-value').textContent = pendulumLength.toFixed(1);
            resetPendulum();
        });
        
        document.getElementById('amplitude').addEventListener('input', function(e) {
            amplitude = parseFloat(e.target.value);
            document.getElementById('amplitude-display').textContent = amplitude;
            resetPendulum();
        });
        
        document.getElementById('gravity').addEventListener('input', function(e) {
            gravity = parseFloat(e.target.value);
            document.getElementById('gravity-display').textContent = gravity.toFixed(1);
            document.getElementById('gravity-value').textContent = gravity.toFixed(1);
            resetPendulum();
        });
        
        document.getElementById('reset').addEventListener('click', resetPendulum);
        
        document.getElementById('pause').addEventListener('click', function() {
            isPaused = !isPaused;
            this.textContent = isPaused ? '继续' : '暂停';
        });
        
        document.getElementById('change-plane').addEventListener('click', function() {
            if (swingPlane === 'XY') {
                swingPlane = 'XZ';
            } else if (swingPlane === 'XZ') {
                swingPlane = 'YZ';
            } else {
                swingPlane = 'XY';
            }
            resetPendulum();
        });
        
        document.getElementById('toggle-trail').addEventListener('click', function() {
            showTrail = !showTrail;
            trail.visible = showTrail;
            this.textContent = showTrail ? '隐藏轨迹' : '显示轨迹';
            if (!showTrail) {
                trailPoints = [];
            }
        });
        
        document.getElementById('toggle-chart').addEventListener('click', function() {
            showChart = !showChart;
            document.getElementById('velocity-chart-container').style.display = showChart ? 'block' : 'none';
            this.textContent = showChart ? '隐藏速度图像' : '显示速度图像';
        });
        
        // 重置单摆
        function resetPendulum() {
            time = 0;
            swingCount = 0;
            lastDirection = 0;
            trailPoints = [];
            velocityData = [];
            document.getElementById('swing-count').textContent = '0';
            updatePendulum();
        }
        
        // 处理窗口大小变化
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            initVelocityChart();
        });
        
        // 初始化速度图表
        initVelocityChart();
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updatePendulum();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
 </body>
</html>
