<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>人生规划 · 启明</title><style>body{font-family:'Inter','Noto Serif SC','PingFang SC','Microsoft YaHei',sans-serif;background:#0b0b14;color:#d4d4dc;min-height:100vh;background-image:radial-gradient(ellipse at 15% 0%,rgba(212,163,115,.04) 0%,transparent 55%),radial-gradient(ellipse at 85% 100%,rgba(92,141,137,.03) 0%,transparent 50%)}
.back{display:inline-flex;align-items:center;gap:6px;color:#5c5c72;text-decoration:none;font-size:.72em;padding:6px 0;transition:.2s;margin-bottom:4px}.back:hover{color:#d4a373;gap:10px}
.container{max-width:520px;margin:0 auto;padding:32px 18px 50px}
h1{font-size:1.15em;font-weight:600;margin-bottom:14px;color:#c8c8d0;letter-spacing:1px;padding-left:2px}
h1 .count{font-size:.6em;font-weight:400;color:#5c5c72;margin-left:6px}
.sec{margin-bottom:6px}.sec-title{font-size:.7em;color:#5c5c72;margin:12px 0 4px 4px;letter-spacing:1px;display:flex;align-items:center;gap:5px}
.sec-title::before{content:'';width:3px;height:3px;background:#d4a373;border-radius:50%;display:inline-block}
.card{display:flex;align-items:center;gap:12px;background:#0e0e1e;border-radius:6px;padding:12px 14px;border:1px solid #18182a;text-decoration:none;color:inherit;transition:all .2s;margin-bottom:5px}
.card:hover{background:#131328;border-color:#2a2a48;transform:translateX(3px)}
.card .icon{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.85em;flex-shrink:0;background:rgba(212,163,115,.08)}
.card .info{flex:1;min-width:0}
.card .info .name{font-size:.8em;color:#c8c8d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .info .desc{font-size:.64em;color:#4a4a60;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .arrow{color:#2a2a40;font-size:.65em;transition:.2s;flex-shrink:0}
.card:hover .arrow{color:#d4a373;transform:translateX(3px)}
.card .tag{font-size:.6em;padding:1px 6px;border-radius:5px;background:rgba(212,163,115,.1);color:#a08060;flex-shrink:0;letter-spacing:.5px}
.placeholder{display:flex;align-items:center;gap:12px;background:#0e0e1e;border-radius:6px;padding:12px 14px;border:1px dashed #1a1a2e;margin-bottom:5px}
.placeholder .icon{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.85em;flex-shrink:0;background:rgba(255,255,255,.03);color:#3a3a50}
.placeholder .info .name{font-size:.8em;color:#3a3a50}
.placeholder .info .desc{font-size:.64em;color:#2a2a40;margin-top:1px}
footer{text-align:center;padding:20px;color:#1e1e30;font-size:.6em;letter-spacing:1px}
