<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>高一英语闪卡 · 人教版</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#131a23; --line:#243040;
    --txt:#e8eef6; --dim:#8b9bb0;
    --green:#3ddc84; --yellow:#ffcf5c; --red:#ff6b6b; --blue:#5eb0ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#16223a 0%,var(--bg) 55%);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;
    min-height:100dvh;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
    user-select:none;
  }
  header{flex:0 0 auto}
  h1{font-size:19px;margin:0 0 8px;font-weight:700;letter-spacing:.5px}
  h1 small{font-size:12px;color:var(--dim);font-weight:400;margin-left:6px}
  .filters{display:flex;gap:8px;margin-bottom:8px}
  select{
    flex:1;background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;font-size:14px;appearance:none;
  }
  .bar{height:4px;background:#1d2734;border-radius:3px;overflow:hidden;margin:2px 0 10px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .25s}
  .stats{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:10px}
  .stats b{color:var(--txt);font-weight:600}

  .card{
    flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;
    background:linear-gradient(170deg,#18222f,#111823);
    border:1px solid var(--line);border-radius:20px;
    padding:22px 18px;min-height:44vh;position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:transform .12s;
  }
  .card:active{transform:scale(.995)}
  .word{font-size:clamp(30px,9vw,44px);font-weight:700;letter-spacing:.5px;text-align:center;line-height:1.2;word-break:break-word}
  .hint{margin-top:12px;font-size:13px;color:var(--dim)}
  .back{display:none;width:100%;text-align:left}
  .back.on{display:block}
  .front.off{display:none}
  .mean{font-size:17px;line-height:1.65;color:#d6e2f0;max-height:34vh;overflow:auto}
  .mean div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
  .mean div:last-child{border:0}
  .en2{font-size:24px;font-weight:700;margin-bottom:10px;color:#fff}
  .speak{
    position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;
    border:1px solid var(--line);background:#1b2634;color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .speak:active{background:#24354a}

  .actions{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
  .actions button{
    padding:15px 6px;border-radius:14px;border:1px solid transparent;font-size:15px;font-weight:600;
    color:#08110c;background:var(--green);
  }
  .actions button:nth-child(1){background:var(--red);color:#1a0505}
  .actions button:nth-child(2){background:var(--yellow);color:#231a00}
  .actions button:nth-child(3){background:var(--green);color:#04150b}
  .actions button:disabled{opacity:.35}
  .tag{font-size:11px;display:block;font-weight:400;opacity:.75;margin-top:2px}
  .foot{flex:0 0 auto;text-align:center;font-size:11px;color:#5d6b7d;margin-top:8px}
  .empty{font-size:16px;color:var(--dim);text-align:center;line-height:1.8}
</style>
</head>
<body>
<header>
  <h1>高一英语闪卡<small>人教版 · 必修一至三</small></h1>
  <div class="filters">
    <select id="book"></select>
    <select id="unit"></select>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="stats">
    <span>本组 <b id="pos">0/0</b></span>
    <span>待复习 <b id="due">0</b></span>
    <span>累计 <b id="seen">0</b> 词</span>
  </div>
</header>

<div class="card" id="card">
  <button class="speak" id="speak" title="发音">🔊</button>
  <div class="front" id="front">
    <div class="word" id="word">—</div>
    <div class="hint">点一下看释义</div>
  </div>
  <div class="back" id="back">
    <div class="en2" id="en2"></div>
    <div class="mean" id="mean"></div>
  </div>
</div>

<div class="actions">
  <button data-q="0">不认识<span class="tag">马上再来</span></button>
  <button data-q="1">模糊<span class="tag">明天再看</span></button>
  <button data-q="2">认识<span class="tag">拉长间隔</span></button>
</div>
<div class="foot">数据：人教版新教材必修 1—3 词汇表 · 进度存在本机</div>

,"m":["n. （男装）裁缝vt.专门制作；定做"]},{"b":2,"u":"Unit 5","e":"clerk","m":["n. 职员；文书；店员"]},{"b":2,"u":"Unit 5","e":"manner","m":["n. 举止；行为方式；方法； pl.礼貌；礼仪"]},{"b":2,"u":"Unit 5","e":"in a…manner","m":["短语 以一种……的方式；带着一副……的样子"]},{"b":2,"u":"Unit 5","e":"downstairs","m":["adv. 顺楼梯而下；在楼下；往楼下"]},{"b":2,"u":"Unit 5","e":"stair","m":["n. 楼梯；梯级"]},{"b":2,"u":"Unit 5","e":"aside","m":["adv. 到旁边；在旁边；留；存"]},{"b":2,"u":"Unit 5","e":"frown","m":["n. & vi. 皱眉"]},{"b":2,"u":"Unit 5","e":"in that case","m":["短语 既然那样；假使那样的话"]},{"b":2,"u":"Unit 5","e":"option","m":["n. 可选择的事物；选择；选择权"]},{"b":2,"u":"Unit 5","e":"broad","m":["adj. 宽阔的；广阔的；广泛的"]},{"b":2,"u":"Unit 5","e":"indeed","m":["adv. 其实；实际上；当然；确实"]},{"b":2,"u":"Unit 5","e":"normal","m":["adj. 典型的；正常的；一般的；精神正常的n常态；通常标准；一般水平"]},{"b":2,"u":"Unit 5","e":"willing","m":["adj. 愿意；乐意"]},{"b":2,"u":"Unit 5","e":"be willing to do sth","m":["短语 愿意或乐意做莫事"]},{"b":2,"u":"Unit 5","e":"element","m":["n. 要素；基本部分"]},{"b":2,"u":"Unit 5","e":"plot","m":["n. 故事情节；布局；阴谋"]},{"b":2,"u":"Unit 5","e":"ambassador","m":["n. 大使；使节；代表"]},{"b":2,"u":"Unit 5","e":"upper-class","m":["adj. 上流社会的；上等阶层的"]},{"b":2,"u":"Unit 5","e":"upper","m":["adj. 上流的；上层的；靠上部的"]},{"b":2,"u":"Unit 5","e":"the upper class","m":["短语 上流社会；上等阶层"]},{"b":2,"u":"Unit 5","e":"maintain","m":["vt. 维持；保持；维修；保养"]},{"b":2,"u":"Unit 5","e":"permission","m":["n. 准许；续课；批准；许可证"]},{"b":2,"u":"Unit 5","e":"permit","m":["vt. & vi. 允许；准许；使有可能"]},{"b":2,"u":"Unit 5","e":"saying","m":["n. 谚语；格言；警句"]},{"b":2,"u":"Unit 5","e":"external","m":["adj. 外部的；外面的；外来的"]},{"b":2,"u":"Unit 5","e":"Roderick","m":["专有名词 罗德里克"]},{"b":2,"u":"Unit 5","e":"Oliver","m":["专有名词 奥利弗"]},{"b":2,"u":"Unit 5","e":"Henry Adams","m":["专有名词 亨利 亚当斯"]},{"b":2,"u":"Unit 5","e":"The Phantom of the Opera","m":["专有名词 《歌剧魅影》（音乐剧）"]},{"b":2,"u":"Unit 5","e":"Reid","m":["专有名词 里德"]},{"b":2,"u":"Unit 5","e":"Todd","m":["专有名词 托德"]},{"b":2,"u":"Unit 5","e":"Portia Langham","m":["专有名词 波西亚 兰厄姆"]}];
const BOOKS = ['必修一','必修二','必修三'];
const KEY = 'pep_g1_cards_v1';
const DAY = 86400000;

let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ store = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} };

const today = () => Math.floor(Date.now() / DAY);

let queue = [], idx = 0, flipped = false, cur = null;

const $ = id => document.getElementById(id);

// ---- 初始化下拉
const bookSel = $('book'), unitSel = $('unit');
bookSel.innerHTML = '<option value="-1">全部（必修一至三）</option>' +
  BOOKS.map((b,i)=>`<option value="${i}">${b}</option>`).join('');

function unitsFor(book){
  const out = [];
  WORDS.forEach(w => {
    if (book < 0 || w.b === book){
      const item = { b: w.b, u: w.u };
      if (!out.some(o => o.b === item.b && o.u === item.u)) out.push(item);
    }
  });
  return out;
}
function fillUnits(){
  const b = +bookSel.value;
  const us = unitsFor(b);
  unitSel.innerHTML = '<option value="">全部单元</option>' +
    us.map(o => `<option value="${o.b}|${o.u}">${b < 0 ? BOOKS[o.b] + ' · ' : ''}${o.u}</option>`).join('');
}

// ---- 取题
function pick(){
  const b = +bookSel.value;
  const uv = unitSel.value;
  const ub = uv ? +uv.split('|')[0] : -1;
  const uu = uv ? uv.split('|')[1] : '';
  let pool = WORDS.filter(w => (b < 0 || w.b === b) && (!uv || (w.b === ub && w.u === uu)));
  const t = today();
  const due = pool.filter(w => { const s = store[w.e]; return s && s.due <= t; });
  const fresh = pool.filter(w => !store[w.e]);
  // 到期优先，其次新词，各按原顺序
  queue = due.concat(fresh).slice(0, 60);
  if (!queue.length) queue = pool.slice(0, 40); // 全学完了就再来一轮
  idx = 0;
  render();
}

function keyOf(w){ return w.e.toLowerCase(); }

function render(){
  flipped = false;
  $('front').classList.add('front'); $('front').classList.remove('off');
  $('back').classList.remove('on');
  if (!queue.length){
    $('word').textContent = '这组学完了';
    $('mean').innerHTML = '<div class="empty">换个单元，或者明天再来。</div>';
    $('pos').textContent = '0/0';
    return;
  }
  cur = queue[Math.min(idx, queue.length-1)];
  $('word').textContent = cur.e;
  $('en2').textContent = cur.e;
  $('mean').innerHTML = cur.m.map(m=>`<div>${m}</div>`).join('');
  const total = queue.length;
  $('pos').textContent = `${Math.min(idx+1,total)}/${total}`;
  $('bar').style.width = (total? (idx/total*100):0) + '%';
  refreshStats();
}

function refreshStats(){
  const t = today();
  const b = +bookSel.value;
  const uv = unitSel.value;
  const ub = uv ? +uv.split('|')[0] : -1;
  const uu = uv ? uv.split('|')[1] : '';
  const pool = WORDS.filter(w => (b < 0 || w.b === b) && (!uv || (w.b === ub && w.u === uu)));
  const due = pool.filter(w => { const s = store[w.e]; return s && s.due <= t; }).length;
  const seen = Object.keys(store).length;
  $('due').textContent = due;
  $('seen').textContent = seen;
}

// ---- 翻面
$('card').addEventListener('click', e => {
  if (e.target.id === 'speak') return;
  if (!cur || !queue.length) return;
  flipped = !flipped;
  $('front').classList.toggle('off', flipped);
  $('back').classList.toggle('on', flipped);
});

// ---- 发音
function speak(text){
  try{
    if (!('speechSynthesis' in window)) { alert('这个浏览器不支持朗读，用别的浏览器试试'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.88; u.pitch = 1;
    const vs = window.speechSynthesis.getVoices();
    const en = vs.find(v=>/en-US|en_US|Samantha|Google US English/i.test(v.lang+v.name)) || vs.find(v=>/^en/i.test(v.lang));
    if (en) u.voice = en;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
$('speak').addEventListener('click', e => { e.stopPropagation(); if (cur) speak(cur.e); });
if ('speechSynthesis' in window) { try{ window.speechSynthesis.getVoices(); }catch(e){} }

// ---- 评分（SM-2 简版）
function grade(q){
  if (!cur || !queue.length) return;
  const k = cur.e;
  const t = today();
  let s = store[k] || { ease: 2.5, iv: 0, due: t, reps: 0 };
  if (q === 2){
    s.reps += 1;
    s.iv = s.iv ? Math.min(180, Math.round(s.iv * s.ease)) : 2;
    s.ease = Math.min(3.0, s.ease + 0.06);
  } else if (q === 1){
    s.reps += 1;
    s.iv = s.iv ? Math.max(1, Math.round(s.iv * 0.6)) : 1;
    s.ease = Math.max(1.3, s.ease - 0.12);
  } else {
    s.reps = 0; s.iv = 1;
    s.ease = Math.max(1.3, s.ease - 0.18);
    queue.push(cur); // 本轮末尾再来一次
  }
  s.due = t + Math.max(1, s.iv);
  store[k] = s;
  save();
  idx++;
  if (idx >= queue.length){ idx = 0; pick(); return; }
  render();
  if (q === 0) { /* 重来一次已入队 */ }
}

document.querySelectorAll('.actions button').forEach(b => {
  b.addEventListener('click', () => grade(+b.dataset.q));
});

// ---- 键盘（电脑上用）
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); $('card').click(); }
  if (e.key === '1') grade(0);
  if (e.key === '2') grade(1);
  if (e.key === '3') grade(2);
  if (e.key === 'p') { if (cur) speak(cur.e); }
});

bookSel.addEventListener('change', () => { fillUnits(); pick(); });
unitSel.addEventListener('change', pick);

fillUnits();
pick();
</script>
