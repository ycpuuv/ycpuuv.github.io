<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启明 · 教学 心理 规划</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter','Noto Serif SC','PingFang SC','Microsoft YaHei',sans-serif;
    background:#0b0b14;color:#d4d4dc;min-height:100vh;display:flex;flex-direction:column;
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(212,163,115,.04) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(92,141,137,.03) 0%, transparent 50%);
  }
  .hero{text-align:center;padding:52px 20px 28px;position:relative;}
  .hero h1{
    font-size:2.2em;font-weight:700;
    background:linear-gradient(135deg,#d4a373 0%,#e6b17e 40%,#f4a261 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    letter-spacing:6px;
  }
  .hero .sub{color:#5c5c72;font-size:.8em;margin-top:6px;letter-spacing:2px;font-weight:300;}
  .container{max-width:420px;margin:0 auto;padding:0 20px 40px;flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center;}

  /* Normal cards */
  .card{
    display:flex;align-items:center;gap:14px;
    background:#0e0e1e;border-radius:10px;padding:18px 20px;
    border:1px solid #18182a;text-decoration:none;color:inherit;
    transition:all .25s;cursor:pointer;
  }
  .card:hover{background:#131328;border-color:#2a2a48;transform:translateX(4px);}
  .card .icon{
    width:40px;height:40px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:1.15em;flex-shrink:0;
    background:rgba(212,163,115,.08);
  }
  .card .info{flex:1;min-width:0;}
  .card .info .name{font-size:.88em;color:#d0d0da;font-weight:500;}
  .card .info .desc{font-size:.66em;color:#4a4a60;margin-top:2px;}
  .card .badge{
    font-size:.6em;padding:2px 8px;border-radius:8px;
    background:rgba(212,163,115,.1);color:#a08060;letter-spacing:.5px;
  }
  .card .arrow{color:#2a2a40;font-size:.75em;transition:.2s;flex-shrink:0;}
  .card:hover .arrow{color:#d4a373;transform:translateX(3px);}

  /* Special exam banner */
  .special{
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(135deg,rgba(212,163,115,.12),rgba(244,162,97,.05));
    border-radius:12px;padding:16px 20px;
    border:1.5px solid #d4a373;text-decoration:none;color:inherit;
    transition:all .25s;position:relative;overflow:hidden;
  }
  .special::before{
    content:'🔥 考前最后一眼';position:absolute;top:6px;right:10px;
    font-size:.55em;color:#d4a373;letter-spacing:1px;opacity:.6;
  }
  .special:hover{background:rgba(212,163,115,.18);border-color:#f4a261;transform:translateX(4px);}
  .special .icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3em;flex-shrink:0;background:rgba(212,163,115,.12);}
  .special .info{flex:1;min-width:0;}
  .special .info .name{font-size:.92em;color:#f4e8d0;font-weight:600;}
  .special .info .desc{font-size:.65em;color:#a08060;margin-top:2px;}
  .special .arrow{color:#d4a373;font-size:.8em;transition:.2s;flex-shrink:0;}
  .special:hover .arrow{color:#f4a261;transform:translateX(4px);}
  @media(max-width:480px){
    .hero{padding:36px 16px 20px;}
    .hero h1{font-size:1.6em;}
    .container{gap:6px;padding:0 14px 30px;}
    .card{padding:14px 16px;}
  }
</style>
</head>
<body>
<div class="hero">
  <h1>启 明</h1>
  <p class="sub">教学 · 心理 · 规划</p>
</div>
<div class="container">
  <a class="card" href="jiaoxue.html">
    <div class="icon">📐</div>
    <div class="info"><div class="name">教学资源</div><div class="desc">物理课件 · 题库 · 视频</div></div>
    <span class="badge">46</span>
    <span class="arrow">→</span>
  </a>
  <a class="card" href="物理/index.html">
    <div class="icon">⚛</div>
    <div class="info"><div class="name">物理课件</div><div class="desc">交互动画 · 一题多解 · 专题精讲</div></div>
    <span class="badge">38</span>
    <span class="arrow">→</span>
  </a>
  <a class="card" href="sixiang.html">
    <div class="icon">🧠</div>
    <div class="info"><div class="name">教学思考</div><div class="desc">提分方法论 · 课堂设计</div></div>
    <span class="badge">4</span>
    <span class="arrow">→</span>
  </a>
  <a class="card" href="xinli.html">
    <div class="icon">🌿</div>
    <div class="info"><div class="name">心理咨询</div><div class="desc">个案思考 · 心理科普</div></div>
    <span class="badge">待</span>
    <span class="arrow">→</span>
  </a>
  <a class="card" href="guihua.html">
    <div class="icon">🧭</div>
    <div class="info"><div class="name">人生规划</div><div class="desc">读书笔记 · 人生设计</div></div>
    <span class="badge">3</span>
    <span class="arrow">→</span>
  </a>
</div>
<footer>启明 · 📧 ycpuuv@163.com</footer>
</body>
</html>
