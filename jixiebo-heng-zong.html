<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>机械波：横波与纵波 · 交互演示</title>
<style>
:root{--bg:#0b0f14;--panel:#141b23;--line:#26303b;--txt:#e8eef5;--dim:#8b98a6;
--amber:#ffc857;--cyan:#4dd0e1;--violet:#bc8cff;--green:#7ee787;--red:#ff7b72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:10px 10px 26px}
h1{font-size:19px;margin:6px 0 2px}
h1 em{font-style:normal;color:var(--amber)}
.sub{font-size:12.5px;color:var(--dim);margin-bottom:8px;line-height:1.6}
#cv{width:100%;display:block;border-radius:12px;background:#0f151d;border:1px solid var(--line)}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 14px;margin-top:10px}
.row{display:flex;align-items:center;gap:8px;font-size:13px}
.row label{min-width:56px;color:var(--dim)}
.row input[type=range]{flex:1;accent-color:var(--cyan);height:22px}
.row b{color:var(--amber);min-width:56px;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
button{font-size:13.5px;font-weight:600;padding:7px 13px;border:1px solid var(--line);
border-radius:9px;background:var(--panel);color:var(--txt);cursor:pointer}
button:active{transform:scale(.97)}
button.on{background:#123;border-color:var(--cyan);color:var(--cyan)}
button.play{background:#12341f;border-color:#2ea043;color:#8ff0a4}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.kv{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv i{display:block;font-style:normal;font-size:11.5px;color:var(--dim);margin-bottom:2px}
.kv span{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.foot{margin-top:12px;font-size:12.5px;color:var(--dim);line-height:1.75;
border-top:1px solid var(--line);padding-top:10px}
.foot b{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">
  <h1>机械波：<em>横波</em> 与 <em>纵波</em></h1>
  <div class="sub">上面一条绳，质点<b>上下</b>振动；下面一串点，质点<b>左右</b>振动。两列波同频同速，只是质点振动的方向不一样。</div>
  <canvas id="cv"></canvas>

  <div class="ctrl">
    <div class="row"><label>频率 f</label><input id="sf" type="range" min="0.3" max="1.6" step="0.05" value="0.6"><b id="vf">0.60 Hz</b></div>
    <div class="row"><label>波速 v</label><input id="sv" type="range" min="0.4" max="2.4" step="0.05" value="1.2"><b id="vv">1.20 m/s</b></div>
    <div class="row"><label>振幅 A</label><input id="sa" type="range" min="0.4" max="1.4" step="0.05" value="1"><b id="va">1.00 m</b></div>
    <div class="row"><label>播放</label><input id="ss" type="range" min="0.15" max="1.4" step="0.05" value="0.45"><b id="vs">0.45×</b></div>
  </div>

  <div class="btns">
    <button id="bp" class="play">⏸ 暂停</button>
    <button id="br">↺ 从头</button>
    <button id="bm" class="on">标记质点</button>
    <button id="bg" class="on">密部/疏部</button>
    <button data-f="0.3">低频</button>
    <button data-f="0.9">中频</button>
    <button data-f="1.6">高频</button>
  </div>

  <div class="readout">
    <div class="kv"><i>波长 λ = v / f</i><span id="rl" style="color:#4dd0e1">2.00 m</span></div>
    <div class="kv"><i>周期 T = 1 / f</i><span id="rt" style="color:#ffc857">1.67 s</span></div>
    <div class="kv"><i>角频率 ω = 2πf</i><span id="rw" style="color:#bc8cff">3.77 rad/s</span></div>
    <div class="kv"><i>质点最大速度 vₘ = ωA</i><span id="rm" style="color:#7ee787">3.77 m/s</span></div>
  </div>

  <div class="foot">
    <b>横波：</b>质点的振动方向<b>垂直</b>于波的传播方向（绳、水面、光）。<br>
    <b>纵波：</b>质点的振动方向<b>平行</b>于波的传播方向，形成<b>密部与疏部</b>（声波、弹簧纵波）。<br>
    <b>共同点：</b>质点只在原地附近振动，<b>不随波迁移</b>；波传的是振动形式和能量。两种波都满足 λ = vT = v/f。
  </div>
</div>

<script>
(function(){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  let f=0.6, v=1.2, A=1, SPD=0.45, t=0, playing=true;
  let mark=true, showComp=true, L=null;
  const $=id=>document.getElementById(id);
  const sf=$('sf'), sv=$('sv'), sa=$('sa'), ss=$('ss'), bp=$('bp');
  sf.oninput=e=>{f=+e.target.value; $('vf').textContent=f.toFixed(2)+' Hz';};
  sv.oninput=e=>{v=+e.target.value; $('vv').textContent=v.toFixed(2)+' m/s';};
  sa.oninput=e=>{A=+e.target.value; $('va').textContent=A.toFixed(2)+' m';};
  ss.oninput=e=>{SPD=+e.target.value; $('vs').textContent=SPD.toFixed(2)+'×';};
  bp.onclick=()=>{playing=!playing; bp.textContent=playing?'⏸ 暂停':'▶ 播放';};
  $('br').onclick=()=>{t=0;};
  $('bm').onclick=e=>{mark=!mark; e.target.classList.toggle('on',mark);};
  $('bg').onclick=e=>{showComp=!showComp; e.target.classList.toggle('on',showComp);};
  document.querySelectorAll('[data-f]').forEach(b=>{
    b.onclick=()=>{f=+b.dataset.f; sf.value=f; $('vf').textContent=f.toFixed(2)+' Hz';};
  });

  function resize(){
    const w=Math.min(cv.parentElement.clientWidth,1040);
    const h=Math.round(Math.max(420, Math.min(620, w*0.54)));
    const dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const PW=w, PH=h;
    const x0=Math.round(PW*0.085), x1=PW-26;
    L={PW,PH,x0,x1,
       yT:Math.round(PH*0.24),      // 横波平衡线
       yL:Math.round(PH*0.70),      // 纵波所在行
       ampT:Math.round(PH*0.16)};
  }
  window.addEventListener('resize',resize);

  const kOf=()=>2*Math.PI*f/v;
  const wOf=()=>2*Math.PI*f;
  // 横波：y = A sin(kx - ωt)
  const waveY=xx=>A*Math.sin(kOf()*xx - wOf()*t);

  function arrow(x1,y1,x2,y2,color,wid,head){
    const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
    if(len<2.5) return;
    const a=Math.atan2(dy,dx),hs=head||8;
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=wid;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-hs*Math.cos(a-0.4),y2-hs*Math.sin(a-0.4));
    ctx.lineTo(x2-hs*Math.cos(a+0.4),y2-hs*Math.sin(a+0.4));
    ctx.closePath(); ctx.fill();
  }

  function draw(){
    if(!L) resize();
    const {PW,PH,x0,x1,yT,yL,ampT}=L;
    const Lm=(x1-x0)/2.4;          // 每米像素（视场 2.4 m）
    const k=kOf(), w=wOf();

    ctx.clearRect(0,0,PW,PH);

    // ---------- 上：横波 ----------
    ctx.fillStyle='#7ee787'; ctx.font='bold 13px system-ui';
    ctx.fillText('横波 · 质点上下振动（⊥ 传播方向）', x0, yT-ampT-30);

    ctx.strokeStyle='#2c3743'; ctx.lineWidth=1.4; ctx.setLineDash([4,5]);
    ctx.beginPath(); ctx.moveTo(x0-8,yT); ctx.lineTo(x1,yT); ctx.stroke(); ctx.setLineDash([]);

    // 波形
    ctx.strokeStyle='#4dd0e1'; ctx.lineWidth=3; ctx.lineJoin='round';
    ctx.beginPath();
    for(let px=x0; px<=x1; px+=2){
      const xx=(px-x0)/Lm;
      const yy=yT-waveY(xx)*ampT/1.4*1.0;
      px===x0?ctx.moveTo(px,yy):ctx.lineTo(px,yy);
    }
    ctx.stroke();

    // 绳上的质点
    ctx.fillStyle='#9fe8ff';
    for(let xx=0; xx<=2.4; xx+=0.12){
      const px=x0+xx*Lm;
      if(px>x1) break;
      const yy=yT-waveY(xx)*ampT/1.4;
      ctx.beginPath(); ctx.arc(px,yy,2.6,0,Math.PI*2); ctx.fill();
    }

    // 标记质点（x=1.0 m 处）+ 振动方向箭头
    if(mark){
      const xx=1.0, px=x0+xx*Lm, yy=yT-waveY(xx)*ampT/1.4;
      const vy=Math.cos(k*xx-w*t);          // dy/dt 方向
      ctx.fillStyle='#ff7b72'; ctx.beginPath(); ctx.arc(px,yy,6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      arrow(px,yy,px,yy-vy*34*1.0,'#ff7b72',2.6);
      ctx.fillStyle='#ff7b72'; ctx.font='bold 12px system-ui';
      ctx.fillText('质点只上下动', px+10, yy-30);
    }

    // 波速方向
    arrow(x1-150, yT-ampT-14, x1-64, yT-ampT-14, '#ffc857', 2.4, 10);
    ctx.fillStyle='#ffc857'; ctx.font='bold 12px system-ui';
    ctx.fillText('波速 v →', x1-150, yT-ampT-22);

    // ---------- 下：纵波 ----------
    ctx.fillStyle='#ffc857'; ctx.font='bold 13px system-ui';
    ctx.fillText('纵波 · 质点左右振动（∥ 传播方向）→ 疏密相间', x0, yL-72);

    const N=70, uPix=A*54;      // 纵向振幅（像素），够大才看得出疏密
    const dots=[];
    for(let i=0;i<N;i++){
      const xx=2.4*i/(N-1);
      const u=A*Math.sin(k*xx-w*t);        // 沿 x 的位移（m）
      dots.push({xx, px:x0+xx*Lm+u*uPix});
    }
    // 密度条：越密越亮，一眼看出密部/疏部
    ctx.save();
    for(let i=0;i<dots.length-1;i++){
      const gap=dots[i+1].px-dots[i].px;
      const a=Math.max(0,Math.min(1,(14-gap)/7))*0.55;
      ctx.fillStyle='rgba(255,200,87,'+a.toFixed(3)+')';
      ctx.fillRect(dots[i].px, yL-17, Math.max(1,gap), 34);
    }
    ctx.restore();

    ctx.fillStyle='#ffd97a';
    for(const d of dots){
      if(d.px<x0-10||d.px>x1+10) continue;
      ctx.beginPath(); ctx.arc(d.px,yL,2.8,0,Math.PI*2); ctx.fill();
    }

    // 标记质点
    if(mark){
      const xx=1.0;
      const u=A*Math.sin(k*xx-w*t);
      const px=x0+xx*Lm+u*uPix;
      const vu=Math.cos(k*xx-w*t);
      ctx.fillStyle='#ff7b72'; ctx.beginPath(); ctx.arc(px,yL,6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      arrow(px,yL,px+vu*30,yL,'#ff7b72',2.6);
      ctx.fillStyle='#ff7b72'; ctx.font='bold 12px system-ui';
      ctx.fillText('质点只左右动', px+10, yL+30);
    }

    // 波速方向
    arrow(x1-150, yL+44, x1-64, yL+44, '#ffc857', 2.4, 10);
    ctx.fillStyle='#ffc857'; ctx.font='bold 12px system-ui';
    ctx.fillText('波速 v →', x1-150, yL+60);

    // 密部/疏部标注
    if(showComp){
      // 找相邻点间距的极小/极大
      let iMin=1,iMax=1,dMin=1e9,dMax=-1e9;
      for(let i=1;i<dots.length-1;i++){
        const d=dots[i+1].px-dots[i].px;
        if(d<dMin){dMin=d;iMin=i;}
        if(d>dMax){dMax=d;iMax=i;}
      }
      ctx.font='bold 12px system-ui';
      ctx.fillStyle='#ff9b93';
      ctx.fillText('密部', dots[iMin].px-14, yL-34);
      ctx.fillStyle='#9fd3ff';
      ctx.fillText('疏部', dots[iMax].px-14, yL-34);
    }

    // 波长标注（横波上）
    const lam=v/f;
    const nW=Math.min(2, 2.4/lam);
    if(lam<=2.4){
      const pxA=x0+0.15*Lm, pxB=dots?0:0;
      const xA=0.15, xB=xA+lam;
      if(xB*Lm+x0<=x1){
        const sA=x0+xA*Lm, sB=x0+xB*Lm;
        const yy=yT+ampT+26;
        ctx.strokeStyle='#bc8cff'; ctx.lineWidth=1.6; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(sA,yy); ctx.lineTo(sB,yy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sA,yy-6); ctx.lineTo(sA,yy+6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sB,yy-6); ctx.lineTo(sB,yy+6); ctx.stroke();
        ctx.fillStyle='#bc8cff'; ctx.font='bold 12px system-ui';
        ctx.fillText('λ = '+lam.toFixed(2)+' m', (sA+sB)/2-32, yy-8);
      }
    }
  }

  function ui(){
    $('rl').textContent=(v/f).toFixed(2)+' m';
    $('rt').textContent=(1/f).toFixed(2)+' s';
    $('rw').textContent=(2*Math.PI*f).toFixed(2)+' rad/s';
    $('rm').textContent=(2*Math.PI*f*A).toFixed(2)+' m/s';
  }

  let last=performance.now();
  function loop(now){
    const dt=Math.min((now-last)/1000,0.05); last=now;
    if(playing) t+=dt*SPD;
    draw(); ui();
    requestAnimationFrame(loop);
  }
  resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
