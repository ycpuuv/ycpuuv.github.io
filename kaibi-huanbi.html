<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>开环 vs 闭环</title>
<style>
  html,body{margin:0;padding:0;background:#0b111c;color:#e8eefc;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    -webkit-text-size-adjust:100%;overflow-x:hidden;}
  #wrap{max-width:1100px;margin:0 auto;padding:10px 12px 16px;}
  canvas{display:block;width:100%;border-radius:14px;touch-action:manipulation;}
  #bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
    margin-top:12px;padding:0 4px;}
  button{flex:0 0 auto;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid #2b3a55;
    background:#182236;color:#e8eefc;font-size:16px;font-weight:600;letter-spacing:.5px;
    font-family:inherit;cursor:pointer;}
  button:active{transform:scale(.97);background:#22314c;}
  button.primary{background:#1d6ef2;border-color:#1d6ef2;color:#fff;}
  button.on{background:#13b58a;border-color:#13b58a;color:#fff;}

  @media (max-width:480px){
    button{min-height:42px;padding:0 12px;font-size:14.5px;letter-spacing:0;}
    #bar{gap:8px;}
    #hint{font-size:12.5px;}
  }
  #hint{width:100%;text-align:center;font-size:13.5px;color:#7f92b3;margin-top:6px;line-height:1.6;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="bar">
    <button id="btnMode" class="primary">切到：学习版</button>
    <button id="btnReplay">重新演示</button>
    <button id="btnSlow" class="on">速度：正常</button>
  </div>
  <div id="hint">同一套输入，只差一个"看结果"的动作 —— 两条曲线就分开了</div>
</div>
<script>
(function(){
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = 900, H = 620, DPR = 1;

  var C = {
    bg:'#0b111c', panel:'#141d2e', panel2:'#101828', line:'#23304a',
    text:'#e8eefc', dim:'#8fa3c4', faint:'#5b6f92',
    hot:'#ff8a5b', cool:'#4dd4ac', gold:'#ffd166', blue:'#6ea8ff'
  };

  var mode = (location.hash === '#study') ? 'study' : 'temp';
  var t = 0;                   // 模拟时间(秒)
  var speed = 1;
  var target = 26;             // 目标温度
  var T1 = 20, T2 = 20;        // 开环/闭环 温度
  var s1 = 62, s2 = 62;        // 学习版 成绩
  var hist1 = [], hist2 = [];  // 曲线历史
  var acOn = false;
  var flash = 0;

  /* ---------- 尺寸 ---------- */
  function resize(){
    var cssW = Math.min(1100, window.innerWidth) - 24;
    if (cssW < 300) cssW = 300;
    var mobile = cssW < 780;
    W = cssW;
    H = mobile ? 650 : 600;
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    draw();
  }
  window.addEventListener('resize', resize);

  /* ---------- 工具 ---------- */
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }
  function txt(s,x,y,size,color,align,weight){
    ctx.font = (weight||'500') + ' ' + size + 'px -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
    ctx.fillStyle = color || C.text;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(s, x, y);
  }
  function fmt(v,d){ return v.toFixed(d===undefined?1:d); }

  /* ---------- 布局 ---------- */
  function layout(){
    var mobile = W < 780;
    var pad = 14;
    var headH = mobile ? 58 : 66;
    var chartH = mobile ? 158 : 186;
    var bottomH = 34;
    var bodyTop = headH + 6;
    var bodyH = H - bodyTop - chartH - bottomH - 10;
    var gx = 10;
    var pw = mobile ? (W - pad*2) : (W - pad*2 - gx)/2;
    var ph = mobile ? (bodyH - gx)/2 : bodyH;
    var p1 = {x:pad, y:bodyTop, w:pw, h:ph};
    var p2 = mobile ? {x:pad, y:bodyTop+ph+gx, w:pw, h:ph} : {x:pad+pw+gx, y:bodyTop, w:pw, h:ph};
    var chart = {x:pad, y:bodyTop + (mobile ? bodyH : bodyH) + 8, w:W-pad*2, h:chartH};
    if (mobile) chart.y = bodyTop + bodyH + 8;
    return {p1:p1, p2:p2, chart:chart, bottom: H - bottomH};
  }

  /* ---------- 画面：温度版 ---------- */
  function drawPanelTemp(box, closed, T, isOn){
    var x=box.x, y=box.y, w=box.w, h=box.h;
    ctx.fillStyle = C.panel; rr(x,y,w,h,14); ctx.fill();
    ctx.strokeStyle = closed ? 'rgba(77,212,172,.45)' : 'rgba(255,138,91,.45)';
    ctx.lineWidth = 1.4; rr(x,y,w,h,14); ctx.stroke();

    var accent = closed ? C.cool : C.hot;
    var title = closed ? '空调 · 闭环' : '电热毯 · 开环';
    txt(title, x+14, y+26, w<420?15:17, accent, 'left', '700');
    txt('目标 '+fmt(target,0)+'℃', x+w-14, y+26, 12, C.gold, 'right','700');

    // 温度计
    var gx = x+18, gy = y+40, gw = w<420?14:16, gh = h-72;
    ctx.fillStyle = '#0c1422'; rr(gx-3,gy-3,gw+6,gh+6,8); ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth=1; rr(gx-3,gy-3,gw+6,gh+6,8); ctx.stroke();
    var frac = Math.max(0, Math.min(1, (T-16)/(44-16)));
    var barH = gh*frac;
    var grd = ctx.createLinearGradient(0, gy+gh, 0, gy);
    grd.addColorStop(0, closed?'#1f7a63':'#8a3f22');
    grd.addColorStop(1, accent);
    ctx.fillStyle = grd;
    rr(gx, gy+gh-barH, gw, barH, gw/2); ctx.fill();
    // 目标线
    var ty = gy + gh*(1-(target-16)/(44-16));
    ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle = C.gold; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(gx-8, ty); ctx.lineTo(gx+gw+8, ty); ctx.stroke(); ctx.restore();
    // 目标值标在标题行右侧（避免压边）
    // 当前温度
    txt(fmt(T,1)+'℃', gx+gw+12, gy+16, w<420?18:20, accent, 'left','700');

    // 房间
    var rx = gx+gw+72, ry = y+46, rw = w - (rx-x) - 16, rh = h-96;
    if (rw < 60) { rx = gx+gw+58; rw = w-(rx-x)-14; }
    ctx.fillStyle = C.panel2; rr(rx,ry,rw,rh,10); ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth=1; rr(rx,ry,rw,rh,10); ctx.stroke();

    if (!closed){
      // 电热毯：地上一条发热带，一直亮
      var heatA = 0.55 + 0.2*Math.sin(t*3);
      ctx.fillStyle = 'rgba(255,138,91,'+heatA+')';
      rr(rx+12, ry+rh-16, rw-24, 8, 4); ctx.fill();
      for (var i=0;i<3;i++){
        var a = 0.14 + 0.10*Math.sin(t*2 + i*1.1);
        ctx.fillStyle = 'rgba(255,138,91,'+a+')';
        rr(rx+18+i*6, ry+rh-30-i*12, rw-36-i*12, 7, 4); ctx.fill();
      }
      txt('开关：一直开', rx+12, ry+22, w<420?12.5:13.5, C.hot, 'left','600');
      txt('它不知道房间几度', rx+12, ry+42, w<420?12:13, C.dim, 'left','400');
      if (T > 32) txt('已经 '+fmt(T,0)+'℃ 了，它还在加热', rx+12, ry+rh-28, w<420?11.5:12.5, C.hot,'left','600');
    } else {
      // 空调：墙上挂机，开/停机
      var ax = rx+12, ay = ry+12, aw = Math.min(84, rw*0.52), ah = 22;
      ctx.fillStyle = acOn ? 'rgba(77,212,172,.85)' : '#2c3a52';
      rr(ax, ay, aw, ah, 6); ctx.fill();
      txt(acOn?'制冷中':'已停机', ax+aw/2, ay+15.5, 11.5, acOn?'#0b111c':C.dim, 'center','700');
      // 冷风
      if (acOn){
        for (var k=0;k<4;k++){
          var yy = ay+ah+8+k*9;
          ctx.strokeStyle = 'rgba(77,212,172,'+(0.5-k*0.1)+')';
          ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(ax+10+ (k%2)*8, yy); ctx.lineTo(ax+aw-10-(k%2)*8, yy); ctx.stroke();
        }
      }
      // 反馈回路文字
      var ly = ry + rh - 46;
      txt('测温', rx+10, ly, 12, C.dim,'left','600');
      txt('→ 比较 → 修正', rx+10, ly+17, 12, C.cool,'left','600');
      txt(acOn ? 'T 高于目标，开制冷' : 'T 接近目标，停机', rx+10, ly+34, w<420?11.5:12, C.dim,'left','400');
    }
  }

  /* ---------- 画面：学习版 ---------- */
  function drawPanelStudy(box, closed, score, step){
    var x=box.x, y=box.y, w=box.w, h=box.h;
    ctx.fillStyle = C.panel; rr(x,y,w,h,14); ctx.fill();
    var accent = closed ? C.cool : C.hot;
    ctx.strokeStyle = closed ? 'rgba(77,212,172,.45)' : 'rgba(255,138,91,.45)';
    ctx.lineWidth=1.4; rr(x,y,w,h,14); ctx.stroke();

    txt(closed?'闭环的学生':'开环的学生', x+14, y+26, w<420?15:17, accent,'left','700');
    txt(closed?'卡住 → 归因 → 改法 → 检验':'做题 → 对答案 → 下一题', x+14, y+48,
        w<420?12.5:13.5, C.dim,'left','500');

    // 分数
    txt(fmt(score,0)+' 分', x+14, y+80, w<420?22:24, accent,'left','700');

    // 进度条
    var bx = x+14, by = y+96, bw = w-28, bh = 10;
    ctx.fillStyle = '#0c1422'; rr(bx,by,bw,bh,5); ctx.fill();
    ctx.fillStyle = accent; rr(bx,by,bw*Math.max(0,Math.min(1,(score-50)/55)),bh,5); ctx.fill();

    // 流程格子
    var items = closed ? ['卡在哪一步','当时怎么想','下次怎么动','同类题检验']
                       : ['做','对答案','抄下来','下一题'];
    var n = items.length, cy = y+118, chh = Math.min(34, h-138);
    var cw = (w-28-8*(n-1))/n;
    for (var i=0;i<n;i++){
      var cx2 = x+14 + i*(cw+8);
      var active = (i === step);
      ctx.fillStyle = active ? (closed?'rgba(77,212,172,.22)':'rgba(255,138,91,.22)') : '#0e1626';
      rr(cx2, cy, cw, chh, 7); ctx.fill();
      ctx.strokeStyle = active ? accent : C.line; ctx.lineWidth = active?1.6:1;
      rr(cx2, cy, cw, chh, 7); ctx.stroke();
      var fs = (w<420?11:12);
      txt(items[i], cx2+cw/2, cy+chh/2+4, fs, active?accent:C.dim,'center','600');
    }
    // 「我的规则」清单：空洞版 vs 沉淀版
    if (h > 240){
      var ry2 = y+162, rh2 = h-162-30;
      ctx.fillStyle = '#0e1626'; rr(x+14, ry2, w-28, rh2, 10); ctx.fill();
      ctx.strokeStyle = C.line; ctx.lineWidth = 1; rr(x+14, ry2, w-28, rh2, 10); ctx.stroke();
      txt('我的规则', x+26, ry2+22, 12.5, C.faint, 'left','700');
      var rules = closed
        ? ['① 大题先画受力图，再列式','② 阅读先看题干，再读文章','③ 单位先统一，再代数字']
        : ['（空）'];
      for (var ri=0; ri<rules.length; ri++){
        txt(rules[ri], x+26, ry2+46+ri*21, w<420?11.5:12.5,
            closed?C.cool:C.faint, 'left', closed?'600':'400');
      }
      if (!closed) txt('抄了 12 道题，没有一条能用来做下一道', x+26, ry2+rh2-12, 11, C.faint,'left','400');
    }
    var note = closed ? '每次错误都变成一条能用的规则' : '错误只是被搬了个地方';
    txt(note, x+14, y+h-14, w<420?12:12.5, C.faint,'left','400');
  }

  /* ---------- 曲线 ---------- */
  function drawChart(box){
    var x=box.x, y=box.y, w=box.w, h=box.h;
    ctx.fillStyle = C.panel2; rr(x,y,w,h,14); ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth=1; rr(x,y,w,h,14); ctx.stroke();

    var pl = 44, pr = 14, pt = 26, pb = 30;
    var x0 = x+pl, y0 = y+pt, x1 = x+w-pr, y1 = y+h-pb;
    var isTemp = (mode==='temp');
    var lo = isTemp ? 16 : 45, hi = isTemp ? 44 : 100;

    txt(isTemp?'温度 / ℃':'成绩 / 分', x+12, y+16, 12, C.faint,'left','600');
    txt('时间 →', x+w-pr, y+h-10, 11.5, C.faint,'right','500');

    // 网格
    ctx.strokeStyle = '#1b2740'; ctx.lineWidth = 1;
    for (var g=0; g<=4; g++){
      var yy = y0 + (y1-y0)*g/4;
      ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x1,yy); ctx.stroke();
      txt(fmt(hi-(hi-lo)*g/4,0), x0-7, yy+4, (W<780?11:10.5), C.faint,'right','500');
    }
    // 目标线
    var tv = isTemp ? target : 90;
    var tyy = y1 - (y1-y0)*((tv-lo)/(hi-lo));
    ctx.save(); ctx.setLineDash([6,5]); ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0,tyy); ctx.lineTo(x1,tyy); ctx.stroke(); ctx.restore();
    txt(isTemp?('目标 '+fmt(target,0)+'℃'):'目标 90 分', x1-4, tyy-7, 11, C.gold,'right','600');

    function curve(hist, color){
      if (hist.length < 2) return;
      ctx.beginPath();
      for (var i=0;i<hist.length;i++){
        var px = x0 + (x1-x0)*(i/Math.max(1,hist.length-1));
        var py = y1 - (y1-y0)*((Math.max(lo,Math.min(hi,hist[i]))-lo)/(hi-lo));
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.lineJoin='round'; ctx.stroke();
    }
    curve(hist1, C.hot);
    curve(hist2, C.cool);

    // 图例
    var lx = x1-150, ly = y+16;
    ctx.fillStyle = C.hot; rr(lx, ly-8, 10, 10, 3); ctx.fill();
    txt('开环', lx+15, ly+1, 11.5, C.dim,'left','600');
    ctx.fillStyle = C.cool; rr(lx+56, ly-8, 10, 10, 3); ctx.fill();
    txt('闭环', lx+71, ly+1, 11.5, C.dim,'left','600');
  }

  /* ---------- 主绘制 ---------- */
  function draw(){
    var L = layout();
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);

    // 标题
    var mobile = W < 780;
    txt('开环 vs 闭环', 14, mobile?30:34, mobile?22:26, C.text,'left','800');
    txt(mode==='temp'
        ? '同样在加热：一个只管加热，一个会看温度'
        : '同样在努力：一个只做题，一个会归因',
        14, mobile?50:58, mobile?13:14, C.dim,'left','500');

    if (mode==='temp'){
      drawPanelTemp(L.p1, false, T1, false);
      drawPanelTemp(L.p2, true, T2, acOn);
    } else {
      drawPanelStudy(L.p1, false, s1, 1 + (Math.floor(t/4)%3));
      drawPanelStudy(L.p2, true, s2, Math.floor(t/3)%4);
    }
    drawChart(L.chart);

    // 底部过渡语
    var msg = mode==='temp'
      ? '开环只看输入，闭环看结果 —— 差别不在功率，在"知不知道自己几度"'
      : '差距不在刷了多少题，在错的那道题有没有被追问过';
    txt(msg, W/2, H-10, mobile?11.5:12.5, C.gold,'center','600');
  }

  /* ---------- 物理 ---------- */
  function step(dt){
    t += dt*speed;
    if (mode==='temp'){
      // 开环：恒定功率加热，对流失温
      T1 += dt*speed*(1.15 - 0.055*(T1-20));
      // 闭环：测量-比较-执行
      var err = T2 - target;
      if (err > 0.35){ T2 -= dt*speed*0.85; acOn = true; }
      else if (err < -0.35){ T2 += dt*speed*0.55; acOn = false; }
      else { acOn = false; T2 += (Math.random()-0.5)*dt*speed*0.12; }
      T2 = Math.max(16, Math.min(44, T2));
      T1 = Math.max(16, Math.min(44, T1));
      if (hist1.length===0 || t - lastPush > 0.12){ hist1.push(T1); hist2.push(T2); lastPush = t; }
    } else {
      // 学习版：开环成绩在 62 附近波动；闭环阶梯上升
      s1 = 62 + Math.sin(t*0.9)*3 + (Math.random()-0.5)*1.6;
      var cap = Math.min(88, 62 + Math.floor(t/6)*3.2);
      s2 += (cap - s2)*0.06;
      if (hist1.length===0 || t - lastPush > 0.12){ hist1.push(s1); hist2.push(s2); lastPush = t; }
    }
    // 历史长度封顶
    if (hist1.length > 70){ hist1.shift(); hist2.shift(); }
    // 循环
    if (t > 60){ t = 0; hist1.length = 0; hist2.length = 0;
      if (mode==='temp'){ T1 = 20; T2 = 20; } else { s1 = 62; s2 = 62; } }
  }
  var lastPush = 0;

  /* ---------- 循环 ---------- */
  var last = 0;
  function loop(ts){
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts-last)/1000);
    last = ts;
    step(dt);
    draw();
    requestAnimationFrame(loop);
  }

  /* ---------- 交互 ---------- */
  var btnMode = document.getElementById('btnMode');
  var btnReplay = document.getElementById('btnReplay');
  var btnSlow = document.getElementById('btnSlow');

  btnMode.addEventListener('click', function(){
    mode = (mode==='temp') ? 'study' : 'temp';
    t = 0; hist1.length = 0; hist2.length = 0; lastPush = 0;
    if (mode==='temp'){ T1 = 20; T2 = 20; btnMode.textContent='切到：学习版'; }
    else { s1 = 62; s2 = 62; btnMode.textContent='切到：温度版'; }
    draw();
  });
  btnReplay.addEventListener('click', function(){
    t = 0; hist1.length = 0; hist2.length = 0; lastPush = 0;
    if (mode==='temp'){ T1 = 20; T2 = 20; } else { s1 = 62; s2 = 62; }
    draw();
  });
  btnSlow.addEventListener('click', function(){
    speed = (speed === 1) ? 0.55 : 1;
    btnSlow.textContent = (speed===1) ? '速度：正常' : '速度：慢放';
    btnSlow.classList.toggle('on', speed===1);
  });

  // 快进（?t=秒，用于演示和截图）
  var pre = parseFloat((location.search.match(/[?&]t=([\d.]+)/)||[])[1] || 0);
  if (pre > 0){ for (var pi=0; pi<pre/0.05; pi++) step(0.05); }

  if (mode === 'study'){ btnMode.textContent = '切到：温度版'; }

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
