function renderCard(v) {
  const url = `https://www.bilibili.com/video/${v.bvid}`;
  const plays = v.plays >= 10000 ? (v.plays/10000).toFixed(1)+'万' : v.plays;
  const badgeHtml = v.badge ? `<span class="badge">${v.badge}</span>` : '';
  return `
    <div class="video-card">
      ${badgeHtml}
      <a href="${url}" target="_blank" title="${v.title}">${v.title}</a>
      <div class="meta">
        <span class="author">👤 ${v.author}</span>
        <span class="plays">▶ ${plays}</span>
        <span class="bvid">${v.bvid}</span>
      </div>
    </div>
  `;
}

function renderGrid(containerId, section) {
  const list = section ? videos.filter(v => v.section === section) : videos;
  document.getElementById(containerId).innerHTML = list.map(renderCard).join('');
}
