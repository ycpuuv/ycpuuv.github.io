<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>两个正弦合成 · 李萨如图</title>
<style>
  :root{--bg:#080c15;--ink:#e9eefb;--dim:#8ea3c4;--gold:#ffc96b;--cyan:#4fd8ff;
        --pink:#ff7ac0;--line:#1d2942;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block}
  #bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,16,28,.95);
    border-top:1px solid var(--line);padding:9px 14px 12px;display:flex;gap:12px;
    align-items:center;flex-wrap:wrap;z-index:5}
  #bar label{font-size:13px;color:var(--dim);white-space:nowrap}
  #bar b{color:var(--gold);font-variant-numeric:tabular-nums}
  input[type=range]{width:135px;accent-color:#5b86c7;vertical-align:middle}
  button{background:#16223a;color:var(--ink);border:1px solid #24344f;border-radius:7px;
    padding:6px 11px;font-size:13px;font-family:inherit;cursor:pointer}
  button:hover{background:#1d2c49}
  button.on{background:#2a3f63;border-color:#5b86c7;color:#fff}
  .rbtn{padding:5px 9px;margin-right:4px;font-variant-numeric:tabular-nums}
  .chk{display:flex;align-items:center;gap:5px;font-size:13px;color:#c9d6ec;cursor:pointer}
  @media (max-width:820px){
    #bar{gap:8px;padding:8px 10px 10px}
    input[type=range]{width:105px}
    .rbtn{padding:4px 7px;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar">
  <span id="btns"></span>
  <label>相位 φ <b id="vp">90°</b></label>
  <input type="range" id="ph" min="0" max="360" step="1" value="90">
  <label>速度 <b id="vs">0.5×</b></label>
  <input type="range" id="sp" min="0.15" max="1" step="0.05" value="0.5">
  <button id="play" class="on">暂停</button>
  <button id="reset">重播</button>
  <label class="chk"><input type="checkbox" id="proj" checked> 投影</label>
</div>
<script>
(function(){
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,XY={},WF={};

const RATIOS=[[1,1],[1,2],[1,3],[2,3],[3,4],[4,5]];
let R=RATIOS[0].slice();       // [a,b]
let phi=Math.PI/2;
let tNow=0, playing=true, speed=0.5, showProj=true;
let holdMsg=0;
const T=2*Math.PI;

function X(t){ return Math.sin(R[0]*t); }
function Y(t){ return Math.sin(R[1]*t+phi); }

/* ---------- 布局 ---------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const barH = W<820 ? 108 : 56;
  const avail = H-barH-8, top=8;
  if(W>=900){
    const side=Math.min(avail*0.95, W*0.5);
    XY={x:(W*0.50-side)/2, y:top+(avail-side)/2, w:side, h:side};
    WF={x:W*0.52, y:top+18, w:W*0.46, h:avail-26};
  }else{
    const side=Math.min(W*0.94, avail*0.56);
    XY={x:(W-side)/2, y:top+16, w:side, h:side};
    WF={x:10, y:top+side+26, w:W-20, h:Math.max(70,avail-side-34)};
  }
}
function view(rect,x0,x1,y0,y1){
  const s=Math.min(rect.w/(x1-x0), rect.h/(y1-y0));
  const ox=rect.x+(rect.w-(x1-x0)*s)/2 - x0*s;
  const oy=rect.y+(rect.h-(y1-y0)*s)/2 + y1*s;
  return {s, X:x=>ox+x*s, Y:y=>oy-y*s};
}

/* ---------- 左：xy 平面 ---------- */
function drawXY(){
  const g=view(XY,-1.32,1.32,-1.32,1.32);
  ctx.save();
  ctx.fillStyle='#0b1220'; ctx.fillRect(XY.x,XY.y,XY.w,XY.h);

  // 网格
  ctx.strokeStyle='rgba(70,95,140,0.20)'; ctx.lineWidth=1;
  for(let i=-4;i<=4;i++){
    const v=i*0.25;
    ctx.beginPath(); ctx.moveTo(g.X(v),g.Y(-1.25)); ctx.lineTo(g.X(v),g.Y(1.25)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(g.X(-1.25),g.Y(v)); ctx.lineTo(g.X(1.25),g.Y(v)); ctx.stroke();
  }
  // 轴
  ctx.strokeStyle='rgba(150,170,200,0.55)'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(g.X(-1.25),g.Y(0)); ctx.lineTo(g.X(1.25),g.Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(g.X(0),g.Y(-1.25)); ctx.lineTo(g.X(0),g.Y(1.25)); ctx.stroke();
  ctx.fillStyle='#93a6c6'; ctx.font='13px "PingFang SC",sans-serif';
  ctx.fillText('x',g.X(1.25)-4,g.Y(0)+17);
  ctx.fillText('y',g.X(0)+7,g.Y(1.25)-5);
  ctx.fillText('+1',g.X(1.0)-6,g.Y(0)+16);
  ctx.fillText('−1',g.X(-1.0)-6,g.Y(0)+16);
  ctx.fillText('+1',g.X(0)+7,g.Y(1.0)+4);
  ctx.fillText('−1',g.X(0)+7,g.Y(-1.0)+4);

  // 完整轮廓（淡）
  ctx.strokeStyle='rgba(255,122,192,0.20)'; ctx.lineWidth=1.4;
  ctx.beginPath();
  for(let i=0;i<=520;i++){
    const t=T*i/520;
    const px=g.X(X(t)), py=g.Y(Y(t));
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();

  // 已走过（亮）
  if(tNow>0.001){
    ctx.strokeStyle='rgba(255,122,192,0.95)'; ctx.lineWidth=2.6;
    ctx.lineJoin='round';
    ctx.beginPath();
    const n=Math.max(2,Math.floor(560*tNow/T));
    for(let i=0;i<=n;i++){
      const t=tNow*i/n;
      const px=g.X(X(t)), py=g.Y(Y(t));
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }

  // 投影
  const cx=g.X(X(tNow)), cy=g.Y(Y(tNow));
  if(showProj){
    ctx.setLineDash([4,5]); ctx.lineWidth=1;
    ctx.strokeStyle='rgba(79,216,255,0.55)';
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,g.Y(0)); ctx.stroke();
    ctx.strokeStyle='rgba(255,201,107,0.55)';
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(g.X(0),cy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#4fd8ff'; ctx.beginPath(); ctx.arc(cx,g.Y(0),6,0,6.283); ctx.fill();
    ctx.fillStyle='#ffc96b'; ctx.beginPath(); ctx.arc(g.X(0),cy,6,0,6.283); ctx.fill();
  }
  // 当前点
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,20);
  gr.addColorStop(0,'rgba(255,122,192,0.55)'); gr.addColorStop(1,'rgba(255,122,192,0)');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(cx,cy,20,0,6.283); ctx.fill();
  ctx.fillStyle='#ff7ac0'; ctx.beginPath(); ctx.arc(cx,cy,7,0,6.283); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.6; ctx.stroke();

  // 标题
  ctx.fillStyle='#e9eefb'; ctx.font='bold 16px "PingFang SC",sans-serif';
  ctx.fillText('合成点 (x, y)', XY.x+10, XY.y+22);
  ctx.restore();
}

/* ---------- 右：两条波形 ---------- */
function drawWF(){
  const padL=52, padR=12;
  const rowH=(WF.h-34)/2;
  const gx={x:WF.x+padL, w:WF.w-padL-padR};
  const mapT=t=>gx.x + (t/T)*gx.w;

  ctx.save();
  ctx.fillStyle='#0b1220'; ctx.fillRect(WF.x,WF.y,WF.w,WF.h);

  const rows=[
    {y0:WF.y+24, h:rowH-14, f:X, col:'#4fd8ff', label:'x(t) = sin('+R[0]+'t)'},
    {y0:WF.y+24+rowH, h:rowH-14, f:Y, col:'#ffc96b', label:'y(t) = sin('+R[1]+'t + φ)'}
  ];

  rows.forEach((row,idx)=>{
    const cy=row.y0+row.h/2+8, amp=Math.max(20,row.h/2-26);
    // 中线
    ctx.strokeStyle='rgba(120,145,185,0.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(gx.x,cy); ctx.lineTo(gx.x+gx.w,cy); ctx.stroke();
    // 曲线
    ctx.strokeStyle=row.col; ctx.lineWidth=2.2; ctx.beginPath();
    for(let i=0;i<=400;i++){
      const t=T*i/400;
      const px=mapT(t), py=cy-amp*row.f(t);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
    // 当前点
    const px=mapT(tNow), py=cy-amp*row.f(tNow);
    ctx.fillStyle=row.col; ctx.beginPath(); ctx.arc(px,py,6,0,6.283); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.4; ctx.stroke();
    // 竖线
    ctx.setLineDash([3,4]); ctx.strokeStyle='rgba(200,215,240,0.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(px,row.y0); ctx.lineTo(px,row.y0+row.h); ctx.stroke();
    ctx.setLineDash([]);
    // 标签
    ctx.fillStyle=row.col; ctx.font='13px "PingFang SC",sans-serif';
    ctx.fillText(row.label, WF.x+8, row.y0+4);
  });

  // 时间轴
  const yAx=WF.y+14+2*rowH-6;
  ctx.strokeStyle='rgba(150,170,200,0.45)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(gx.x,yAx-2); ctx.lineTo(gx.x+gx.w,yAx-2); ctx.stroke();
  ctx.fillStyle='#93a6c6'; ctx.font='12px "PingFang SC",sans-serif';
  ctx.fillText('0', gx.x-4, yAx+13);
  ctx.fillText('2π', gx.x+gx.w-10, yAx+13);
  ctx.fillText('t', gx.x+gx.w-4, yAx+13);

  ctx.fillStyle='#e9eefb'; ctx.font='bold 14px "PingFang SC",sans-serif';
  ctx.fillText('两个输入的波形', WF.x+8, WF.y+13);
  ctx.restore();
}

/* ---------- 顶部提示 ---------- */
function drawHint(){
  const txt='f₁ : f₂ = '+R[0]+' : '+R[1]+'　　φ = '+Math.round(phi*180/Math.PI)+'°';
  ctx.save();
  ctx.fillStyle='#8ea3c4'; ctx.font='14px "PingFang SC",sans-serif';
  ctx.textAlign='right';
  ctx.fillText(txt, W-14, 26);
  ctx.textAlign='left';
  ctx.restore();
}

function frame(){
  ctx.clearRect(0,0,W,H);
  drawXY(); drawWF(); drawHint();
}

/* ---------- 动画 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing){
    if(tNow<T){ tNow=Math.min(T, tNow+dt*speed*(T/10)); }
    else{ holdMsg+=dt; if(holdMsg>1.6){ tNow=0; holdMsg=0; } }
  }
  frame();
  requestAnimationFrame(loop);
}

/* ---------- 控件 ---------- */
const btnBox=document.getElementById('btns');
RATIOS.forEach((r,i)=>{
  const b=document.createElement('button');
  b.className='rbtn'+(i===0?' on':'');
  b.textContent=r[0]+':'+r[1];
  b.onclick=()=>{ R=r.slice(); tNow=0; holdMsg=0;
    [...btnBox.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); };
  btnBox.appendChild(b);
});
document.getElementById('ph').addEventListener('input',e=>{
  phi=parseFloat(e.target.value)*Math.PI/180;
  document.getElementById('vp').textContent=e.target.value+'°'; tNow=0; holdMsg=0;
});
document.getElementById('sp').addEventListener('input',e=>{
  speed=parseFloat(e.target.value);
  document.getElementById('vs').textContent=speed.toFixed(2).replace(/0$/,'')+'×';
});
document.getElementById('play').addEventListener('click',e=>{
  playing=!playing; e.target.textContent=playing?'暂停':'播放';
  e.target.classList.toggle('on',playing);
});
document.getElementById('reset').addEventListener('click',()=>{ tNow=0; holdMsg=0; });
document.getElementById('proj').addEventListener('change',e=>{ showProj=e.target.checked; });

/* hash: #test / #ratio=1:2&phi=90 */
const HK={};
location.hash.slice(1).split('&').forEach(kv=>{
  if(!kv) return; const i=kv.indexOf('=');
  if(i<0) HK[kv]=true; else HK[kv.slice(0,i)]=kv.slice(i+1);
});
if(HK.ratio){
  const p=HK.ratio.split(':').map(Number);
  if(p.length===2) R=p;
  const idx=RATIOS.findIndex(r=>r[0]===R[0]&&r[1]===R[1]);
  if(idx>=0) [...btnBox.children].forEach((c,i)=>c.classList.toggle('on',i===idx));
}
if(HK.phi!==undefined){
  phi=parseFloat(HK.phi)*Math.PI/180;
  document.getElementById('ph').value=HK.phi;
  document.getElementById('vp').textContent=HK.phi+'°';
}
if(HK.t!==undefined) tNow=parseFloat(HK.t);
if(HK.pause){ playing=false; document.getElementById('play').textContent='播放';
  document.getElementById('play').classList.remove('on'); }

if(location.hash.indexOf('test')>=0){
  const out={};
  // 1:1, phi=90 → 应为正圆：max|x²+y²-1|
  R=[1,1]; phi=Math.PI/2;
  let e1=0; for(let i=0;i<=720;i++){ const t=T*i/720;
    e1=Math.max(e1, Math.abs(X(t)*X(t)+Y(t)*Y(t)-1)); }
  out.circleErr=+e1.toFixed(6);
  // phi=0 → 应退化成直线：x-y 相关性
  phi=0; let e2=0; for(let i=0;i<=720;i++){ const t=T*i/720;
    e2=Math.max(e2, Math.abs(X(t)-Y(t))); }
  out.lineErr=+e2.toFixed(6);
  // 闭合性
  phi=Math.PI/2; R=[2,3];
  out.close=[+Math.abs(X(0)-X(T)).toFixed(6),+Math.abs(Y(0)-Y(T)).toFixed(6)];
  // 1:2 在 t=π/2 → x=1, y=sin(π+φ)
  R=[1,2]; phi=0;
  out.eight=[+X(Math.PI/2).toFixed(4),+Y(Math.PI/2).toFixed(4)];
  document.title='TEST '+JSON.stringify(out);
}

window.addEventListener('resize',()=>resize());
resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
